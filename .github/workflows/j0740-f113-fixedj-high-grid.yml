name: J0740 F113 high-grid fixed-J roots around local mass step
on:
  pull_request:
    branches:
      - science/j0740-apr4-firstlaw-gr-pilot-20261117
    paths:
      - 'research/j0740/f113/**'
      - '.github/workflows/j0740-f113-fixedj-high-grid.yml'
permissions:
  contents: read
  actions: read
jobs:
  high_grid_fixed_j_roots:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rns-alberta/rns
          ref: 97e85d325a33e37f702306414533f6cd77812477
          path: rns-upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical dependencies
        run: python -m pip install 'numpy==2.3.5' 'scipy==1.16.3'
      - name: Retrieve and checksum F112 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p results/F112 results/F113
          curl -fLsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14758560850/zip" -o results/F112/F112_artifact.zip
          printf '%s  %s\n' a3e05996d0896c42ce9229631f1139f1630ba473455e15ff56b0267e8925f681 results/F112/F112_artifact.zip | sha256sum -c -
      - name: Validate F112 and fixed-J two-density plan
        env:
          F112_ARTIFACT_ZIP: results/F112/F112_artifact.zip
        run: |
          set -euo pipefail
          python -m unittest discover -s research/j0740/f113 -p 'test_f113_*.py' -v
          python - <<'PY'
          import os
          from pathlib import Path
          from research.j0740.f113.f113_fixedj_high_grid_roots import read_f112, RHO_TICKS_1E10
          result, rows = read_f112(Path(os.environ['F112_ARTIFACT_ZIP']))
          assert len(rows) == 4 and len(RHO_TICKS_1E10) == 2
          print('F112_BASELINE_AND_TWO_HIGH_GRID_FIXEDJ_DENSITIES_PASS')
          PY
      - name: Restore exact pinned F99 EOS and compile pinned RNS C on 1001x2001
        run: |
          set -euo pipefail
          cp research/j0740/f104/F99_DERIVED_1981_node_causal_cold_affine_EOS.rns m99.rns
          printf '%s  %s\n' c99eadee07bf6cbbf78f59b6171ef7e21ffad7d034f4ca4e9b7d85d36d9b4331 m99.rns | sha256sum -c -
          test "$(git -C rns-upstream rev-parse HEAD)" = '97e85d325a33e37f702306414533f6cd77812477'
          cp -a rns-upstream rns1001
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'research/j0740/f81')
          from f81_exact_mass_spin import patch_print_only
          p = Path('rns1001/rns.c')
          p.write_text(patch_print_only(p.read_text()))
          mf = Path('rns1001/makefile')
          t = mf.read_text()
          old = 'HIGHSIZE=-DMDIV=151 -DSDIV=301'
          assert t.splitlines().count(old) == 1
          mf.write_text(t.replace(old, 'HIGHSIZE=-DMDIV=1001 -DSDIV=2001', 1))
          src = Path('rns1001/findmodel.c').read_bytes()
          assert b'float ans, fh,fl,fm,fnew,sroot,xh,xl,xm,xnew,xacc=1e-5;' in src
          PY
          make -C rns1001 CC='gcc -include stdlib.h' rns
          sha256sum rns1001/rns | tee results/F113/F113_HIGH_GRID_NATIVE_C_BINARY_SHA256.txt
      - name: Solve target-J roots at both bracket densities on high grid
        env:
          F112_ARTIFACT_ZIP: results/F112/F112_artifact.zip
        run: |
          set -euo pipefail
          OPENBLAS_NUM_THREADS=1 python -u research/j0740/f113/f113_fixedj_high_grid_roots.py \
            --f112 results/F112/F112_artifact.zip \
            --eos m99.rns --rns "$GITHUB_WORKSPACE/rns1001/rns" \
            --out results/F113/F113_HIGH_GRID_FIXEDJ_ROOTS.json \
            2>&1 | tee results/F113/F113_HIGH_GRID_FIXEDJ_ROOTS.log
      - name: Preserve baseline and all fixed-J trials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: J0740-F113-high-grid-fixed-J-local-roots
          path: |
            results/F112/F112_artifact.zip
            results/F113/
          if-no-files-found: warn
