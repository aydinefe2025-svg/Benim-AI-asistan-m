name: J0740 F47 seven model common mass source-likelihood integral
on:
  pull_request:
    branches:
      - science/j0740-apr4-firstlaw-gr-pilot-20261117
    paths:
      - 'research/j0740/f47/**'
      - '.github/workflows/j0740-f47-common-mass-evidence.yml'
  push:
    branches:
      - science/j0740-apr4-firstlaw-gr-pilot-20261117
    paths:
      - 'research/j0740/f47/f47_mass_integrated_source_likelihood.py'
      - 'research/j0740/f47/test_f47_mass_integrated_likelihood.py'
      - '.github/workflows/j0740-f47-common-mass-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  f47-seven-common-window-integrals:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical packages
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.13,<2'
      - name: Run 16 mathematical and fail-closed regression tests
        run: python -m unittest discover -s research/j0740/f47 -p 'test_f47_mass_integrated_likelihood.py' -v
      - name: Verify F46 ended; accept only explicit, measured single WFF1 internal-node gap
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for n in {1..100}; do
            state=$(gh run view 44286241129 --repo "$GITHUB_REPOSITORY" --json status --jq '.status')
            if [ "$state" = completed ]; then break; fi
            echo "F46 full-GR matrix still ${state}, check ${n}"
            sleep 25
          done
          state=$(gh run view 44286241129 --repo "$GITHUB_REPOSITORY" --json status --jq '.status')
          result=$(gh run view 44286241129 --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')
          echo "F46 state=${state}, conclusion=${result}"
          test "$state" = completed
          # F46 numerical status is NOT asserted green: WFF1 reported one failed
          # internal C/GR mass root. The F47 validator enforces EXACTLY this
          # one exception, a contiguous real [1.95,2.10] interval at all models,
          # no invented node, and direct C/GR solution at every sampled point.
          if [ "$result" != failure ]; then
            echo "Source F46 CI status changed unexpectedly: $result"; exit 4
          fi
          mkdir -p results/F47/curves
          printf '{"source_F46_run_id":44286241129,"source_F46_conclusion":"%s","exception":"WFF1_direct_mass_root_2.0175_failed; 21/22 measured mass nodes, no interpolated star"}\n' "$result" > results/F47/F46_source_exception.json
          # Each GH artifact also contains an identically named F46_manifest.json.
          # Extract to distinct subfolders first; otherwise gh refuses overwrites.
          for name in APR4_EPP ENG MPA1 MS1 MS1B WFF1 WFF2; do
            mkdir -p "results/F47/curves/artifacts/${name}"
            gh run download 44286241129 --repo "$GITHUB_REPOSITORY" \
              --name "j0740-f46-direct-mass-curve-${name}" \
              --dir "results/F47/curves/artifacts/${name}"
            cp "results/F47/curves/artifacts/${name}/${name}_fixed_spin_direct_curve.json" \
              "results/F47/curves/${name}_fixed_spin_direct_curve.json"
            test -s "results/F47/curves/${name}_fixed_spin_direct_curve.json"
          done
      - name: Verify and install immutable F48 direct WFF1 rescue curve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p results/F47/f48 results/F47/input
          curl -fL --retry 3 --max-time 120 -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/aydinefe2025-svg/Benim-AI-asistan-m/actions/artifacts/14421121729/zip' \
            -o results/F47/input/F48.zip
          echo '8217dddfa431d33105421b183b876be3b52cad16525c592459e7f90e8b19b786  results/F47/input/F48.zip' | sha256sum -c -
          unzip -q results/F47/input/F48.zip -d results/F47/f48
          python - <<'PY'
          import hashlib,json,shutil
          from pathlib import Path
          root=Path('results/F47/f48')
          manifest=json.loads((root/'F48_manifest.json').read_text())
          for name,rec in manifest.items():
              p=root/name
              assert p.is_file() and p.stat().st_size==rec['bytes']
              assert hashlib.sha256(p.read_bytes()).hexdigest()==rec['sha256']
          solved=json.loads((root/'F48_WFF1_real_direct_rescue.json').read_text())
          assert solved['status']=='DIRECT_C_GR_WFF1_MISSING_MASS_ROOT_RECOVERED_NOT_PHYSICAL_STABILITY'
          r=solved['root']
          assert r['source']=='F48_REAL_DIRECT_C_RNS_NESTED_BRENT_NO_INTERPOLATED_STAR'
          assert r['target_mass_msun']==2.0175 and abs(r['mass_residual_msun'])<1e-4 and abs(r['spin_residual_hz'])<0.01
          recovered=json.loads((root/'WFF1_fixed_spin_direct_curve_F48_recovered.json').read_text())
          assert recovered['F48_direct_RNS_Root']['source']==r['source']
          assert recovered['F48_source_original_failed_21node_sha256']=='bc4795ab244cc169f5ee5011c3ba1ac4646926a14c982b94d07808d647a955f3'
          assert recovered['common_window_all_roots_present'] and recovered['successful_common_targets']==22
          shutil.copyfile(root/'WFF1_fixed_spin_direct_curve_F48_recovered.json','results/F47/curves/WFF1_fixed_spin_direct_curve.json')
          Path('results/F47/F48_source_receipt.json').write_text(json.dumps({'artifact_id':14421121729,'artifact_sha256':'8217dddfa431d33105421b183b876be3b52cad16525c592459e7f90e8b19b786','status':solved['status'],'root':r,'recovered_curve_sha256':solved['recovered_curve_sha256']},indent=2)+'\n')
          print('PASS F48 immutable artifact, exact nested C/GR root and recovered 22-node WFF1 curve')
          PY
      - name: Download SHA-pinned real source F38 KDE and F44 RNS evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p results/F47/input
          curl -fL --retry 3 --max-time 120 -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/aydinefe2025-svg/Benim-AI-asistan-m/actions/artifacts/14344049589/zip' \
            -o results/F47/input/F38.zip
          curl -fL --retry 3 --max-time 120 -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/aydinefe2025-svg/Benim-AI-asistan-m/actions/artifacts/14413168551/zip' \
            -o results/F47/input/F44.zip
          echo '4bb3220988cb0ecd5cb1ef17370721d3fec82f99dc48f7ca57217cce3dc2d307  results/F47/input/F38.zip' | sha256sum -c -
          echo 'b45d99bf5d58179f49df12a5101b8c40204e146aef31e0987b5260d6ffd0bd98  results/F47/input/F44.zip' | sha256sum -c -
      - name: REAL seven source-MR marginal common-window integrals (no invented extrapolation)
        shell: bash
        run: |
          set -euo pipefail
          python research/j0740/f47/f47_mass_integrated_source_likelihood.py \
            --f38 results/F47/input/F38.zip --f44 results/F47/input/F44.zip \
            --curves-dir results/F47/curves \
            --out results/F47/F47_seven_mass_window_source_likelihood.json
          python - <<'PY'
          import json
          p='results/F47/F47_seven_mass_window_source_likelihood.json'
          d=json.load(open(p))
          summary={k:{n:round(v['conditional_on_common_window_source_Z_ratio'],12)
                      for n,v in s['seven_integrals'].items()}
                   for k,s in d['surfaces'].items()}
          print('F47_F48_REINTEGRATED_ALL_42_CONDITIONAL_SCORES='+json.dumps(summary,sort_keys=True))
          print('F47_F48_REINTEGRATED_GATES='+json.dumps({k:d[k] for k in (
              'status','F46_original_CI_status','F46_mixed_grid_acceptance',
              'full_seven_model_Bayes_posterior','EOS_physical_microphysics_accepted',
              'global_rotating_fixed_J_stability','compiled_photon_level_XPSI_refit',
              'radio_mass_prior_probability_in_common_window','mass_uncovered_prior_likelihood')},sort_keys=True))
          PY
      - name: Manifest and permanently saved partial error evidence
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('results/F47');root.mkdir(parents=True,exist_ok=True)
          d={str(p.relative_to(root)):{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
             for p in root.rglob('*.json') if p.name!='F47_manifest.json'}
          (root/'F47_manifest.json').write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: j0740-f47-seven-causal-hypotheses-marginal-common-mass-sources
          path: |
            results/F47/F47_seven_mass_window_source_likelihood.json
            results/F47/F47_manifest.json
            results/F47/F46_source_exception.json
            results/F47/F48_source_receipt.json
            results/F47/curves/*_fixed_spin_direct_curve.json
          if-no-files-found: warn
          retention-days: 30
