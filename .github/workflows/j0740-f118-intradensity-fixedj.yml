name: J0740 F118 intradensity fixed-J scan
on:
  pull_request:
    branches:
      - science/j0740-apr4-firstlaw-gr-pilot-20261117
    paths:
      - 'research/j0740/f118/**'
      - '.github/workflows/j0740-f118-intradensity-fixedj.yml'
permissions:
  contents: read
  actions: read
jobs:
  intradensity_fixed_j_scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rns-alberta/rns
          ref: 97e85d325a33e37f702306414533f6cd77812477
          path: rns-upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical dependencies
        run: python -m pip install 'numpy==2.3.5' 'scipy==1.16.3'
      - name: Retrieve and checksum F117 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p results/F117 results/F118
          curl -fLsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14761479018/zip" -o results/F117/F117_artifact.zip
          printf '%s  %s\n' ab681b37c5c863e80b0666a4cb8801a03d3b887b920abb0324ec24f0a7044719 results/F117/F117_artifact.zip | sha256sum -c -
      - name: Validate F117 and nested F116 baseline
        env:
          F117_ARTIFACT_ZIP: results/F117/F117_artifact.zip
        run: |
          set -euo pipefail
          python -m unittest discover -s research/j0740/f118 -p 'test_f118_*.py' -v
          python - <<'PY'
          import os
          from pathlib import Path
          from research.j0740.f118.f118_intradensity_fixedj_scan import read_f117, RHO_TICKS_1E9
          result, rows, inner = read_f117(Path(os.environ['F117_ARTIFACT_ZIP']))
          assert len(rows) == 10 and len(result['fixed_J_solutions']) == 2
          assert len(inner['fixed_J_solutions']) == 2 and len(RHO_TICKS_1E9) == 3
          print('F117_AND_F116_BASELINES_AND_THREE_INTERIOR_POINTS_PASS')
          PY
      - name: Restore exact pinned F99 EOS and compile RNS C on 2501x5001
        run: |
          set -euo pipefail
          cp research/j0740/f104/F99_DERIVED_1981_node_causal_cold_affine_EOS.rns m99.rns
          printf '%s  %s\n' c99eadee07bf6cbbf78f59b6171ef7e21ffad7d034f4ca4e9b7d85d36d9b4331 m99.rns | sha256sum -c -
          test "$(git -C rns-upstream rev-parse HEAD)" = '97e85d325a33e37f702306414533f6cd77812477'
          cp -a rns-upstream rns2501
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'research/j0740/f81')
          from f81_exact_mass_spin import patch_print_only
          p = Path('rns2501/rns.c')
          p.write_text(patch_print_only(p.read_text()))
          mf = Path('rns2501/makefile')
          t = mf.read_text()
          old = 'HIGHSIZE=-DMDIV=151 -DSDIV=301'
          assert t.splitlines().count(old) == 1
          mf.write_text(t.replace(old, 'HIGHSIZE=-DMDIV=2501 -DSDIV=5001', 1))
          src = Path('rns2501/findmodel.c').read_bytes()
          assert b'float ans, fh,fl,fm,fnew,sroot,xh,xl,xm,xnew,xacc=1e-5;' in src
          PY
          make -C rns2501 CC='gcc -include stdlib.h' rns
          sha256sum rns2501/rns | tee results/F118/F118_INTRADENSITY_NATIVE_C_BINARY_SHA256.txt
      - name: Solve three interior fixed-J points
        env:
          F117_ARTIFACT_ZIP: results/F117/F117_artifact.zip
        run: |
          set -euo pipefail
          OPENBLAS_NUM_THREADS=1 python -u research/j0740/f118/f118_intradensity_fixedj_scan.py \
            --f117 results/F117/F117_artifact.zip \
            --eos m99.rns --rns "$GITHUB_WORKSPACE/rns2501/rns" \
            --out results/F118/F118_INTRADENSITY_FIXEDJ_SCAN.json \
            2>&1 | tee results/F118/F118_INTRADENSITY_FIXEDJ_SCAN.log
      - name: Preserve nested baseline and every interior trial
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: J0740-F118-intradensity-fixed-J-scan
          path: |
            results/F117/F117_artifact.zip
            results/F118/
          if-no-files-found: warn
