name: J0740 APR4 zero-P firstlaw RNS baryon-column pilot
on:
  push:
    branches:
      - science/j0740-apr4-firstlaw-gr-pilot-20261117
    paths:
      - 'research/j0740/rotating_gr/apr4_firstlaw_crust.py'
      - 'research/j0740/rotating_gr/test_apr4_firstlaw_crust.py'
      - 'research/j0740/rotating_gr/run_apr4_firstlaw_pilot.py'
      - 'research/j0740/rotating_gr/rns_firstlaw_baryon_ablation.py'
      - 'research/j0740/rotating_gr/test_rns_firstlaw_baryon_ablation.py'
      - '.github/workflows/j0740-apr4-firstlaw-cgr-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixed-centre-n-only-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
        with:
          repository: rns-alberta/rns
          ref: 97e85d325a33e37f702306414533f6cd77812477
          path: rns-pilot-src
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
        with:
          repository: nuclear-multimessenger-astronomy/jester
          ref: e6768650ce992abfd1153a6833857572fe5cd230
          path: jester-pinned
          sparse-checkout: |
            jesterTOV/tabulated_eos/lalsuite
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 pinned
        with:
          python-version: '3.12'
      - name: Install tiny numerical dependency only
        run: python -m pip install numpy
      - name: Test EOS first-law and fail-closed C mutation guards
        working-directory: research/j0740/rotating_gr
        run: python -W error -m unittest -v test_apr4_firstlaw_crust test_rns_firstlaw_baryon_ablation
      - name: Create separate candidate tables without editing source
        run: |
          python research/j0740/rotating_gr/run_apr4_firstlaw_pilot.py \
            --source jester-pinned/jesterTOV/tabulated_eos/lalsuite/APR4_EPP.npz \
            --out pilot-results
      - name: Patch only the isolated pinned C solver surface and M0 print
        run: |
          python research/j0740/rotating_gr/rns_firstlaw_baryon_ablation.py --patch rns-pilot-src | tee pilot-results/C_PATCH_SHA256.json
          make -C rns-pilot-src CC='gcc -include stdlib.h' rns
      - name: Real rotating C GR trial n-only ablation, 196 and 200 grids
        run: |
          python research/j0740/rotating_gr/rns_firstlaw_baryon_ablation.py \
            --rns rns-pilot-src/rns \
            --source jester-pinned/jesterTOV/tabulated_eos/lalsuite/APR4_EPP.npz \
            --out pilot-results
      - name: Preserve finite and failed attempts, no auto physics certification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 pinned
        with:
          name: j0740-apr4-firstlaw-196-200-C-GR-n-column-ablation
          path: pilot-results/
          if-no-files-found: warn
          retention-days: 30
