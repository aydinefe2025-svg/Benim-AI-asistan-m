name: J0740 F52 WFF1 genuine C-RNS fixed-frequency turnover diagnostic
on:
  pull_request:
    branches:
      - science/j0740-apr4-firstlaw-gr-pilot-20261117
    paths:
      - 'research/j0740/f52/**'
      - '.github/workflows/j0740-f52-wff1-turnover.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  f52-WFF1-fixed-frequency-C-GR-turnover-not-fixed-J-stability:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rns-alberta/rns
          ref: 97e85d325a33e37f702306414533f6cd77812477
          path: rns-upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned compatible numeric solver packages
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.13,<2'
      - name: Test numerical bracketing and mandatory stability caveats
        run: python -m unittest discover -s research/j0740/f52 -p 'test_f52_*.py' -v
      - name: Download archived direct C stellar roots and failures with full SHA checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p results/F52/input
          curl -fL --retry 3 --max-time 120 -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/aydinefe2025-svg/Benim-AI-asistan-m/actions/artifacts/14413168551/zip' \
            -o results/F52/input/F44.zip
          curl -fL --retry 3 --max-time 120 -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/aydinefe2025-svg/Benim-AI-asistan-m/actions/artifacts/14418493809/zip' \
            -o results/F52/input/F46_WFF1_original_failed.zip
          echo 'b45d99bf5d58179f49df12a5101b8c40204e146aef31e0987b5260d6ffd0bd98  results/F52/input/F44.zip' | sha256sum -c -
          echo 'bc4795ab244cc169f5ee5011c3ba1ac4646926a14c982b94d07808d647a955f3  results/F52/input/F46_WFF1_original_failed.zip' | sha256sum -c -
      - name: Build locked original C RNS solver (precision-print patch only)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C rns-upstream rev-parse HEAD)" = '97e85d325a33e37f702306414533f6cd77812477'
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'research/j0740/rotating_gr')
          from precise_apr4_mass_spin_root import patch_output_precision
          print(patch_output_precision(Path('rns-upstream/rns.c')))
          PY
          make -C rns-upstream CC='gcc -include stdlib.h' HIGHSIZE='-DMDIV=201 -DSDIV=401' rns
      - name: Execute new real C/GR fixed spin scan, independently sampling both sides of candidate peak
        shell: bash
        run: |
          set -euo pipefail
          python research/j0740/f52/f52_wff1_turnover_scan.py \
            --f44 results/F52/input/F44.zip \
            --f46 results/F52/input/F46_WFF1_original_failed.zip \
            --binary rns-upstream/rns \
            --work results/F52/eos_table \
            --out results/F52/F52_WFF1_direct_fixed_spin_turnover.json
      - name: Save audit hashes even on failures
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('results/F52');root.mkdir(parents=True,exist_ok=True)
          d={str(p.relative_to(root)):{'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'bytes':p.stat().st_size}
            for p in root.rglob('*.json') if p.name!='F52_manifest.json'}
          (root/'F52_manifest.json').write_text(json.dumps(d,sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: j0740-f52-wff1-real-C-turnover-or-failed-diagnostic
          path: |
            results/F52/F52_WFF1_direct_fixed_spin_turnover.json
            results/F52/F52_manifest.json
          if-no-files-found: warn
          retention-days: 30
