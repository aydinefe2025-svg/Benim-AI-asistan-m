name: J0740 F155 adaptive native conditional importance
on:
  pull_request:
    branches: [science/j0740-f154-all-sentinel-replay-20261124]
    paths: ['.github/workflows/j0740-f155-adaptive-native.yml', 'research/j0740/f155/**']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original_joint_likelihood:
    runs-on: ubuntu-22.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        model: [ENG, MPA1, MS1, MS1B, WFF1, WFF2]
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve immutable F146 source bytes and exact member hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence-f155 "$RUNNER_TEMP/f155-input"
          for pair in 14905441131:inputs 14905157121:manifest; do
            id=${pair%:*}; name=${pair#*:}
            curl -fLsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" -o "$RUNNER_TEMP/$name.zip"
          done
          printf '%s  %s\n' ffc877fb69f49c8a23b8494456bf0fe85cc7c45922a684b4d6389f1fe00478e9 "$RUNNER_TEMP/inputs.zip" ef59b3874f4f105b2d1de68396a903026cf957412e645d5cf07d6cd8307c990d "$RUNNER_TEMP/manifest.zip" | sha256sum -c
          python3 - <<'PY'
          import hashlib,json,os,zipfile,pathlib
          tmp=pathlib.Path(os.environ['RUNNER_TEMP'])
          out=tmp/'f155-input'
          with zipfile.ZipFile(tmp/'manifest.zip') as z:
              receipt=json.loads(z.read('input_stage.json'))
          assert receipt['status']=='PASS_ORIGINAL_INPUT_STAGING'
          with zipfile.ZipFile(tmp/'inputs.zip') as z:
              assert set(z.namelist())==set(receipt['selected_members'])
              for name,v in receipt['selected_members'].items():
                  target=out.joinpath(name)
                  assert target.resolve().is_relative_to(out.resolve())
                  target.parent.mkdir(parents=True,exist_ok=True)
                  h=hashlib.sha256()
                  count=0
                  with z.open(name) as src,target.open('wb') as dst:
                      for b in iter(lambda:src.read(1048576),b''):
                          h.update(b); count+=len(b); dst.write(b)
                  assert count==v['bytes'] and h.hexdigest()==v['sha256'],name
          root=out/'J0740_GAMMA_zenodo'
          mod=root/'STU/STU_NICER_XMM_hr/STU_modules'
          lines=[]
          for line in (mod/'config.ini').read_text().splitlines():
              if line.strip()=='--multinest':continue
              if '=' in line:
                  key,old=line.split('=',1)
                  if key=='--NICER-matrix-path':
                      path=tmp/'F155_generated_counts.txt'
                      assert not path.exists()
                  else:
                      matches=list(root.rglob(pathlib.Path(old).name))
                      assert len(matches)==1,(key,matches)
                      path=matches[0]
                  line=key+'='+str(path)
              lines.append(line)
          assert '--NICER' in lines and '--XMM' in lines
          (tmp/'f155_config.ini').write_text('\n'.join(lines)+'\n')
          pathlib.Path('evidence-f155/input_verification.json').write_text(json.dumps({'source_artifact_id':14905441131,'verified_members':len(receipt['selected_members']),'selected_bytes':receipt['selected_bytes'],'generated_matrix_initially_absent':True,'sampler_enabled':False},indent=2))
          PY
          cp "$RUNNER_TEMP/f155_config.ini" evidence-f155/config_relocated.ini
      - name: Install GSL development library
        run: sudo apt-get update -qq && sudo apt-get install -y libgsl-dev
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: xpsi-legacy
          init-shell: bash
          cache-environment: false
          condarc: |
            channels:
              - defaults
              - conda-forge
            channel_priority: flexible
          create-args: >-
            python=2.7
            numpy=1.16.5
            scipy=1.2.1
            cython=0.28.5
            matplotlib=2.2.3
            wrapt=1.11.2
            setuptools=44.0.0
            six
      - name: Compile X-PSI v1.2.0 (publisher run version)
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.2.0 https://github.com/xpsi-group/xpsi.git "$RUNNER_TEMP/xpsi-v1.2.0"
          git -C "$RUNNER_TEMP/xpsi-v1.2.0" rev-parse HEAD | tee evidence-f155/source_commit.txt
          test "$(cat evidence-f155/source_commit.txt)" = 78880035d0a8aba021761266327dc17e28cd4ed6
          cd "$RUNNER_TEMP/xpsi-v1.2.0"
          python - <<'PY'
          import os
          p='xpsi/likelihoods/default_background_marginalisation.pyx'
          s=open(p).read()
          a='        if limit > 0.0:\\n            LOGLIKE = llzero * (0.1 + 0.9 * np.random.rand(1))\\n            break'.replace('\\n','\n')
          b='        if limit > 0.0:\\n            print("F155_HIGH_COUNTS_CUTOFF", i, limit, av_STAR * SCALE, av_DATA)\\n            if not os.environ.get("F155_BYPASS_CUTOFF"):\\n                LOGLIKE = llzero * (0.1 + 0.9 * np.random.rand(1))\\n                break'.replace('\\n','\n')
          assert s.count(a)==1
          s=s.replace(a,b)
          a='            else:\\n                LOGLIKE = llzero * (0.1 + 0.9 * np.random.rand(1))\\n                break'.replace('\\n','\n')
          assert s.count(a)==1
          s=s.replace(a,'            else:\\n                print("F155_QUADRATURE_NONPOSITIVE", i, result, abserr)\\n                LOGLIKE = llzero * (0.1 + 0.9 * np.random.rand(1))\\n                break'.replace('\\n','\n'))
          s=s.replace('import numpy as np','import os\nimport numpy as np',1)
          open(p,'w').write(s)
          PY
          git diff -- xpsi/likelihoods/default_background_marginalisation.pyx > "$GITHUB_WORKSPACE/evidence-f155/explicit_source_patch.diff"
          CC=gcc python setup.py install --NumHot > "$GITHUB_WORKSPACE/evidence-f155/build.log" 2>&1 || { tail -120 "$GITHUB_WORKSPACE/evidence-f155/build.log"; exit 1; }
      - name: Retrieve immutable pilot, repair, proposal and slices
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL: ${{ matrix.model }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/f155-data"
          while read -r model id sha; do
            if [ "$model" != "$MODEL" ] && [ "$model" != "replay" ] && [ "$model" != "proposal" ] && [ "$model" != "slices" ]; then continue; fi
            curl -fLsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" -o "$RUNNER_TEMP/f155-data/$model.zip"
            printf '%s  %s\n' "$sha" "$RUNNER_TEMP/f155-data/$model.zip" | sha256sum -c
          done <<'EOF'
          ENG 14914524207 fbb0b590d5a662ece25a732e3191f3197b2dd4785a4d8803178cd1e057c1197e
          MPA1 14914718653 7a205c364199de2d2a8bd7e5714f9b9f469d22cb5c8a39d61427b354d976570d
          MS1 14915596805 720ccda2db5fbf578420cb709e9e98770b358531e901a0a0bdaa1d41354352c6
          MS1B 14914769833 8895d5b39b72ee2f5b91c46c7884dd3438c18a75632467996db9ff6cca52542f
          WFF1 14915556796 d64fdd6bf8d0d2eab2b56c7998fe3d28242c3fe9749d52476776e4ecff4215f1
          WFF2 14915412564 3a80b9ba3263f37d8678553868031599a758736787ede96f7aa84fdd980bc0f3
          replay 14916106718 2e3f1778acb3484ab026bace89360766266b2626a1df7a6f3bd051ed4f5f5633
          proposal 14915505656 a4b448bdb71c1de5fd8773a190b2a842bc06471e1ad63dd844ddf2a35b9d846f
          slices 14908868425 682a94aa0fe7ccfa34ec2f38c73008d652aa5e577deee04975ccf716c6b8f087
          EOF
          cd "$RUNNER_TEMP/f155-data"
          unzip -p "$MODEL.zip" conditional.json > pilot.json
          unzip -p replay.zip replay.json > replay.json
          unzip -p proposal.zip cube_proposal.json > proposal.json
          unzip -p slices.zip slices.json > slices.json
      - name: Fit native modes and run two fresh 1024-draw importance batches
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MODEL: ${{ matrix.model }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/f155-input/J0740_GAMMA_zenodo/STU/STU_NICER_XMM_hr/STU_modules"
          printf '%s  %s\n' 440451fd57c8d8c775f3c847861d6fce77a82ab975ca090fb660289191d8c1af main_lp40k_Xse001_Dfix.py | sha256sum -c
          d="$RUNNER_TEMP/f155-data"
          PYTHONPATH="$GITHUB_WORKSPACE/research/j0740/f150" python -u "$GITHUB_WORKSPACE/research/j0740/f155/adaptive_native.py" "$RUNNER_TEMP/f155_config.ini" "$d/slices.json" "$d/proposal.json" "$GITHUB_WORKSPACE/evidence-f155/adaptive.json" "${MODEL}_derived" "$d/pilot.json" "$d/replay.json" 2>&1 | tee "$GITHUB_WORKSPACE/evidence-f155/native.log"
          grep -F F155_COMPLETE "$GITHUB_WORKSPACE/evidence-f155/native.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: J0740-F155-adaptive-${{ matrix.model }}
          path: evidence-f155/
          if-no-files-found: error
