name: CANO legacy recovery branch audit (read-only)

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Historical backup branch is no longer the Render service source.
    - cron: '45 7 * * *'

permissions:
  contents: read

concurrency:
  group: cano-main-legacy-branch-audit
  cancel-in-progress: false

jobs:
  inspect-legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify no-write audit and preserve manual fast-forward safety
        run: python -m unittest discover -s tests -p 'test_cano_branch_sync.py' -v
      - name: Report historical branch divergence without changing Git refs
        run: python -m scripts.cano_safe_branch_sync --audit-only
