name: J0740 native crust knot transfer to actual RNS EOS input
on:
  pull_request:
    paths:
      - "research/j0740/rotating_gr/rns_crust_knot_transfer.py"
      - "research/j0740/rotating_gr/test_rns_crust_knot_transfer.py"
      - ".github/workflows/j0740-crust-knot-transfer.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit-native-versus-rns-input:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nuclear-multimessenger-astronomy/jester
          ref: e6768650ce992abfd1153a6833857572fe5cd230
          path: jester-upstream
          sparse-checkout: |
            jesterTOV/tabulated_eos/lalsuite
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy
      - name: Eight isolated native-to-resampled EOS crust transfer tests
        working-directory: research/j0740/rotating_gr
        run: python -m unittest -v test_rns_crust_knot_transfer
      - name: Get previously verified seven-EOS RNS model without any solver rerun
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prior-rns
          gh run download 42353019033 --repo "$GITHUB_REPOSITORY" \
            --name j0740-seven-eos-rns-fixed-mass-results \
            --dir prior-rns
      - name: Cross-compare seven source-native crust knots to RNS 196-point EOS secants
        run: |
          python research/j0740/rotating_gr/rns_crust_knot_transfer.py \
            --rns-json prior-rns/J0740_seven_EOS_full_GR_fixed_spin_mass.json \
            --source-dir jester-upstream/jesterTOV/tabulated_eos/lalsuite \
            --out results/J0740_seven_native_crust_vs_RNS_196pt_input_secants.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j0740-seven-native-crust-rns-input-transfer-evidence
          path: results/J0740_seven_native_crust_vs_RNS_196pt_input_secants.json
          if-no-files-found: warn
          retention-days: 30
