name: J0740 APR4 native LALSuite crust restmass real C GR ablation
on:
  push:
    branches:
      - science/j0740-native-lal-real-gr-20261117
    paths:
      - 'research/j0740/rotating_gr/native_lal_apr4_rns_trial.py'
      - 'research/j0740/rotating_gr/rns_native_lal_ablation.py'
      - '.github/workflows/j0740-native-lal-apr4-real-gr.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-lal-apr4-c-gr:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 immutable
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 immutable
        with:
          repository: rns-alberta/rns
          ref: 97e85d325a33e37f702306414533f6cd77812477
          path: rns-native-src
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 immutable
        with:
          repository: nuclear-multimessenger-astronomy/jester
          ref: e6768650ce992abfd1153a6833857572fe5cd230
          path: jester-pinned
          sparse-checkout: |
            jesterTOV/tabulated_eos/lalsuite
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 immutable
        with:
          python-version: '3.12'
      - name: Install pinned public LALSuite wheel and numpy
        run: python -m pip install 'lalsuite==7.26.16' numpy
      - name: Check 15 fail-closed candidate and C/parser tests
        working-directory: research/j0740/rotating_gr
        run: python -W error -m unittest -v test_apr4_firstlaw_crust test_rns_firstlaw_baryon_ablation
      - name: Build two APR4 tables from actual low-P native LAL e,h,rho0
        run: |
          python research/j0740/rotating_gr/native_lal_apr4_rns_trial.py \
            --npz jester-pinned/jesterTOV/tabulated_eos/lalsuite/APR4_EPP.npz \
            --out results
      - name: Patch pinned RNS C surface to actual first table node and expose M0
        run: |
          python research/j0740/rotating_gr/rns_firstlaw_baryon_ablation.py --patch rns-native-src | tee results/NATIVE_LAL_C_PATCH_SHA256.json
          make -C rns-native-src CC='gcc -include stdlib.h' rns
      - name: Compute real fixed-centre C GR 196/200 static and rotating native vs approx rest mass
        run: |
          python research/j0740/rotating_gr/rns_native_lal_ablation.py \
            --binary rns-native-src/rns \
            --npz jester-pinned/jesterTOV/tabulated_eos/lalsuite/APR4_EPP.npz \
            --out results
      - name: Preserve verified or failed native APR4 pilot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 immutable
        with:
          name: j0740-native-LALSuite-APR4-restmass-C-GR-196-200
          path: results
          retention-days: 30
          if-no-files-found: warn
