name: Organism Lab cloud demo

on:
  pull_request:
    branches: [fix/sqlite-backup-restore-20261031, codex/organism-lab-cloud-demo-20261104]
    paths:
      - "organism_lab_cloud/**"
      - ".github/workflows/organism-lab-cloud.yml"
  push:
    branches: [codex/organism-lab-cloud-demo-20261104]
    paths:
      - "organism_lab_cloud/**"
      - ".github/workflows/organism-lab-cloud.yml"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r organism_lab_cloud/requirements.txt
      - run: python -m compileall -q organism_lab_cloud
      - run: python -m unittest discover -s organism_lab/tests -t . -v
        working-directory: organism_lab_cloud
