name: EPS field persistence
on:
  pull_request:
    paths:
      - research/eps_lab_v4/field_persistence.py
      - .github/workflows/eps-field-persistence.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: research/eps_lab_v4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python -m pip install numpy==1.26.4 scipy==1.13.1
      - run: python field_persistence.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eps-field-persistence
          path: research/eps_lab_v4/EPS_PERSISTENCE.json
          if-no-files-found: error
