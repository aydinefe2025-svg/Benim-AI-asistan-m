name: GKA XJTU independent Batch6 transfer
on:
  pull_request:
    paths:
      - research/gka_xjtu_batch6_transfer.py
      - .github/workflows/gka-xjtu-batch6-transfer.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        cell: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install scientific libraries
        run: |
          python -m pip install --only-binary=:all: numpy==2.5.5 scipy==1.18.1
      - name: Synthetic numerical controls
        run: python research/gka_xjtu_batch6_transfer.py --self-test
      - name: Original independent lab transfer
        run: python research/gka_xjtu_batch6_transfer.py --cell ${{ matrix.cell }} --output evidence/cell-${{ matrix.cell }}.json
      - name: Retain real evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: GKA-XJTU-B6-CELL-${{ matrix.cell }}
          path: evidence/cell-${{ matrix.cell }}.json
          if-no-files-found: error
          retention-days: 30
