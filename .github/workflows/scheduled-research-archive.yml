name: Scheduled research archive
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scheduled-research-archive.yml'
  schedule:
    - cron: '15 7 * * *'
permissions:
  contents: write
concurrency:
  group: research-archive-production
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sqlite-backup-restore-20261031
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run research snapshot
        run: python -m scripts.daily_research
      - name: Validate report before archive
        run: python -m scripts.validate_research_archive
      - name: Commit report to production branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_reports/
          if ! git diff --cached --quiet; then
            git commit -m "archive: daily source leads"
            git push origin HEAD:fix/sqlite-backup-restore-20261031
          fi
