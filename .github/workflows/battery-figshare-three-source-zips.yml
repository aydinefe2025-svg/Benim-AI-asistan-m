name: Battery three publisher-original small cell archive source verification
on:
  pull_request:
    paths:
      - 'research/battery_curve_audit/figshare_three_archive_probe.py'
      - 'tests/test_figshare_three_archive_probe.py'
      - '.github/workflows/battery-figshare-three-source-zips.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-three-original-small-zips:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run six fail-closed local ZIP security tests
        run: python -m unittest tests.test_figshare_three_archive_probe -v
      - name: Download only three pinned original public publisher ZIPs (under 22MB total)
        run: |
          python -m research.battery_curve_audit.figshare_three_archive_probe \
            /tmp/cano_figshare_three_source_zips_receipt.json
      - name: Verify no false multi-cell independence claim
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/cano_figshare_three_source_zips_receipt.json').read_text())
          assert d['original_archives_verified']==3
          assert all(x['publisher_md5_matched'] and x['zip_crc_passed'] for x in d['files'])
          assert sum(x['original_zip_bytes'] for x in d['files'])<22_000_000
          assert d['waveform_signal_rows_compared']==0
          assert d['independent_physical_cells_authenticated']==0
          assert d['empirical_cross_cell_confusion_established'] is False
          assert d['field_acceptance']=='NOT_ESTABLISHED'
          assert d['production_release_allowed'] is False
          print('THREE_ORIGINAL_SOURCE_CONTAINERS_VERIFIED_NOT_PHYSICAL_FIELD',sum(x['csv_count'] for x in d['files']))
          PY
      - name: Archive only source structure receipt, never raw signals or secrets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cano-battery-original-three-zip-structure-only
          path: /tmp/cano_figshare_three_source_zips_receipt.json
          retention-days: 7
          if-no-files-found: error
