name: AGV heldout model original source integration
on:
  pull_request:
    paths:
      - research/agv_variable_load_model.py
      - research/test_agv_variable_load_model.py
      - research/agv_adjacent_current_bounds.py
      - research/agv_discharge_counter_audit.py
      - .github/workflows/agv-heldout-model.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python -m pip install numpy==1.26.4
      - run: python research/agv_adjacent_current_bounds.py
      - run: python -m unittest discover -s research -p 'test_agv_variable_load_model.py' -v
      - run: python research/agv_variable_load_model.py AGV_ADJACENT_CURRENT_RECEIPT.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agv-heldout-original-source-model
          path: |
            AGV_ADJACENT_CURRENT_RECEIPT.json
            AGV_VARIABLE_LOAD_MODEL_RECEIPT.json
          if-no-files-found: error
          retention-days: 30
