name: CANO colony validation

on:
  pull_request:
    branches: [main]
    paths:
      - "core/continuous_colony.py"
      - "scripts/cano_colony_cycle.py"
      - "scripts/verify_cano_restore.py"
      - "tests/test_colony_restore.py"
      - "tests/test_continuous_colony.py"
      - "tests/test_scheduled_colony_cycle.py"
      - ".github/workflows/cano-colony-cycle.yml"
      - ".github/workflows/cano-colony-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run focused tests
        run: python -m unittest discover -s tests -p "test_*colony*.py" -v
