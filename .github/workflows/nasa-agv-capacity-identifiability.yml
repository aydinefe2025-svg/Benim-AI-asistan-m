name: NASA PCoE real discharge capacity identification audit
on:
  pull_request:
    paths:
      - research/nasa_agv_capacity_identifiability.py
      - .github/workflows/nasa-agv-capacity-identifiability.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-waveforms:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python -m pip install numpy==1.26.4 scipy==1.13.1
      - run: python research/nasa_agv_capacity_identifiability.py --selftest
      - run: python research/nasa_agv_capacity_identifiability.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nasa-pcoe-original-waveform-capacity-receipt
          path: NASA_AGV_CAPACITY_EVIDENCE.json
          if-no-files-found: error
          retention-days: 30
