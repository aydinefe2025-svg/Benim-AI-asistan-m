name: J0740 summarize preserved fixed-mass root mesh artifact

on:
  pull_request:
    paths:
      - "research/j0740/rotating_gr/summarize_mesh_root_artifact.py"
      - "research/j0740/rotating_gr/test_summarize_mesh_root_artifact.py"
      - ".github/workflows/j0740-summarize-preserved-root-mesh-artifact.yml"

permissions:
  contents: read
  actions: read

jobs:
  summarize-preserved-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Test artifact failure-preservation behavior
        working-directory: research/j0740/rotating_gr
        run: python -m unittest -v test_summarize_mesh_root_artifact
      - name: Download existing failed RNS artifact without recomputing stars
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 42827242417 --repo "$GITHUB_REPOSITORY" --name j0740-fixed-mass-spin-mesh-convergence --dir prior-mesh
      - name: Extract per-EOS failure reasons and fixed-root deltas
        run: python research/j0740/rotating_gr/summarize_mesh_root_artifact.py --run-dir prior-mesh --out results/J0740_root_mesh_failure_summary.json
      - name: Preserve artifact-derived summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: j0740-root-mesh-failure-summary
          path: results/J0740_root_mesh_failure_summary.json
          if-no-files-found: warn
          retention-days: 30

