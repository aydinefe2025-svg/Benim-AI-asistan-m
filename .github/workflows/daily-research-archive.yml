name: Daily research archive
on:
  workflow_dispatch:
  schedule:
    - cron: '15 7 * * *'
permissions:
  contents: write
concurrency:
  group: daily-research-archive
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Create bounded research report
        run: python -m scripts.daily_research
      - name: Validate generated archive
        run: python -m scripts.validate_research_archive "research_reports/$(date -u +%F).json"
      - name: Save report to main research library
        env:
          ARCHIVE_TARGET_BRANCH: main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_reports/
          if ! git diff --cached --quiet; then
            git commit -m "archive: daily research source leads"
            python - <<'PY'
          import subprocess
          import sys

          # BEGIN bounded archive push
          import os
          branch = os.environ.get("ARCHIVE_TARGET_BRANCH") or subprocess.check_output(
              ["git", "symbolic-ref", "--quiet", "--short", "HEAD"], text=True
          ).strip()
          if not branch or branch.startswith("-") or any(ch.isspace() for ch in branch):
              sys.exit("Invalid archive target branch")
          for attempt in range(3):
              pushed = subprocess.run(["git", "push", "origin", "HEAD:" + branch])
              if pushed.returncode == 0:
                  sys.exit(0)
              if attempt == 2:
                  sys.exit("Archive push failed after 3 attempts; no force push used")
              subprocess.run(["git", "fetch", "origin", branch], check=True)
              # A same-file conflict fails for review, preserving remote data.
              subprocess.run(["git", "rebase", "FETCH_HEAD"], check=True)
          # END bounded archive push
          PY
          fi
