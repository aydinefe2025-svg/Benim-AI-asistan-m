name: J0740 F135 original APR4 local fixed-J native C
on:
  pull_request:
    branches: [science/j0740-apr4-firstlaw-gr-pilot-20261117]
    paths:
      - 'research/j0740/f135/**'
      - '.github/workflows/j0740-f135-original-apr4-local-fixed-j.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original_apr4_local_fixed_j:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rns-alberta/rns
          ref: 97e85d325a33e37f702306414533f6cd77812477
          path: rns-upstream
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: nuclear-multimessenger-astronomy/jester
          ref: e6768650ce992abfd1153a6833857572fe5cd230
          path: jester-upstream
          sparse-checkout: |
            jesterTOV/tabulated_eos/lalsuite/APR4_EPP.npz
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing pinned numeric dependencies
        run: python -m pip install 'numpy==2.3.5' 'scipy==1.16.3'
      - name: Verify original EOS and restrict central densities before acausal knot
        run: |
          set -euo pipefail
          test "$(git -C jester-upstream rev-parse HEAD)" = e6768650ce992abfd1153a6833857572fe5cd230
          echo '639c5381d49e13383c553771725f935b292e8ef7ff23367bd399a2bb9a3b7b88  jester-upstream/jesterTOV/tabulated_eos/lalsuite/APR4_EPP.npz' | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          from research.j0740.f135.f135_original_apr4_local_fixed_j import source_gate
          print('F135_SOURCE_GATE',source_gate(Path('jester-upstream/jesterTOV/tabulated_eos/lalsuite/APR4_EPP.npz')))
          PY
      - name: Patch RNS output only to expose C angular momentum
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,sys
          sys.path.insert(0,'research/j0740/f63')
          from f63_original_mpa1_fixed_J import patch_output_only
          p=Path('rns-upstream/rns.c');original=p.read_bytes()
          p.write_bytes(patch_output_only(original.decode('utf8')).encode('utf8'))
          d=Path('results/F135');d.mkdir(parents=True,exist_ok=True)
          (d/'C_printf_patch.json').write_text(json.dumps({'original_sha256':hashlib.sha256(original).hexdigest(),'patched_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'physics_source_modified':False},indent=2)+'\n')
          PY
      - name: Compile pinned native full-GR C RNS
        run: make -C rns-upstream CC='gcc -include stdlib.h' rns
      - name: Solve six original APR4 constant-J stars below source acausality
        run: |
          python -u research/j0740/f135/f135_original_apr4_local_fixed_j.py \
            --source jester-upstream/jesterTOV/tabulated_eos/lalsuite/APR4_EPP.npz \
            --rns rns-upstream/rns --out results/F135/F135_ORIGINAL_APR4_FIXED_J.json
      - name: Build independent 201x401 spacetime mesh with identical EOS and J
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('rns-upstream/makefile');s=p.read_text()
          old='HIGHSIZE=-DMDIV=151 -DSDIV=301';new='HIGHSIZE=-DMDIV=201 -DSDIV=401'
          if s.splitlines().count(old)!=1 or new in s:raise ValueError('F135_FINE_GRID_MAKEFILE_DRIFT')
          p.write_text(s.replace(old,new))
          (Path('results/F135')/'fine_grid_patch.json').write_text(json.dumps({'original_makefile_sha256':hashlib.sha256(s.encode()).hexdigest(),'fine_makefile_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'old':old,'new':new,'physics_source_modified':False},indent=2)+'\n')
          PY
          make -B -C rns-upstream CC='gcc -include stdlib.h' rns
      - name: Re-solve six APR4 stars on fine grid at SAME coarse target J
        run: |
          TARGET_J=$(python -c 'import json;print(json.load(open("results/F135/F135_ORIGINAL_APR4_FIXED_J.json"))["target_J_cgs"])')
          python -u research/j0740/f135/f135_original_apr4_local_fixed_j.py \
            --source jester-upstream/jesterTOV/tabulated_eos/lalsuite/APR4_EPP.npz \
            --rns rns-upstream/rns --target-j "$TARGET_J" \
            --out results/F135/fine/F135_ORIGINAL_APR4_FIXED_J_FINE.json
      - name: Compare same J, same central densities, two independent C meshes
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('results/F135')
          a=json.loads((root/'F135_ORIGINAL_APR4_FIXED_J.json').read_text())
          b=json.loads((root/'fine/F135_ORIGINAL_APR4_FIXED_J_FINE.json').read_text())
          assert a['target_J_cgs']==b['target_J_cgs'] and a['source_sha256']==b['source_sha256']
          assert a['all_six_successful'] and b['all_six_successful']
          assert len(a['stars'])==len(b['stars'])==6
          rows=[]
          for x,y in zip(a['stars'],b['stars']):
            assert x['ec_g_cm3']==y['ec_g_cm3']
            rows.append({'ec_g_cm3':x['ec_g_cm3'],'coarse_M':x['mass_msun'],'fine_M':y['mass_msun'],'delta_M_msun':y['mass_msun']-x['mass_msun'],'coarse_R_km':x['radius_eq_km'],'fine_R_km':y['radius_eq_km'],'delta_R_km':y['radius_eq_km']-x['radius_eq_km'],'coarse_J_residual':x['relative_J_residual'],'fine_J_residual':y['relative_J_residual']})
          rec={'schema':'J0740_F135_TWO_GRID_SAME_J_V1','target_J_cgs':a['target_J_cgs'],'models':rows,'max_abs_delta_M_msun':max(abs(x['delta_M_msun']) for x in rows),'max_abs_delta_R_km':max(abs(x['delta_R_km']) for x in rows),'coarse_mass_rising':a['strictly_rising_mass_on_sampled_local_J_branch'],'fine_mass_rising':b['strictly_rising_mass_on_sampled_local_J_branch'],'status':'LOCAL_TWO_GRID_DIAGNOSTIC_NOT_GLOBAL_STABILITY'}
          (root/'F135_TWO_GRID_SAME_J.json').write_text(json.dumps(rec,indent=2)+'\n')
          assert rec['max_abs_delta_M_msun']<.01 and rec['max_abs_delta_R_km']<.15
          assert rec['coarse_mass_rising'] and rec['fine_mass_rising']
          print('F135_TWO_GRID',json.dumps(rec))
          PY
      - name: Preserve output identities including failures
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          d=Path('results/F135');d.mkdir(parents=True,exist_ok=True)
          paths=[*d.glob('*.json'),*d.glob('*.rns'),Path('rns-upstream/rns'),Path('rns-upstream/rns.c'),Path('jester-upstream/jesterTOV/tabulated_eos/lalsuite/APR4_EPP.npz')]
          (d/'F135_SHA256.json').write_text(json.dumps({str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in paths if p.is_file()},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: J0740-F135-original-APR4-local-fixed-J-real-C
          path: results/F135/
          if-no-files-found: warn
