name: Battery original Figshare 3cell type tp cell and source instrument provenance
on:
  pull_request:
    paths:
      - 'research/battery_curve_audit/figshare_protocol_equivalence.py'
      - 'tests/test_battery_figshare_protocol_equivalence.py'
      - '.github/workflows/battery-figshare-three-protocol-equivalence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-publisher-three-protocol-crosswalk:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run new deterministic source-protocol regression tests
        run: python -m unittest tests.test_battery_figshare_protocol_equivalence -v
      - name: Read only official original publisher overview and three CRC/MD5 pinned source sidecars
        run: |
          python -m research.battery_curve_audit.figshare_protocol_equivalence \
            /tmp/cano_figshare_original_three_source_protocol_receipt.json
      - name: Save redacted metadata labels only never signal rows, identity values, or keys
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: battery-original-figshare-three-publisher-protocol-provenance
          path: /tmp/cano_figshare_original_three_source_protocol_receipt.json
          retention-days: 7
          if-no-files-found: error
      - name: Require source protocol match without false physical claims
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/cano_figshare_original_three_source_protocol_receipt.json').read_text())
          assert d['article_id']==25975315
          assert d['original_overview_row_count']==279
          assert d['source_files_verified_md5_crc']==3
          assert d['type_tp_cell_agreed_count']==3
          assert d['sidecar_testpoint_equivalent_count']==3
          assert d['measurement_setup_label_complete_count']==3
          assert all(x['publisher_source_identity_record_linked'] for x in d['source_measurement_records'])
          assert d['physical_cell_independently_authenticated'] is False
          assert d['measuring_device_calibration_independently_verified'] is False
          assert d['measurement_timebase_independently_calibrated'] is False
          assert d['independent_lab_institution_authenticated'] is False
          assert d['field_FPR_FNR_established'] is False
          assert d['field_acceptance']=='NOT_ESTABLISHED'
          assert d['production_release_allowed'] is False
          print('REAL_PUBLISHER_PROTOCOL_3_OF_3',d['sidecar_testpoint_equivalent_count'],
                'device_channel_date',d['measurement_setup_label_complete_count'])
          PY