name: EPS V3 durable operating archive
on:
  pull_request:
    paths:
      - research/eps_lab_v4/CANO_EPS_operating_simulator_V3.html
      - research/eps_lab_v4/test_archive_v3.cjs
      - research/eps_lab_v4/test_archive_v3.py
      - .github/workflows/eps-archive-v3.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: node research/eps_lab_v4/test_archive_v3.cjs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python -m pip install playwright==1.51.0
      - run: python -m playwright install --with-deps chromium
      - run: python research/eps_lab_v4/test_archive_v3.py
