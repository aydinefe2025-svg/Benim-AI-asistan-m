name: CANO P0 independent offsite restore acceptance gate

on:
  pull_request:
    paths:
      - "scripts/cano_p0_offsite_acceptance.py"
      - "tests/test_cano_p0_offsite_acceptance.py"
      - ".github/workflows/cano-p0-offsite-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance-contract:
    name: "Synthetic fail-closed acceptance / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install existing PostgreSQL recovery dependencies
        run: python -m pip install -r requirements-persistence.txt
      - name: Verify acceptance guards (SYNTHETIC; no provider access)
        run: python -m unittest discover -s tests -p 'test_cano_p0_offsite_acceptance.py' -v
      # This job never receives production credentials, owner encryption keys,
      # provider upload tokens, or a real archive; it CANNOT prove a live backup.
