name: J0740 fixed-mass spin-root mesh convergence

on:
  pull_request:
    paths:
      - "research/j0740/rotating_gr/compare_fixed_mass_spin_meshes.py"
      - "research/j0740/rotating_gr/test_fixed_mass_spin_mesh_convergence.py"
      - "research/j0740/rotating_gr/seven_eos_sequence.py"
      - ".github/workflows/j0740-fixed-mass-spin-mesh-convergence.yml"
  push:
    branches: [main]
    paths:
      - "research/j0740/rotating_gr/compare_fixed_mass_spin_meshes.py"
      - "research/j0740/rotating_gr/test_fixed_mass_spin_mesh_convergence.py"
      - "research/j0740/rotating_gr/seven_eos_sequence.py"
      - ".github/workflows/j0740-fixed-mass-spin-mesh-convergence.yml"

permissions:
  contents: read

jobs:
  root-mesh-convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: rns-alberta/rns
          ref: 97e85d325a33e37f702306414533f6cd77812477
          path: rns-upstream
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: nuclear-multimessenger-astronomy/jester
          ref: e6768650ce992abfd1153a6833857572fe5cd230
          path: jester-upstream
          sparse-checkout: |
            jesterTOV/tabulated_eos/lalsuite
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install numpy
      - name: Test root mesh comparator safeguards
        working-directory: research/j0740/rotating_gr
        run: python -m unittest -v test_fixed_mass_spin_mesh_convergence
      - name: Compile pinned RNS solver at both grids
        run: |
          make -C rns-upstream rns
          cp rns-upstream/rns rns-upstream/rns_151x301
          rm -f rns-upstream/*.o rns-upstream/rns
          make -C rns-upstream HIGHSIZE='-DMDIV=201 -DSDIV=401' rns
          cp rns-upstream/rns rns-upstream/rns_201x401
      - name: Solve seven fixed-mass and fixed-spin roots on both grids
        run: |
          python research/j0740/rotating_gr/seven_eos_sequence.py \
            --rns rns-upstream/rns_151x301 \
            --jester-dir jester-upstream/jesterTOV/tabulated_eos/lalsuite \
            --out results/151x301/J0740_fixed_mass_spin.json
          python research/j0740/rotating_gr/seven_eos_sequence.py \
            --rns rns-upstream/rns_201x401 \
            --jester-dir jester-upstream/jesterTOV/tabulated_eos/lalsuite \
            --out results/201x401/J0740_fixed_mass_spin.json
          python research/j0740/rotating_gr/compare_fixed_mass_spin_meshes.py \
            --base results/151x301/J0740_fixed_mass_spin.json \
            --fine results/201x401/J0740_fixed_mass_spin.json \
            --out results/J0740_fixed_mass_spin_mesh_convergence.json
      - name: Preserve pass or failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: j0740-fixed-mass-spin-mesh-convergence
          path: results
          if-no-files-found: warn
          retention-days: 30

