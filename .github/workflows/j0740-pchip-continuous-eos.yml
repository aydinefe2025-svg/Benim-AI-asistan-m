name: J0740 independent continuous EOS PCHIP candidate bounds
on:
  pull_request:
    paths:
      - "research/j0740/rotating_gr/pchip_continuous_eos.py"
      - "research/j0740/rotating_gr/test_pchip_continuous_eos.py"
      - ".github/workflows/j0740-pchip-continuous-eos.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify-continuous-cs2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: nuclear-multimessenger-astronomy/jester
          ref: e6768650ce992abfd1153a6833857572fe5cd230
          path: jester-upstream
          sparse-checkout: |
            jesterTOV/tabulated_eos/lalsuite
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy scipy
      - name: Test full interval polynomial derivative extrema and causal screening
        working-directory: research/j0740/rotating_gr
        run: python -m unittest -v test_pchip_continuous_eos
      - name: Reuse original source-matched seven RNS stars ONLY as SHA manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prior-rns
          gh run download 42353019033 --repo "$GITHUB_REPOSITORY" \
            --name j0740-seven-eos-rns-fixed-mass-results --dir prior-rns
      - name: Check every source EOS continuous derivative / cs2 without any RNS rerun
        run: |
          python research/j0740/rotating_gr/pchip_continuous_eos.py \
            --jester-dir jester-upstream/jesterTOV/tabulated_eos/lalsuite \
            --rns-reference-json prior-rns/J0740_seven_EOS_full_GR_fixed_spin_mass.json \
            --out results/J0740_seven_EOS_PCHIP_continuous_bounds.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: j0740-independent-pchip-continuous-cs2-7eos
          path: results/J0740_seven_EOS_PCHIP_continuous_bounds.json
          if-no-files-found: error
          retention-days: 30
