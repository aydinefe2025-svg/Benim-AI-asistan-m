name: J0740 F39 causal APR4 fixed-spin source-marginalized curve
on:
  pull_request:
    paths:
      - 'research/j0740/likelihood/causal_apr4_fixed_spin_marginal_evidence.py'
      - 'research/j0740/likelihood/test_causal_apr4_evidence.py'
      - '.github/workflows/j0740-causal-apr4-f39-curve-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'research/j0740/likelihood/causal_apr4_fixed_spin_marginal_evidence.py'
      - 'research/j0740/likelihood/test_causal_apr4_evidence.py'
      - '.github/workflows/j0740-causal-apr4-f39-curve-evidence.yml'
permissions:
  contents: read
  actions: read
jobs:
  causal-apr4-source-likelihood:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: rns-alberta/rns
          ref: 97e85d325a33e37f702306414533f6cd77812477
          path: rns-upstream
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install fixed numerical packages
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.13,<2'
      - name: Validate seven independent F39 numerical unit tests
        run: python -m unittest discover -s research/j0740/likelihood -p 'test_causal_apr4_evidence.py' -v
      - name: Retrieve pinned successful F38 genuine Salmi likelihood artifact, no repeated photon analysis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p results/F38
          gh run download 44120237417 --repo "${GITHUB_REPOSITORY}" \
             --name j0740-F38-published-source-marginalized-mr-likelihood --dir results/F38
          ls -lh results/F38
      - name: Strict source-grid SHA256 check and Git source table identity
        run: |
          python - <<'PY'
          import sys,subprocess
          from pathlib import Path
          sys.path.insert(0,'research/j0740/likelihood')
          import causal_apr4_fixed_spin_marginal_evidence as t
          for filename in t.SOURCE_F38_GRID_HASH:
              t.read_likelihood(Path('results/F38')/filename)
          print('PASS 6 F38 SHA-locked source likelihood matrices')
          table=Path('research/j0740/physical_eos/APR4_native_LAL_causal_completion_200pt.rns')
          blob=subprocess.run(['git','hash-object',str(table)],capture_output=True,text=True,check=True).stdout.strip()
          assert blob==t.RNS_EOS_GIT_BLOB_SHA, (blob,t.RNS_EOS_GIT_BLOB_SHA)
          print('PASS source APR4 native causal EOS Git blob',blob,'SHA256',t.sha256(table))
          PY
      - name: Apply output-only high precision patch to upstream pinned RNS C
        run: |
          python - <<'PY'
          import sys,json
          from pathlib import Path
          sys.path.insert(0,'research/j0740/rotating_gr')
          from precise_apr4_mass_spin_root import patch_output_precision
          root=Path('rns-upstream/rns.c')
          out=patch_output_precision(root)
          Path('results/F39').mkdir(parents=True,exist_ok=True)
          Path('results/F39/RNS_source_patch.json').write_text(json.dumps(out,indent=2)+'\n')
          print(out)
          PY
      - name: Compile pinned source C GR solver on two spatial meshes
        run: |
          make -C rns-upstream CC='gcc -include stdlib.h' rns
          cp rns-upstream/rns rns-upstream/rns_151x301
          rm -f rns-upstream/*.o rns-upstream/rns
          make -C rns-upstream CC='gcc -include stdlib.h' HIGHSIZE='-DMDIV=201 -DSDIV=401' rns
          cp rns-upstream/rns rns-upstream/rns_201x401
      - name: Solve causal rotating APR4 25 actual mass-spin roots, integrate six F38 source likelihood surfaces
        run: |
          python research/j0740/likelihood/causal_apr4_fixed_spin_marginal_evidence.py \
            --table research/j0740/physical_eos/APR4_native_LAL_causal_completion_200pt.rns \
            --binary-fine rns-upstream/rns_201x401 \
            --binary-coarse rns-upstream/rns_151x301 \
            --f38 results/F38 \
            --out results/F39/F39_direct_RNS_fixed_spin_apr4_conditional_likelihood.json
      - name: Save machine proof even on failed scientific gate
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('results/F39');root.mkdir(parents=True,exist_ok=True)
          files={p.name:{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in root.iterdir() if p.is_file()}
          (root/'F39_SHA256_manifest.json').write_text(json.dumps(files,indent=2,sort_keys=True)+'\n')
          print(files)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: j0740-F39-direct-C-GR-causal-APR4-mass-marginal-evidence
          path: results/F39
          if-no-files-found: warn
          retention-days: 30