name: J0740 F147 original joint photon likelihood
on:
  pull_request:
    branches: [science/j0740-f146-original-photon-inputs-20261124]
    paths: ['.github/workflows/j0740-f147-exact-photon-likelihood.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original_joint_likelihood:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve immutable F146 source bytes and exact member hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence-f147 "$RUNNER_TEMP/f147-input"
          for pair in 14905441131:inputs 14905157121:manifest; do
            id=${pair%:*}; name=${pair#*:}
            curl -fLsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" -o "$RUNNER_TEMP/$name.zip"
          done
          printf '%s  %s\n' ffc877fb69f49c8a23b8494456bf0fe85cc7c45922a684b4d6389f1fe00478e9 "$RUNNER_TEMP/inputs.zip" ef59b3874f4f105b2d1de68396a903026cf957412e645d5cf07d6cd8307c990d "$RUNNER_TEMP/manifest.zip" | sha256sum -c
          python3 - <<'PY'
          import hashlib,json,os,zipfile,pathlib
          tmp=pathlib.Path(os.environ['RUNNER_TEMP'])
          out=tmp/'f147-input'
          with zipfile.ZipFile(tmp/'manifest.zip') as z:
              receipt=json.loads(z.read('input_stage.json'))
          assert receipt['status']=='PASS_ORIGINAL_INPUT_STAGING'
          with zipfile.ZipFile(tmp/'inputs.zip') as z:
              assert set(z.namelist())==set(receipt['selected_members'])
              for name,v in receipt['selected_members'].items():
                  target=out.joinpath(name)
                  assert target.resolve().is_relative_to(out.resolve())
                  target.parent.mkdir(parents=True,exist_ok=True)
                  h=hashlib.sha256()
                  count=0
                  with z.open(name) as src,target.open('wb') as dst:
                      for b in iter(lambda:src.read(1048576),b''):
                          h.update(b); count+=len(b); dst.write(b)
                  assert count==v['bytes'] and h.hexdigest()==v['sha256'],name
          root=out/'J0740_GAMMA_zenodo'
          mod=root/'STU/STU_NICER_XMM_hr/STU_modules'
          lines=[]
          for line in (mod/'config.ini').read_text().splitlines():
              if line.strip()=='--multinest':continue
              if '=' in line:
                  key,old=line.split('=',1)
                  if key=='--NICER-matrix-path':
                      path=tmp/'F147_generated_counts.txt'
                      assert not path.exists()
                  else:
                      matches=list(root.rglob(pathlib.Path(old).name))
                      assert len(matches)==1,(key,matches)
                      path=matches[0]
                  line=key+'='+str(path)
              lines.append(line)
          assert '--NICER' in lines and '--XMM' in lines
          (tmp/'f147_config.ini').write_text('\n'.join(lines)+'\n')
          pathlib.Path('evidence-f147/input_verification.json').write_text(json.dumps({'source_artifact_id':14905441131,'verified_members':len(receipt['selected_members']),'selected_bytes':receipt['selected_bytes'],'generated_matrix_initially_absent':True,'sampler_enabled':False},indent=2))
          PY
          cp "$RUNNER_TEMP/f147_config.ini" evidence-f147/config_relocated.ini
      - name: Install GSL development library
        run: sudo apt-get update -qq && sudo apt-get install -y libgsl-dev
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: xpsi-legacy
          init-shell: bash
          cache-environment: false
          condarc: |
            channels:
              - defaults
              - conda-forge
            channel_priority: flexible
          create-args: >-
            python=2.7
            numpy=1.16.5
            scipy=1.2.1
            cython=0.28.5
            matplotlib=2.2.3
            wrapt=1.11.2
            setuptools=44.0.0
            six
      - name: Compile X-PSI v1.2.0 (publisher run version)
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.2.0 https://github.com/xpsi-group/xpsi.git "$RUNNER_TEMP/xpsi-v1.2.0"
          git -C "$RUNNER_TEMP/xpsi-v1.2.0" rev-parse HEAD | tee evidence-f147/source_commit.txt
          cd "$RUNNER_TEMP/xpsi-v1.2.0"
          CC=gcc python setup.py install --NumHot > "$GITHUB_WORKSPACE/evidence-f147/build.log" 2>&1 || { tail -120 "$GITHUB_WORKSPACE/evidence-f147/build.log"; exit 1; }
      - name: Execute unmodified publisher joint NICER XMM likelihood check
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/f147-input/J0740_GAMMA_zenodo/STU/STU_NICER_XMM_hr/STU_modules"
          sha256sum main_lp40k_Xse001_Dfix.py | tee "$GITHUB_WORKSPACE/evidence-f147/original_runner_sha.txt"
          printf '%s  %s\n' 440451fd57c8d8c775f3c847861d6fce77a82ab975ca090fb660289191d8c1af main_lp40k_Xse001_Dfix.py | sha256sum -c
          python -u main_lp40k_Xse001_Dfix.py @"$RUNNER_TEMP/f147_config.ini" 2>&1 | tee "$GITHUB_WORKSPACE/evidence-f147/native_likelihood.log"
          grep -F 'Log-likelihood value checks passed on root process.' "$GITHUB_WORKSPACE/evidence-f147/native_likelihood.log"
          grep -F 'Number of events constituting data set: 1176389.' "$GITHUB_WORKSPACE/evidence-f147/native_likelihood.log"
          python - <<'PY'
          import numpy as np,os
          c=np.loadtxt(os.path.join(os.environ['RUNNER_TEMP'],'F147_generated_counts.txt'))
          assert c.shape==(120,32) and c.sum()==1176389
          print('F147_NATIVE_COUNTS_PASS')
          PY
          cp "$RUNNER_TEMP/F147_generated_counts.txt" "$GITHUB_WORKSPACE/evidence-f147/counts.txt"
          echo "F147_PUBLISHER_JOINT_LIKELIHOOD_CHECK_PASS (not EOS evidence)" | tee "$GITHUB_WORKSPACE/evidence-f147/status.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: J0740-F147-exact-publisher-joint-likelihood
          path: evidence-f147/
          if-no-files-found: error
