name: Graz original numerical Power anomaly impact on SP joins
on:
  pull_request:
    paths:
      - 'research/battery_curve_audit/graz_source_power_sp_join_quality.py'
      - 'tests/test_graz_source_power_sp_join_quality.py'
      - '.github/workflows/battery-graz-original-power-sp-join-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-VIP-SP-source-join-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Source quarantine fixture tests, no synthetic physical inference
        run: python -m unittest -v tests.test_graz_source_power_sp_join_quality
      - name: Re-download genuine 5-cell publisher ZIP; audit 1900 real COM4 P/V/I anomalies against all 15 original SP files
        run: python -m research.battery_curve_audit.graz_source_power_sp_join_quality /tmp/graz_real_original_power_sp_join_quality.json
      - name: Fail closed on original source hashes, populations, prior 1-second matches, anomaly count, and capacity scope
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/graz_real_original_power_sp_join_quality.json',encoding='utf-8'))
          assert d['source_doi']=='10.5281/zenodo.22079387'
          assert d['publisher_pinned_md5']=='b9ed863766e30afbd0e309951c855d08'
          assert d['publisher_source_original_sha256']=='5627a1606b8e378de0e4e4ced99222509bcbbcb725d26da6e7a5fad34aa42fc7'
          assert d['zip_crc_and_declared_size_verified']
          assert d['genuine_original_electrical_rows']==1091337
          assert d['genuine_original_sp_sensor_rows']==234021
          assert d['original_numeric_P_vs_VI_discrepancy_rows']==1900
          assert d['baseline_same_cell_1s_sp_pairs']==204673
          assert d['all_five_cell_original_join_quality']['before_matched_SP_rows']==204673
          assert sum(v['original_numeric_power_quarantine_rows'] for v in d['cells'].values())==1900
          assert all(v is False for v in d['hard_scientific_limits'].values())
          for v in d['cells'].values():assert len(v['SP_3_files'])==3
          g=d['all_five_cell_original_join_quality']
          assert g.get('after_matched_SP_rows',0)<=234021
          assert g.get('before_mapped_to_quarantined_electrical_power_row',0)<=1900
          print('ORIGINAL_GRAZ_POWER_QUARANTINE_SP_REJOIN_PASS',g)
          PY
      - name: Publish only derived per-source counts and risk matrix, not raw source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: graz-original-5cell-COM4-power-anomaly-SP-rejoin
          path: /tmp/graz_real_original_power_sp_join_quality.json
          if-no-files-found: error
          retention-days: 14
