name: J0740 F71 high-resolution mass-spin RNS convergence
on:
  pull_request:
    branches:
      - science/j0740-apr4-firstlaw-gr-pilot-20261117
    paths:
      - 'research/j0740/f71/**'
      - '.github/workflows/j0740-f71-high-resolution-convergence.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  run-high-mesh:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    strategy:
      fail-fast: false
      matrix:
        include:
          - grid: 301x601
            mdiv: 301
            sdiv: 601
          - grid: 401x801
            mdiv: 401
            sdiv: 801
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rns-alberta/rns
          ref: 97e85d325a33e37f702306414533f6cd77812477
          path: rns-upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy==2.3.5' 'scipy==1.16.3'
      - name: Fail closed high-resolution tests and source EOS SHA
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s research/j0740/f71 -p 'test_f71_*.py' -v
          echo '5af6e77740c3af282d30918e69a1794dab84895092209ac850c1e2ed2945ac16  research/j0740/f68/F68_ALT196_identical_RNS_source_EOS_20261119.rns' | sha256sum -c -
      - name: Compile actual pinned RNS C with new spacetime grid
        shell: bash
        env:
          MDIV: ${{ matrix.mdiv }}
          SDIV: ${{ matrix.sdiv }}
        run: |
          set -euo pipefail
          mkdir -p results/F71
          cp research/j0740/f68/F68_ALT196_identical_RNS_source_EOS_20261119.rns results/F71/ALT196.rns
          python research/j0740/f62/f62_rns_precision_patch.py rns-upstream/rns.c
          python - <<'PY'
          import os,pathlib
          p=pathlib.Path('rns-upstream/makefile');s=p.read_text()
          old='HIGHSIZE=-DMDIV=151 -DSDIV=301'
          new=f'HIGHSIZE=-DMDIV={os.environ["MDIV"]} -DSDIV={os.environ["SDIV"]}'
          assert sum(x==old for x in s.splitlines())==1
          p.write_text(s.replace(old,new,1))
          assert [x for x in p.read_text().splitlines() if x.startswith('HIGHSIZE=')]==[new]
          PY
          make -C rns-upstream CC='gcc -include stdlib.h' rns
      - name: Real C models at two gravitational masses and exact spin
        env:
          GRID: ${{ matrix.grid }}
        shell: bash
        run: |
          set -euo pipefail
          python -u research/j0740/f71/f71_highres_spinmatched.py \
            --binary rns-upstream/rns --eos results/F71/ALT196.rns \
            --f68 research/j0740/f68/F68_new_MPA1_PCHIP_COLD_rotating_fine_C_20261119.json \
            --grid "$GRID" --out "results/F71/F71_${GRID}_direct.json"
          python - <<'PY'
          import glob,json
          p=glob.glob('results/F71/F71_*_direct.json');assert len(p)==1
          o=json.load(open(p[0]));assert len(o['stars'])==2 and o['status'].startswith('TWO_DIRECT_C')
          print('F71 exact actual C high resolution stars completed')
          PY
      - name: Hash inputs, C binary and real RNS output
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib,hashlib
          out=pathlib.Path('results/F71');out.mkdir(exist_ok=True,parents=True)
          paths=[*out.glob('*'),pathlib.Path('rns-upstream/rns')]
          d={str(p):{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in paths if p.is_file()}
          (out/'F71_sha256_receipt.json').write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: F71-${{ matrix.grid }}-real-C-or-failure
          path: results/F71/
          if-no-files-found: warn
          retention-days: 90
  four-high-grid-compare:
    needs: run-high-mesh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy==2.3.5' 'scipy==1.16.3'
      - uses: actions/download-artifact@v4
        with:
          pattern: F71-*-real-C-or-failure
          path: results/F71/new
      - uses: actions/download-artifact@v4
        with:
          repository: aydinefe2025-svg/Benim-AI-asistan-m
          run-id: 44512752980
          name: F70-true-C-201x401-or-failure
          github-token: ${{ github.token }}
          path: results/F71/f70_201
      - uses: actions/download-artifact@v4
        with:
          repository: aydinefe2025-svg/Benim-AI-asistan-m
          run-id: 44512752980
          name: F70-true-C-251x501-or-failure
          github-token: ${{ github.token }}
          path: results/F71/f70_251
      - name: Compute unbiased 201 to 401 mesh empirical changes
        shell: bash
        run: |
          python - <<'PY'
          import sys,json,pathlib
          sys.path.insert(0,'research/j0740/f71')
          from f71_highres_spinmatched import compare
          p=pathlib.Path('results/F71')
          old201=json.loads((p/'f70_201'/'F70_201x401_equal_spin.json').read_text())
          old251=json.loads((p/'f70_251'/'F70_251x501_equal_spin.json').read_text())
          d301=json.loads((p/'new'/'F71-301x601-real-C-or-failure'/'F71_301x601_direct.json').read_text())
          d401=json.loads((p/'new'/'F71-401x801-real-C-or-failure'/'F71_401x801_direct.json').read_text())
          ans=compare(old201,old251,d301,d401)
          (p/'F71_four_grid_highres_comparison.json').write_text(json.dumps(ans,indent=2,sort_keys=True)+'\n')
          print(json.dumps(ans,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: F71-four-grid-convergence-report-or-failure
          path: results/F71/F71_four_grid_highres_comparison.json
          if-no-files-found: warn
          retention-days: 90
