name: J0740 independent rotating GR solver benchmark

on:
  pull_request:
    paths:
      - "research/j0740/rotating_gr/**"
      - ".github/workflows/j0740-rns-gr-benchmark.yml"
  push:
    branches: [main]
    paths:
      - "research/j0740/rotating_gr/**"
      - ".github/workflows/j0740-rns-gr-benchmark.yml"

permissions:
  contents: read

jobs:
  rns-rotating-gr:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout research benchmarks
        uses: actions/checkout@v4
      - name: Checkout pinned public RNS solver
        uses: actions/checkout@v4
        with:
          repository: rns-alberta/rns
          ref: 97e85d325a33e37f702306414533f6cd77812477
          path: rns-upstream
          persist-credentials: false
      - name: Checkout pinned public tabulated EOS library
        uses: actions/checkout@v4
        with:
          repository: rns-alberta/eos
          ref: 7ef71a578d2e52dede24bce055839f2b74f43721
          path: eos-upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit-test RNS parser and scientific guardrails
        working-directory: research/j0740/rotating_gr
        run: |
          python -m compileall -q .
          python -m unittest -v test_rns_benchmark
      - name: Compile upstream RNS C relativity solver
        run: make -C rns-upstream rns
      - name: Run original published APR 300 Hz control and J0740-spin 346.536369 Hz simulation
        run: |
          python research/j0740/rotating_gr/rns_benchmark.py \
            --rns rns-upstream/rns \
            --eos eos-upstream/eosAPR \
            --output results/j0740_rns_apr_gr_benchmark.json
      - name: Archive reproducible RNS GR numerical result
        uses: actions/upload-artifact@v4
        with:
          name: j0740-rns-apr-independent-gr-benchmark
          path: results/j0740_rns_apr_gr_benchmark.json
          if-no-files-found: error
          retention-days: 30
