name: Battery impact 2026 published 45-cell survival audit
on:
  pull_request:
    paths:
      - 'research/battery_curve_audit/impact_2026_survival_audit.py'
      - 'tests/test_impact_2026_survival_audit.py'
      - '.github/workflows/battery-impact-2026-published-cohort-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  impact-cohort-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test published cohort counts and Wilson intervals
        run: python -m unittest discover -s tests -p 'test_impact_2026_survival_audit.py' -v
      - name: Produce source-anchored audit JSON (not raw per-cell data)
        run: |
          mkdir -p /tmp/impact_audit
          python research/battery_curve_audit/impact_2026_survival_audit.py --output /tmp/impact_audit/CANO_IMPACT_2026_45_CELL_SURVIVAL_AUDIT.json
          python - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('/tmp/impact_audit/CANO_IMPACT_2026_45_CELL_SURVIVAL_AUDIT.json')
          d=json.loads(p.read_text())
          assert d['n_impacted_total']==45
          assert [g['n_survived_one_week'] for g in d['group_survival']]==[15,9,0]
          assert all(g['post_impact_200cycle_capacity_estimate'] is None for g in d['group_survival'])
          print('IMPACT_SOURCE_COHORT_PASS_SHA256',hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - name: Upload published-cohort audit evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: impact-2026-published-45cell-survival-not-raw-data
          path: /tmp/impact_audit/CANO_IMPACT_2026_45_CELL_SURVIVAL_AUDIT.json
          if-no-files-found: error
          retention-days: 7
