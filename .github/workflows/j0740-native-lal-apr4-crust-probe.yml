name: J0740 APR4 genuine native LALSuite low-pressure crust probe
on:
  push:
    branches:
      - science/j0740-native-lal-crust-probe-20261117
    paths:
      - 'research/j0740/rotating_gr/probe_lalsuite_native_lowpressure.py'
      - '.github/workflows/j0740-native-lal-apr4-crust-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-lal-pressure:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
        with:
          repository: nuclear-multimessenger-astronomy/jester
          ref: e6768650ce992abfd1153a6833857572fe5cd230
          path: jester-pinned
          sparse-checkout: |
            jesterTOV/tabulated_eos/lalsuite
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 pinned
        with:
          python-version: '3.12'
      - name: Install pinned pre-8 LALSuite wheel and numpy in isolated runner
        run: python -m pip install 'lalsuite==7.26.16' numpy
      - name: Query actual APR4_EPP C/EOS methods at low source pressure
        run: |
          python research/j0740/rotating_gr/probe_lalsuite_native_lowpressure.py \
            --npz jester-pinned/jesterTOV/tabulated_eos/lalsuite/APR4_EPP.npz \
            --out results/J0740_LALSUITE_NATIVE_APR4_LOWP_20261117.json
      - name: Preserve native source result even if method unavailable
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 pinned
        with:
          name: J0740-native-LALSuite-APR4-lowpressure-probe
          path: results/
          if-no-files-found: warn
          retention-days: 14
