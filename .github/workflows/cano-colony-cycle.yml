name: CANO scheduled colony cycle

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cano-colony-cycle
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore bounded digital-colony state
        uses: actions/cache@v4
        with:
          path: artifacts/colony-cycle.sqlite3
          key: cano-colony-state-${{ github.run_id }}
          restore-keys: |
            cano-colony-state-
      - name: Run bounded cycle
        env:
          CANO_CYCLE_OUTPUT: artifacts/colony-cycle.json
          CANO_CYCLE_DB: artifacts/colony-cycle.sqlite3
        run: python -m scripts.cano_colony_cycle
      - name: Upload verifiable cycle audit
        uses: actions/upload-artifact@v4
        with:
          name: cano-colony-cycle-${{ github.run_id }}
          path: artifacts/colony-cycle.json
          retention-days: 30
      - name: Prepare public status page
        run: |
          mkdir -p artifacts/status-site
          cp artifacts/colony-cycle.json artifacts/status-site/cano-colony-status.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/status-site
      - name: Publish status without REST API rate limits
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
          error_count: 10
          reporting_interval: 5000
        # This static feed contains only the validated digital simulation report.
        # User records, credentials, and chat data are never included.
        if: github.ref == 'refs/heads/main'

