name: CANO scheduled colony cycle

on:
  # One main-branch run on this workflow's next approved update.
  # Does not loop on artifacts or cache writes.
  push:
    branches: [main]
    paths:
      - ".github/workflows/cano-colony-cycle.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cano-colony-cycle
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check colony regressions before writing state
        run: python -m unittest discover -s tests -p "test_*colony*.py" -q
      - name: Restore prior verified colony database
        uses: actions/cache@v4
        with:
          path: artifacts/colony-cycle.sqlite3
          key: cano-colony-db-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            cano-colony-db-${{ github.ref_name }}-
      - name: Run bounded cycle
        env:
          CANO_CYCLE_OUTPUT: artifacts/colony-cycle.json
          CANO_CYCLE_DB: artifacts/colony-cycle.sqlite3
        run: python -m scripts.cano_colony_cycle
      - name: Upload verifiable cycle audit
        uses: actions/upload-artifact@v4
        with:
          name: cano-colony-cycle-${{ github.run_id }}
          path: |
            artifacts/colony-cycle.json
            artifacts/colony-cycle.sqlite3
          retention-days: 30
