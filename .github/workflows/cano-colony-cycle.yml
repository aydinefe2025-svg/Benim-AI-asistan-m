name: CANO scheduled colony cycle

on:
  # Run on relevant updates, on a fixed hourly schedule, or manually.
  push:
    branches: [main]
    paths:
      - ".github/workflows/cano-colony-cycle.yml"
      - "core/virtual_generation.py"
      - "scripts/cano_colony_cycle.py"
      - "scripts/cano_specialist_agents.py"
      - "tests/test_virtual_colony_generation.py"
      - "tests/test_scheduled_colony_cycle.py"
      - "tests/test_cano_specialist_agents.py"
  schedule:
    # Keep away from the high-load start of the hour; changing this cron also re-enables a stalled schedule.
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cano-colony-cycle
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install secure backup dependency
        run: python -m pip install "cryptography>=44,<51"
      - name: Check colony regressions before writing state
        run: |
          python -m unittest discover -s tests -p "test_*colony*.py" -q
          python -m unittest tests.test_cano_specialist_agents -q
      - name: Restore prior verified colony database
        id: colony_cache
        uses: actions/cache@v4
        with:
          path: artifacts/colony-cycle.sqlite3
          key: cano-colony-db-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            cano-colony-db-${{ github.ref_name }}-
      - name: Restore last GitHub audit artifact when cache is missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -f artifacts/colony-cycle.sqlite3 ]]; then
            echo "Previous SQLite restored by cache; skip archive extraction"
          else
            previous_run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow cano-colony-cycle.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            if [[ -n "$previous_run" ]]; then
              mkdir -p artifacts
              gh run download "$previous_run" --repo "$GITHUB_REPOSITORY" --name "cano-colony-cycle-$previous_run" --dir artifacts
            else
              echo "No prior successful CANO run; starting fresh"
            fi
          fi
      - name: Reject damaged restored state before advancing
        run: |
          if [[ -e artifacts/colony-cycle.sqlite3 ]]; then
            python -m scripts.verify_cano_restore
          fi
      - name: Run bounded virtual organism cycle
        env:
          CANO_CYCLE_OUTPUT: artifacts/colony-cycle.json
          CANO_CYCLE_DB: artifacts/colony-cycle.sqlite3
        run: python -m scripts.cano_colony_cycle
      - name: Launch independent bounded validation agents
        run: python -m scripts.cano_specialist_agents --report artifacts/colony-cycle.json --database artifacts/colony-cycle.sqlite3
      - name: Upload verifiable cycle, agent results, and restart state
        uses: actions/upload-artifact@v4
        with:
          name: cano-colony-cycle-${{ github.run_id }}
          path: |
            artifacts/colony-cycle.json
            artifacts/colony-cycle.sqlite3
          retention-days: 30

  publish:
    needs: propose
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download this run's validated artifact
        uses: actions/download-artifact@v4
        with:
          name: cano-colony-cycle-${{ github.run_id }}
          path: report
      - name: Publish only the non-sensitive JSON report
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("report/colony-cycle.json")
          if not path.is_file() or path.stat().st_size > 1000000:
              raise SystemExit("bounded report missing or too large")
          report = json.loads(path.read_text(encoding="utf-8"))
          if str(report.get("github_run_id")) != os.environ["GITHUB_RUN_ID"]:
              raise SystemExit("report run id mismatch")
          if report.get("db_integrity") != "ok" or report.get("mode") != "bounded_virtual_reproduction_with_held_out_validation":
              raise SystemExit("report validation failed")
          specialists = report.get("specialist_agents")
          roles = specialists.get("roles") if isinstance(specialists, dict) else None
          expected = {"evidence", "generation", "continuity", "security"}
          if not isinstance(roles, list) or specialists.get("status") != "passed":
              raise SystemExit("specialist validation failed")
          if {item.get("role") for item in roles if isinstance(item, dict)} != expected:
              raise SystemExit("specialist roles invalid")
          if any(item.get("status") != "passed" or item.get("execution") != "isolated_read_only_subprocess" or item.get("model_calls") != 0 for item in roles):
              raise SystemExit("specialist results invalid")
          PY
          mkdir publish
          cp report/colony-cycle.json publish/colony-cycle.json
          cd publish
          git init --quiet
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          if git -c http.extraheader="$auth_header" fetch --no-tags origin refs/heads/cano-latest:refs/remotes/origin/cano-latest; then
            git checkout --quiet -b cano-latest refs/remotes/origin/cano-latest
          else
            git checkout --quiet --orphan cano-latest
          fi
          cp ../report/colony-cycle.json colony-cycle.json
          git add colony-cycle.json
          git commit --quiet -m "Publish CANO run $GITHUB_RUN_ID"
          git -c http.extraheader="$auth_header" push --quiet origin HEAD:refs/heads/cano-latest
