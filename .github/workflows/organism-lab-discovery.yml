name: Organism Lab bounded discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * *"
permissions:
  contents: write

concurrency:
  group: organism-lab-discovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bounded-simulation-search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run lab regression and discovery tests
        working-directory: organism_lab_cloud
        env:
          PYTHONPATH: .
        run: python -m unittest organism_lab.tests.test_discovery_sweep organism_lab.tests.test_adaptation_study organism_lab.tests.test_reproduction_study -v
      - name: Run bounded screen and independent-seed confirmation
        env:
          PYTHONPATH: organism_lab_cloud
        run: |
          report="research_reports/organism-lab-discoveries/$(date -u +%F).json"
          python scripts/organism_lab_discovery.py --output "$report"
          python -c 'import json,sys; from organism_lab.discovery_sweep import validate_discovery_sweep; p=sys.argv[1]; d=json.load(open(p, encoding="utf-8")); validate_discovery_sweep(d); print("Validated deterministic recomputation:", d["status"])' "$report"
      - name: Archive the auditable simulation report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_reports/organism-lab-discoveries/
          if ! git diff --cached --quiet; then
            git commit -m "archive: bounded organism lab simulation discovery"
            git push
          fi
