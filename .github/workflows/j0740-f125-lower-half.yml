name: J0740 F125 lower-half fixed-J bisection
on:
  pull_request:
    branches:
      - science/j0740-apr4-firstlaw-gr-pilot-20261117
    paths:
      - 'research/j0740/f125/**'
      - '.github/workflows/j0740-f125-lower-half.yml'
permissions:
  contents: read
  actions: read
jobs:
  lower_half_fixed_j:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rns-alberta/rns
          ref: 97e85d325a33e37f702306414533f6cd77812477
          path: rns-upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical dependencies
        run: python -m pip install 'numpy==2.3.5' 'scipy==1.16.3'
      - name: Retrieve and checksum F124 baseline
        env:
          GH_TOKEN: ${{ github.token }}
          F124_ARTIFACT_ZIP: results/F124/F124_artifact.zip
        run: |
          set -euo pipefail
          mkdir -p results/F124 results/F125
          curl -fLsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14774015248/zip" -o "$F124_ARTIFACT_ZIP"
          printf '%s  %s\n' d82d43d5b72d9d2f7e7ee90f4163bf308905ec2dfca9d5c709885976e42fb196 "$F124_ARTIFACT_ZIP" | sha256sum -c -
      - name: Validate F124 baseline and new midpoint
        env:
          F124_ARTIFACT_ZIP: results/F124/F124_artifact.zip
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from research.j0740.f125.f125_lower_half_bisection import read_f125, MID_RHO
          result, _ = read_f125(Path(os.environ["F124_ARTIFACT_ZIP"]))
          assert result["status"] == "F124_LOWER_HALF_BISECTION_COMPLETE"
          assert MID_RHO == 2622286765625000
          print("F124_BASELINE_AND_F125_MIDPOINT_PASS")
          PY
      - name: Restore pinned F99 EOS and compile RNS C on 3001x6001
        run: |
          set -euo pipefail
          cp research/j0740/f104/F99_DERIVED_1981_node_causal_cold_affine_EOS.rns m99.rns
          printf '%s  %s\n' c99eadee07bf6cbbf78f59b6171ef7e21ffad7d034f4ca4e9b7d85d36d9b4331 m99.rns | sha256sum -c -
          test "$(git -C rns-upstream rev-parse HEAD)" = '97e85d325a33e37f702306414533f6cd77812477'
          cp -a rns-upstream rns3001
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, "research/j0740/f81")
          from f81_exact_mass_spin import patch_print_only
          p = Path("rns3001/rns.c")
          p.write_text(patch_print_only(p.read_text()))
          mf = Path("rns3001/makefile")
          t = mf.read_text()
          old = "HIGHSIZE=-DMDIV=151 -DSDIV=301"
          assert t.splitlines().count(old) == 1
          mf.write_text(t.replace(old, "HIGHSIZE=-DMDIV=3001 -DSDIV=6001", 1))
          src = Path("rns3001/findmodel.c").read_bytes()
          assert b"float ans, fh,fl,fm,fnew,sroot,xh,xl,xm,xnew,xacc=1e-5;" in src
          PY
          make -C rns3001 CC='gcc -include stdlib.h' rns
          sha256sum rns3001/rns | tee results/F125/F125_FINE_MESH_NATIVE_C_BINARY_SHA256.txt
      - name: Solve only the F125 lower-half midpoint
        env:
          F124_ARTIFACT_ZIP: results/F124/F124_artifact.zip
        run: |
          set -euo pipefail
          OPENBLAS_NUM_THREADS=1 python -u research/j0740/f125/f125_lower_half_bisection.py \
            --f124 results/F124/F124_artifact.zip \
            --eos m99.rns --rns "$GITHUB_WORKSPACE/rns3001/rns" \
            --out results/F125/F125_LOWER_HALF_BISECTION.json \
            2>&1 | tee results/F125/F125_LOWER_HALF_BISECTION.log
      - name: Preserve F123 baseline and every F125 trial
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: J0740-F125-lower-half-fixed-J-bisection
          path: |
            results/F124/F124_artifact.zip
            results/F125/
          if-no-files-found: warn