name: BIRDS raw conversion and supported alarm audit
on:
  pull_request:
    paths:
      - research/inspect_raw_channels.py
      - research/birds_raw_conversion_audit.py
      - research/birds_conversion_diagnostics.py
      - research/birds_raw_supported_alarms.py
      - research/birds_published_panel_rules.py
      - research/birds_eps_constellation_qc.py
      - research/tsuru_agv_real_source_ci.py
      - .github/workflows/birds-raw-supported-alarms.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python -m pip install numpy==1.26.4
      - name: Download and verify original Git blobs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python research/inspect_raw_channels.py
      - run: python research/birds_raw_conversion_audit.py
      - run: python research/birds_conversion_diagnostics.py
      - run: python research/birds_raw_supported_alarms.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: birds-raw-conversion-and-alarm-receipts
          path: |
            BIRDS_RAW_CONVERSION_RECEIPT.json
            BIRDS_CONVERSION_DIAGNOSTIC_SUMMARY.json
            BIRDS_RAW_SUPPORTED_ALARM_RECEIPT.json
          if-no-files-found: error
          retention-days: 30
