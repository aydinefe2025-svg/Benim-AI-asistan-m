name: Battery original Figshare 47627029 small CSV source check
on:
  pull_request:
    paths:
      - 'research/battery_curve_audit/figshare25975315_small_csv.py'
      - 'tests/test_figshare25975315_small_csv.py'
      - '.github/workflows/battery-figshare25975315-small-csv.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-30kb-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact tested ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run synthetic original integrity and identity boundary tests
        run: python -m unittest tests.test_figshare25975315_small_csv -v
      - name: Download only publisher original 30KB CSV and verify MD5
        run: |
          python -m research.battery_curve_audit.figshare25975315_small_csv \
            /tmp/cano_figshare25975315_original_small_csv_receipt.json
      - name: Require physical product status stays closed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("/tmp/cano_figshare25975315_original_small_csv_receipt.json").read_text())
          assert r["original_file_id"]==47627029
          assert r["original_file_bytes"]==30658
          assert r["original_md5_matches_publisher"] is True
          assert r["record_rows"]==279
          assert r["distinct_serial_values"]==141
          assert r["distinct_stage_serial_pairs"]==279
          assert r["serial_alone_collides_across_stages"] is True
          assert r["valid_metadata_composite_identity_key"]==["stage","serial"]
          assert r["composite_stage_serial_row_collisions"]==0
          assert r["raw_cell_waveforms_downloaded"]==0
          assert r["independently_authenticated_physical_cell_identities"]==0
          assert r["cross_cell_confusion_rate_measured"] is False
          assert r["production_release_allowed"] is False
          print("SOURCE_ORIGINAL_SMALL_CSV_ONLY",r["record_rows"])
          PY
      - name: Archive safe aggregated CSV source structure, never original CSV
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: battery-figshare-original-small-csv-structure
          path: /tmp/cano_figshare25975315_original_small_csv_receipt.json
          retention-days: 7
          if-no-files-found: error
