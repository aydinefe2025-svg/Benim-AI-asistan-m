name: CANO independent DR source-restore integrity comparison

on:
  pull_request:
    branches:
      - fix/sqlite-backup-restore-20261031
    paths:
      - 'scripts/cano_dr_compare.py'
      - 'scripts/check_cano_dr_compare_roundtrip.py'
      - 'tests/test_cano_dr_compare.py'
      - '.github/workflows/cano-dr-readback.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-target-readback:
    name: 'PostgreSQL ${{ matrix.pg }}: independent source/restore readback'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        pg: ['17', '18']
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: ci_persistence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_persistence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GITHUB_ACTIONS: 'true'
      CANO_CI_ALLOW_DISPOSABLE_DB: '1'
      CANO_CI_PG_MAJOR: ${{ matrix.pg }}
      TEST_DATABASE_URL: postgresql://ci_user:synthetic-ci-only@127.0.0.1:5432/ci_persistence
    steps:
      - name: Fetch exact source commit
        uses: actions/checkout@v5
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install isolated PostgreSQL adapter
        run: python -m pip install -r requirements-persistence.txt
      - name: Compare two distinct real PostgreSQL databases with deliberate tampering
        run: python -m scripts.check_cano_dr_compare_roundtrip
      - name: Run independent negative unit regressions
        run: python -m unittest discover -s tests -p 'test_cano_dr_compare.py' -v
      # Do not upload user data, dumps, credentials, or connection strings.
