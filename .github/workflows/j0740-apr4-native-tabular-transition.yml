name: J0740 APR4 tabular-native crust transition source crosscheck
on:
  push:
    branches:
      - science/j0740-apr4-native-tabular-transition-20261117
    paths:
      - research/j0740/rotating_gr/audit_apr4_native_tabular_transition_20261117.py
      - research/j0740/rotating_gr/test_apr4_native_tabular_transition_20261117.py
      - .github/workflows/j0740-apr4-native-tabular-transition.yml
permissions:
  contents: read
jobs:
  native-tabular-derivative:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: nuclear-multimessenger-astronomy/jester
          ref: e6768650ce992abfd1153a6833857572fe5cd230
          path: jester-source
          sparse-checkout: |
            jesterTOV/tabulated_eos/lalsuite
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned independent native LALSuite
        run: python -m pip install "numpy==2.5.5" "lalsuite==8.0.2"
      - name: Recompute all original low-pressure nodes using named native EOS
        run: |
          python research/j0740/rotating_gr/audit_apr4_native_tabular_transition_20261117.py \
            --source jester-source/jesterTOV/tabulated_eos/lalsuite/APR4_EPP.npz \
            --output results/J0740_APR4_NATIVE_TABULAR_TRANSITION_20261117.json
      - name: Verify pinned-input physical distinction
        env:
          JESTER_APR4_SOURCE: jester-source/jesterTOV/tabulated_eos/lalsuite/APR4_EPP.npz
          PYTHONPATH: research/j0740/rotating_gr
        run: python -W error -m unittest -v research.j0740.rotating_gr.test_apr4_native_tabular_transition_20261117
      - name: Upload new source-reference evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: j0740-apr4-tabular-native-crust-crosscheck
          path: results/
          if-no-files-found: warn
          retention-days: 30
