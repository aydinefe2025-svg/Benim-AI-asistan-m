name: J0740 F104 source-native fourth-mesh local fixed-J peak probe
on:
  pull_request:
    branches:
      - science/j0740-apr4-firstlaw-gr-pilot-20261117
    paths:
      - 'research/j0740/f104/**'
      - '.github/workflows/j0740-f104-fourth-mesh-fixed-j-peak-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  fourth_mesh_native_c_probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rns-alberta/rns
          ref: 97e85d325a33e37f702306414533f6cd77812477
          path: rns-upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical dependencies
        run: python -m pip install 'numpy==2.3.5' 'scipy==1.16.3'
      - name: Retrieve and lock F103 evidence and the original publisher APR input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p results/F88 results/F103 results/F104
          curl -fLsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14751094327/zip" -o results/F103/F103_artifact.zip
          printf '%s  %s\n' 1491d406b68886522c514c7a08e40ef6e673cf8d48e86c6666c390a96eb11f30 results/F103/F103_artifact.zip | sha256sum -c -
          python -m zipfile -e results/F103/F103_artifact.zip results/F103
          gh run download 44818195695 -R "$GITHUB_REPOSITORY" -n J0740-F88-ACTUAL-ORIGINAL-APR-C-RNS-TWO-GRID -D results/F88
          printf '%s  %s\n' 8338af81270a87c93f19c28df86fbaac5618296aff6535177eb41052c77dcb12 results/F88/F87_verified_publisher_original.zip | sha256sum -c -
          printf '%s  %s\n' 7643d0e4361adee77cc79d1b69eb445db70a52443b833c4dddafa973193fb580 results/F88/m.rns | sha256sum -c -
      - name: Independently verify prior 251x501 C points, all raw calls, and F102 baseline
        env:
          F103_ARTIFACT_ZIP: results/F103/F103_artifact.zip
        run: |
          set -euo pipefail
          python -m unittest discover -s research/j0740/f104 -p 'test_f104_*.py' -v
          python - <<'PY'
          import os
          from pathlib import Path
          from research.j0740.f104.f104_fourth_mesh_peak_probe import read_baseline
          prior,base=read_baseline(Path(os.environ['F103_ARTIFACT_ZIP']))
          assert len(prior['new_native_C_stars']) == 7
          assert sum(len(v['stars']) for v in base['both_native_C_grids'].values()) == 28
          print('F104_F103_SEVEN_NATIVE_C_AND_F102_28_NATIVE_C_LOCKED')
          PY
      - name: Recreate the exact pinned F99 derived EOS used in previous accepted runs
        run: |
          set -euo pipefail
          python research/j0740/f99/f99_physical_firstlaw_source_no_go_derived_eos.py --source results/F88/m.rns --out m99.rns --report results/F104/F104_REUSE_F99_EOS.json
          printf '%s  %s\n' c99eadee07bf6cbbf78f59b6171ef7e21ffad7d034f4ca4e9b7d85d36d9b4331 m99.rns | sha256sum -c -
      - name: Compile pinned original Einstein RNS C on distinct 301x601 mesh
        run: |
          set -euo pipefail
          test "$(git -C rns-upstream rev-parse HEAD)" = '97e85d325a33e37f702306414533f6cd77812477'
          cp -a rns-upstream rns301
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0,'research/j0740/f81')
          from f81_exact_mass_spin import patch_print_only
          p=Path('rns301/rns.c')
          p.write_text(patch_print_only(p.read_text()))
          mf=Path('rns301/makefile')
          t=mf.read_text()
          old='HIGHSIZE=-DMDIV=151 -DSDIV=301'
          assert t.splitlines().count(old)==1
          mf.write_text(t.replace(old,'HIGHSIZE=-DMDIV=301 -DSDIV=601',1))
          src=Path('rns301/findmodel.c').read_bytes()
          assert b'float ans, fh,fl,fm,fnew,sroot,xh,xl,xm,xnew,xacc=1e-5;' in src
          PY
          make -C rns301 CC='gcc -include stdlib.h' rns
          sha256sum rns301/rns | tee results/F104/F104_NATIVE_C_BINARY_SHA256.txt
      - name: Run only the seven preselected F103 local densities on 301x601 native C
        run: |
          set -euo pipefail
          OPENBLAS_NUM_THREADS=1 python -u research/j0740/f104/f104_fourth_mesh_peak_probe.py             --f103 results/F103/F103_artifact.zip --eos m99.rns             --rns "$GITHUB_WORKSPACE/rns301/rns"             --out results/F104/F104_301x601_LOCAL_PEAK.json             2>&1 | tee results/F104/F104_NATIVE_C_ROOTS.log
      - name: Preserve only new F104 source-C trace and prior immutable baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: J0740-F104-301x601-fourth-mesh-native-fixedJ-local-peak
          path: |
            results/F104/
            results/F103/F103_artifact.zip
            results/F103/F103/F103_251x501_LOCAL_PEAK.json
            results/F103/F103/F103_251x501_LOCAL_PEAK.jsonl
            results/F102/F102/F102_ORIGINAL_24_PLUS_F101_1_PLUS_F102_3_REAL_C_STARS.json
          if-no-files-found: warn
