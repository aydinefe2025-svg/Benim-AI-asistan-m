name: J0740 real RNS EOS 196 vs 200 resolution test
on:
  pull_request:
    paths:
      - "research/j0740/rotating_gr/rns_196_vs_200_resolution.py"
      - "research/j0740/rotating_gr/test_rns_196_vs_200_resolution.py"
      - ".github/workflows/j0740-rns-196-vs-200.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  refine-seven-eos:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rns-alberta/rns
          ref: 97e85d325a33e37f702306414533f6cd77812477
          path: rns-upstream
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: nuclear-multimessenger-astronomy/jester
          ref: e6768650ce992abfd1153a6833857572fe5cd230
          path: jester-upstream
          sparse-checkout: |
            jesterTOV/tabulated_eos/lalsuite
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy
      - name: Test model comparison guards and scientific limits
        working-directory: research/j0740/rotating_gr
        run: python -m unittest -v test_rns_196_vs_200_resolution
      - name: Compile pinned RNS C binary
        run: make -C rns-upstream rns
      - name: Fetch previous 7/7 model results, no 12.9GB archive or RNS base rerun
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prior-rns
          gh run download 42353019033 --repo "$GITHUB_REPOSITORY" \
            --name j0740-seven-eos-rns-fixed-mass-results \
            --dir prior-rns
      - name: Compute actual 200pt EOS RNS rotating and static controls, same central density
        run: |
          python research/j0740/rotating_gr/rns_196_vs_200_resolution.py \
            --rns-json prior-rns/J0740_seven_EOS_full_GR_fixed_spin_mass.json \
            --rns rns-upstream/rns \
            --jester-dir jester-upstream/jesterTOV/tabulated_eos/lalsuite \
            --out results/J0740_RNS_196_vs_200_exact_source_GR_stress.json
      - name: Retain all successful or failed detailed physical comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j0740-seven-eos-real-rns-196-vs-200-evidence
          path: results/J0740_RNS_196_vs_200_exact_source_GR_stress.json
          if-no-files-found: warn
          retention-days: 30
