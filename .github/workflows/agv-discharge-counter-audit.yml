name: AGV publisher discharge field and counter audit
on:
  pull_request:
    paths:
      - research/agv_discharge_counter_audit.py
      - .github/workflows/agv-discharge-counter-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python research/agv_discharge_counter_audit.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agv-publisher-counter-contract
          path: AGV_COUNTER_SOURCE_RECEIPT.json
          if-no-files-found: error
          retention-days: 30
