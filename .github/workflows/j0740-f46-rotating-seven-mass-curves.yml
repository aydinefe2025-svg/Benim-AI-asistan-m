name: J0740 F46 seven candidate fixed-spin GR mass curves
on:
  pull_request:
    branches:
      - science/j0740-apr4-firstlaw-gr-pilot-20261117
    paths:
      - 'research/j0740/f46/**'
      - '.github/workflows/j0740-f46-rotating-seven-mass-curves.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  f46-direct-c-gr-mass-curves:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        eos: [APR4_EPP, ENG, MPA1, MS1, MS1B, WFF1, WFF2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rns-alberta/rns
          ref: 97e85d325a33e37f702306414533f6cd77812477
          path: rns-upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.13,<2'
      - name: F46 synthetic root tests (must pass)
        run: python -m unittest discover -s research/j0740/f46 -p 'test_f46_rotating_mass_curve.py' -v
      - name: Download pinned F42 and F44 true solver archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p results/F46/input
          curl -fL --retry 3 --max-time 120 -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/aydinefe2025-svg/Benim-AI-asistan-m/actions/artifacts/14412145963/zip' \
            -o results/F46/input/F42.zip
          curl -fL --retry 3 --max-time 120 -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/aydinefe2025-svg/Benim-AI-asistan-m/actions/artifacts/14413168551/zip' \
            -o results/F46/input/F44.zip
          echo 'c8d8cdc9804a702860ab1af65b60fa25dfac0f74fce9ec6347c4271ea3353115  results/F46/input/F42.zip' | sha256sum -c -
          echo 'b45d99bf5d58179f49df12a5101b8c40204e146aef31e0987b5260d6ffd0bd98  results/F46/input/F44.zip' | sha256sum -c -
      - name: Compile full GR RNS C solver with precision-only printf patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'research/j0740/rotating_gr')
          from precise_apr4_mass_spin_root import patch_output_precision
          print(patch_output_precision(Path('rns-upstream/rns.c')))
          PY
          make -C rns-upstream CC='gcc -include stdlib.h' HIGHSIZE='-DMDIV=201 -DSDIV=401' rns
      - name: Direct C/GR mass sweep with 2D mass-spin roots for selected model
        shell: bash
        run: |
          set -euo pipefail
          python research/j0740/f46/f46_rotating_mass_curve.py \
            --f42 results/F46/input/F42.zip --f44 results/F46/input/F44.zip \
            --binary rns-upstream/rns --work results/F46/eos_tables \
            --name '${{ matrix.eos }}' --out 'results/F46/${{ matrix.eos }}_fixed_spin_direct_curve.json'
      - name: Save immutable evidence manifest, including failures
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('results/F46');root.mkdir(parents=True,exist_ok=True)
          data={str(p.relative_to(root)):{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
                for p in root.rglob('*') if p.is_file() and p.suffix=='.json'}
          (root/'F46_manifest.json').write_text(json.dumps(data,sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: j0740-f46-direct-mass-curve-${{ matrix.eos }}
          path: |
            results/F46/*_fixed_spin_direct_curve.json
            results/F46/F46_manifest.json
          if-no-files-found: warn
          retention-days: 30
