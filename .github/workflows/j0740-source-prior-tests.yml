name: J0740 source-prior numerical tests

on:
  pull_request:
    paths:
      - "research/j0740/**"
      - ".github/workflows/j0740-source-prior-tests.yml"
  push:
    branches: [main]
    paths:
      - "research/j0740/**"
      - ".github/workflows/j0740-source-prior-tests.yml"

permissions:
  contents: read

jobs:
  source-prior-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependencies
        run: python -m pip install -r research/j0740/requirements.txt
      - name: Verify source-prior math and seven pinned EOS labels
        working-directory: research/j0740
        run: |
          python -m compileall -q .
          python -m unittest -v test_j0740_science
