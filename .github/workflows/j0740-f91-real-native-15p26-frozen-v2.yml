name: J0740 F91 honest native heldout FAIL plus frozen v2 source validation
on:
  pull_request:
    branches:
      - science/j0740-apr4-firstlaw-gr-pilot-20261117
    paths:
      - 'research/j0740/windows_access/f91/**'
      - '.github/workflows/j0740-f91-real-native-15p26-frozen-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source_native_evidence_and_frozen_candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin numerical test dependency
        run: python -m pip install 'numpy==2.3.5'
      - name: Test actual Windows native FAIL receipts, original SHA and new untouched acceptance gates
        run: |
          set -euo pipefail
          mkdir -p results/F91
          python -m unittest discover -s research/j0740/windows_access/f91 -p 'test_f91_source_native_acceptance_gates.py' -v 2>&1 | tee results/F91/F91_source_receipt_unit_tests.log
      - name: Independent source HASH manifest; do not upload original private NPZ JSONL
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          d=Path('research/j0740/windows_access/f91')
          dest=Path('results/F91');dest.mkdir(exist_ok=True,parents=True)
          m={p.name:{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
             for p in sorted(d.iterdir()) if p.is_file()}
          (dest/'F91_public_code_and_derived_receipts_sha256.json').write_text(json.dumps(m,indent=2)+'\n')
          assert m['F91_v1_original_frozen_source_design_20261121.json']['sha256']=='50477db36217448177ef489980b395d6a92f37ec2409f2187b3420a0267bff82'
          assert m['F91_v2_frozen_15p26_tail_design_20261121.json']['sha256']=='82f0393ca7389ae68d1dc5c751d7ff1b24ece790a16a284f22f5155b7ec25a2f'
          print('F91_SNAPSHOT_CORRECTLY_PINNED_OLD_FAIL_V2_UNTESTED')
          PY
      - name: Upload source audit only (not physical acceptance of fresh v2)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: J0740-F91-ORIGINAL-FAIL-AND-FROZEN-V2-DESIGN-RECEIPT
          path: results/F91/
          if-no-files-found: warn
