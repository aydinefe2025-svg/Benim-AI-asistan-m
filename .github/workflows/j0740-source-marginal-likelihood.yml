name: J0740 source 15D nuisance-marginalized M-R likelihood grid
on:
  pull_request:
    paths:
      - "research/j0740/likelihood/**"
      - ".github/workflows/j0740-source-marginal-likelihood.yml"
  push:
    branches: [main]
    paths:
      - "research/j0740/likelihood/**"
      - ".github/workflows/j0740-source-marginal-likelihood.yml"
permissions:
  contents: read
jobs:
  salmi-marginalized-mr:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install numerical dependencies
        run: python -m pip install "numpy>=1.26,<3" "scipy>=1.13,<2"
      - name: Five independent synthetic source-prior/likelihood regression tests
        working-directory: research/j0740/likelihood
        run: python -m unittest -v test_source_mr_marginal_likelihood
      - name: Fetch Salmi 2024 ORIGINAL 40.6MB source with SHA256 fail-closed
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,urllib.request,time
          target=Path('results/source/mr_samples_and_contours.tar.gz')
          target.parent.mkdir(parents=True,exist_ok=True)
          urls=[
           'https://zenodo.org/records/10519473/files/mr_samples_and_contours.tar.gz?download=1',
           'https://zenodo.org/api/records/10519473/files/mr_samples_and_contours.tar.gz/content',
           'https://zenodo.org/record/10519473/files/mr_samples_and_contours.tar.gz?download=1'
          ]
          expected='1549467c64a8801c39213bd28c89737d087cc5ab7a70da1d8d3a32b2d09185c8'
          errs=[]
          for attempt in range(2):
           for url in urls:
            try:
             req=urllib.request.Request(url,headers={'User-Agent':'J0740-A01.01.51-source-verification/1.0','Accept':'application/octet-stream'})
             with urllib.request.urlopen(req,timeout=140) as src, target.open('wb') as dst:
              h=hashlib.sha256()
              while data:=src.read(1<<20):
               h.update(data);dst.write(data)
             if h.hexdigest()!=expected or target.stat().st_size!=40605003:
              raise ValueError('SOURCE_SHA256_OR_SIZE_MISMATCH')
             print('PASS original source SHA256 and size',target.stat().st_size,flush=True)
             break
            except Exception as exc:
             errs.append(str(exc)[:180]);target.unlink(missing_ok=True)
           if target.exists():break
           time.sleep(2)
          if not target.exists():raise SystemExit('SOURCE_UNAVAILABLE_FAIL_CLOSED '+repr(errs))
          PY
      - name: Construct relative nuisance-marginalized M-R likelihood grids, compare both source sample representations
        run: |
          python research/j0740/likelihood/source_mr_marginal_likelihood.py \
            --source results/source/mr_samples_and_contours.tar.gz \
            --outdir results/F38
          python - <<'PY'
          import json,pathlib
          f=pathlib.Path('results/F38/source_likelihood_report.json')
          r=json.loads(f.read_text())
          assert r['status'].startswith('PASS_APPROXIMATE_')
          assert len(r['results'])==6
          assert r['max_relative_weighted_vs_resampled_percent']<5.0
          print('F38_REAL_SOURCE_VALIDATION_PASS',r['max_relative_weighted_vs_resampled_percent'])
          PY
      - name: Archive checksum manifest and source identity (NOT full 40.6MB source)
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('results/F38')
          root.mkdir(parents=True,exist_ok=True)
          files={p.name:{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in root.iterdir() if p.is_file()}
          (root/'SHA256_manifest.json').write_text(json.dumps(files,indent=2,sort_keys=True)+'\n')
          print(json.dumps(files,indent=2))
          PY
      - name: Save model grid or explicit failure checkpoints
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: j0740-F38-published-source-marginalized-mr-likelihood
          path: results/F38
          retention-days: 30
          if-no-files-found: warn
