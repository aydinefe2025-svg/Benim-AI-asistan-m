name: J0740 F111 fixed-ratio jump-bracket native-C diagnostic
on:
  pull_request:
    branches:
      - science/j0740-apr4-firstlaw-gr-pilot-20261117
    paths:
      - 'research/j0740/f111/**'
      - '.github/workflows/j0740-f111-jump-bracket.yml'
permissions:
  contents: read
  actions: read
jobs:
  fixed_ratio_jump_bracket_native_c:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rns-alberta/rns
          ref: 97e85d325a33e37f702306414533f6cd77812477
          path: rns-upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical dependencies
        run: python -m pip install 'numpy==2.3.5' 'scipy==1.16.3'
      - name: Retrieve and checksum the accepted F110 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p results/F110 results/F111
          curl -fLsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14757667027/zip" -o results/F110/F110_artifact.zip
          printf '%s  %s\n' 30fcc9f4c12b1575ee71fb066eb3bc8da1b0c596d9aa902e90018ea3618ac912 results/F110/F110_artifact.zip | sha256sum -c -
      - name: Validate F110 baseline and the 18-call non-repeat plan
        env:
          F110_ARTIFACT_ZIP: results/F110/F110_artifact.zip
        run: |
          set -euo pipefail
          python -m unittest discover -s research/j0740/f111 -p 'test_f111_*.py' -v
          python - <<'PY'
          import os
          from pathlib import Path
          from research.j0740.f111.f111_fixed_ratio_jump_bracket import read_f110, INTERIOR_RHO_TICKS_1E10
          result, rows = read_f110(Path(os.environ['F110_ARTIFACT_ZIP']))
          assert len(rows) == 18 and len(INTERIOR_RHO_TICKS_1E10) == 9
          assert len(result['series_by_fixed_ratio']['A']['points']) == 11
          assert len(result['series_by_fixed_ratio']['B']['points']) == 11
          print('F110_BASELINE_AND_18_NONREPEAT_CALLS_PASS')
          PY
      - name: Restore exact pinned F99 EOS and compile pinned RNS C
        run: |
          set -euo pipefail
          cp research/j0740/f104/F99_DERIVED_1981_node_causal_cold_affine_EOS.rns m99.rns
          printf '%s  %s\n' c99eadee07bf6cbbf78f59b6171ef7e21ffad7d034f4ca4e9b7d85d36d9b4331 m99.rns | sha256sum -c -
          test "$(git -C rns-upstream rev-parse HEAD)" = '97e85d325a33e37f702306414533f6cd77812477'
          cp -a rns-upstream rns501
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'research/j0740/f81')
          from f81_exact_mass_spin import patch_print_only
          p = Path('rns501/rns.c')
          p.write_text(patch_print_only(p.read_text()))
          mf = Path('rns501/makefile')
          t = mf.read_text()
          old = 'HIGHSIZE=-DMDIV=151 -DSDIV=301'
          assert t.splitlines().count(old) == 1
          mf.write_text(t.replace(old, 'HIGHSIZE=-DMDIV=501 -DSDIV=1001', 1))
          src = Path('rns501/findmodel.c').read_bytes()
          assert b'float ans, fh,fl,fm,fnew,sroot,xh,xl,xm,xnew,xacc=1e-5;' in src
          PY
          make -C rns501 CC='gcc -include stdlib.h' rns
          sha256sum rns501/rns | tee results/F111/F111_NATIVE_C_BINARY_SHA256.txt
      - name: Run only 18 new interior density calls at two fixed ratios
        env:
          F110_ARTIFACT_ZIP: results/F110/F110_artifact.zip
        run: |
          set -euo pipefail
          OPENBLAS_NUM_THREADS=1 python -u research/j0740/f111/f111_fixed_ratio_jump_bracket.py \
            --f110 results/F110/F110_artifact.zip \
            --eos m99.rns --rns "$GITHUB_WORKSPACE/rns501/rns" \
            --out results/F111/F111_FIXED_RATIO_JUMP_BRACKET.json \
            2>&1 | tee results/F111/F111_NATIVE_C_JUMP_BRACKET.log
      - name: Preserve baseline and raw density-bracket evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: J0740-F111-fixed-ratio-jump-bracket-native-C-diagnostic
          path: |
            results/F110/F110_artifact.zip
            results/F111/
          if-no-files-found: warn
