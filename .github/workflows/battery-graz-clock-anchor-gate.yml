name: Graz V3 independent clock-anchor simulation gate
on:
  pull_request:
    paths:
      - 'research/battery_curve_audit/graz_clock_anchor_gate.py'
      - 'research/battery_curve_audit/graz_clock_gate_stress.py'
      - 'tests/test_graz_clock_anchor_gate.py'
      - 'tests/test_graz_clock_gate_stress.py'
      - '.github/workflows/battery-graz-clock-anchor-gate.yml'
  workflow_dispatch:
jobs:
  independent-clock-synthetic:
    name: independent-clock-synthetic (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify existing V2 and all V3 adversarial contracts
        run: python -m unittest -v tests.test_graz_virtual_lab tests.test_graz_clock_anchor_gate tests.test_graz_clock_gate_stress
      - name: Monte Carlo authenticated witness clock stress (12 independent seeds)
        run: python -m research.battery_curve_audit.graz_clock_gate_stress graz_v3_virtual_evidence.json --seeds 12
      - name: Assert fabricated cert and missing provenance fail closed
        shell: python
        run: |
          import json
          d=json.load(open('graz_v3_virtual_evidence.json',encoding='utf-8'))
          assert d['simulation_only'] and not d['real_source_data_downloaded']
          assert not d['physical_production_release_allowed']
          assert not d['hardware_trusted_roots_available']
          assert len(d['scenarios'])==14
          assert d['source_reference_only']['real_original_within_1s_matches']==204673
          assert set(d['physical_id_strings_in_simulation'])=={'01','02','03','04','05'}
          assert sum(x['synthetic_samples'] for x in d['scenarios'])==14*12*5*240
          assert all(x['wrong_time_accepted']==0 for x in d['scenarios'])
          assert next(x for x in d['scenarios'] if x['scenario']=='false_attestation_3second_offset')['accepted']==0
          assert next(x for x in d['scenarios'] if x['scenario']=='nominal_signed_two_root')['accepted']>0
          assert next(x for x in d['scenarios'] if x['scenario']=='electrical_dropout_60pct')['accepted']>0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: graz-v3-independent-clock-synthetic-${{ matrix.os }}
          path: graz_v3_virtual_evidence.json
          retention-days: 14
          if-no-files-found: error