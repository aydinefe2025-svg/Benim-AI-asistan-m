name: Battery original Figshare K01 initial-test protocol context
on:
  pull_request:
    paths:
      - 'research/battery_curve_audit/figshare_k01_protocol_context.py'
      - 'tests/test_figshare_k01_protocol_context.py'
      - '.github/workflows/battery-figshare-k01-protocol-context.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  author-context-against-live-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run synthetic corruption and overclaim regressions
        run: python -m unittest tests.test_figshare_k01_protocol_context -v
      - name: Recompute ONLY new paper-context decision over 3 original MD5-pinned Figshare archives
        run: |
          python -m research.battery_curve_audit.figshare_k01_protocol_context --live /tmp/cano_figshare_k01_protocol_receipt.json
      - name: Enforce scientific boundary on actual original measurements
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/cano_figshare_k01_protocol_receipt.json').read_text())
          assert d['decision']=='AUTHOR_PROTOCOL_EXPLAINS_PLAUSIBLE_NEAR_AGREEMENT_NOT_COPY_PROOF'
          assert d['author_protocol_context']['calendar_aging_04_06_only_initial_and_final_rpt'] is True
          assert d['source_window_count']==3
          assert d['physical_duplicate_established'] is False
          assert d['production_release_allowed'] is False
          assert d['field_FPR_FNR_established'] is False
          pairs={tuple(x['source_file_ids']):x for x in d['pair_results']}
          assert len(pairs)==3
          p=pairs[(47627089,47627092)]
          assert p['classification']=='HIGH_INITIAL_TEST_NEAR_AGREEMENT_LOW_COVERAGE'
          assert p['near_2mV_observations']==1714
          assert p['common_regime_observations']==1715
          assert p['gt_50mV_outlier_observations']==1
          assert p['proven_duplicate_measurement'] is False
          print('PAPER_CONTEXT_NOT_COPY_PROOF',p['near_fraction_of_common_regime'])
          PY
      - name: Archive only conservative aggregate metadata, never original measurement samples
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: battery-k01-original-paper-protocol-interpretation-only
          path: /tmp/cano_figshare_k01_protocol_receipt.json
          retention-days: 7
          if-no-files-found: error
