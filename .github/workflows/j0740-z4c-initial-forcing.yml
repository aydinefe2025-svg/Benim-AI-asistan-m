name: J0740 isolate initial Z4c forcing terms
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/j0740-z4c-initial-forcing.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-fluid:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        n: [64]
        kappa: ['1.0']
    env:
      J0740_N: ${{ matrix.n }}
      J0740_KAPPA: ${{ matrix.kappa }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: computationalrelativity/gr-athena
          ref: f534ca0f6fa0d55b90df1686fa9abd476730bf3b
          path: athena
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: computationalrelativity/RNSC
          ref: 4bff105b52b2738f2d11fd2df8a458dce1e6b172
          path: rnsc
          persist-credentials: false
      - name: Fetch and verify exact F171 source, prepare native input
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/run
          sudo apt-get update -qq
          sudo apt-get install -y libhdf5-dev libgsl-dev python3-numpy python3-h5py python3-scipy gdb
          gh api repos/${{ github.repository }}/actions/artifacts/15038164239/zip > evidence/F171.zip
          echo 'a7770d2fb40bea0a50d2c2f7f7c60fce1ad755d53b9ccd8648c3b036dfbba77c  evidence/F171.zip' | sha256sum -c -
          /usr/bin/python3 - <<'PY'
          import hashlib, json, pathlib, zipfile, io, math
          import numpy as np
          import h5py
          d=pathlib.Path('evidence').resolve()
          with zipfile.ZipFile(d/'F171.zip') as z:
              assert z.testzip() is None
              b=z.read('model.rns')
              assert hashlib.sha256(b).hexdigest()=='bd9cda6359f4e68d4de3a27b3a0e80bd830d0fb3936f91dfea59517e403c090d'
              (d/'model.rns').write_bytes(b)
              ref=json.loads(z.read('reference.json'))
              row=np.fromstring(z.read('fields.txt').splitlines()[1],sep=' ')
          C=2.99792458e10; MB=1.66e-24; MEV=1.6021766208e-6
          G=6.67408e-8; MS=1.98848e33; L=G*MS/C**2
          a=np.loadtxt(io.BytesIO(b),skiprows=1)
          E,P,H,n=a[:,0]*C*C,a[:,1],a[:,2]/C**2,a[:,3]
          slope=np.diff(E)/np.diff(P)
          assert np.all(slope>=1-1e-10)
          assert np.max(abs((E+P)*np.exp(-H)/(MB*C*C*n)-1))<1e-12
          q=np.exp(np.linspace(np.log(n[0]*1e-6),np.log(n[-1]),1048577));q[-1]=n[-1]
          i=np.clip(np.searchsorted(n,q,side='right')-1,0,len(slope)-1)
          delta=(E[i]+P[i])/(1+slope[i])*np.expm1((1+slope[i])/slope[i]*np.log(q/n[i]))
          p=P[i]+delta;e=E[i]+slope[i]*delta;cs2=1/slope[i]
          low=q<n[0];y=np.cbrt(q[low]/n[0]);aa=P[0]/E[0];t=y/(1+aa-aa*y)
          p[low]=P[0]*t**4;e[low]=E[0]*t**3;cs2[low]=4*p[low]/(3*e[low])
          nb=q*1e-39;en=e*1e-39/MEV;pn=p*1e-39/MEV;mb=MB*C*C/MEV
          with h5py.File(d/'cold.h5','w') as f:
              for name,v in {'nb':nb,'mn':np.array([mb]),'Q1':pn/nb,'Q2':np.zeros_like(nb),'Q3':(en+pn)/(nb*mb)-1,'Q4':np.zeros_like(nb),'Q5':np.zeros_like(nb),'Q7':en/(nb*mb)-1,'cs2':cs2}.items():f.create_dataset(name,data=v)
          rhoc=(row[6]+row[7])*math.exp(-row[8])*1e15*L**3/MS
          ratio=ref['retarget_ratio']
          assert 0.001<rhoc<0.002 and 0.95<ratio<1
          (d/'star.par').write_text('\n'.join(['rns_verbose=2','rns_SDIV=401','rns_MDIV=201','rns_save_2ddata=0','rns_eos_type=tab','rns_eos_tab='+str(d/'model.rns'),'rns_rhoc='+str(rhoc),'rns_axes_ratio='+str(ratio),'rns_rotation_type=uniform','atm_level_rho=1e-12','outputdir='+str(d)]))
          (d/'target.json').write_text(json.dumps({'rhoc_geometric':rhoc,'axes_ratio':ratio,'target_mass_msun':ref['target_msun'],'target_spin_hz':ref['target_spin'],'scope':'independent RNSC reconstruction; not identical F178 fields; thermal/composition placeholders; compare target before acceptance'},indent=2))
          PY
          /usr/bin/python3 - <<'PY'
          import io, zipfile, pathlib, json, hashlib, struct, os
          import numpy as np
          from scipy.interpolate import RectBivariateSpline, RegularGridInterpolator
          from numpy.polynomial.legendre import leggauss
          d=pathlib.Path('evidence').resolve()
          C=2.99792458e10; G=6.67408e-8; MS=1.98848e33; L=G*MS/C**2
          F=np.sqrt(1e-15*C*C/6.673e-8)/L; RCONV=1e15*L**3/MS
          with zipfile.ZipFile(d/'F171.zip') as z:
              b=z.read('fields.txt')
              hdr=np.fromstring(b.splitlines()[0].decode()[2:],sep=' ')
              ns,nu=map(int,hdr[:2]); re,Omega=hdr[2:4]
              a=np.loadtxt(io.BytesIO(b)).reshape(ns,nu,10)
          sg,ug=a[:,0,0],a[0,:,1]
          sp=[RectBivariateSpline(sg,ug,a[:,:,i]) for i in range(2,6)]
          pp=RegularGridInterpolator((sg,ug),a[:,:,7],bounds_error=True)
          tab=np.loadtxt(d/'model.rns',skiprows=1)
          et=tab[:,0]/1e15; pt=tab[:,1]/(1e15*C*C); ht=tab[:,2]/C**2
          slope=np.diff(et)/np.diff(pt)
          N=int(os.environ['J0740_N']); dx=24./N; x0=-24.-8*dx; n=2*N+17; xs=x0+dx*np.arange(n)
          X,Y=np.meshgrid(xs,xs,indexing='xy')
          out=d/'f171_grid.bin'
          maximum=0.; minmetric=1e99
          qnodes,qweights=leggauss(4)
          closure_max=0.; energy_absdiff=0.; mass_sum=0.; J_sum=0.; energy_quad=0.
          def cold(p):
              j=np.clip(np.searchsorted(pt,p,side='right')-1,0,len(slope)-1)
              dp=p-pt[j]; e=et[j]+slope[j]*dp
              h=ht[j]+np.log1p((1+slope[j])*dp/(et[j]+pt[j]))/(1+slope[j])
              m=p<pt[0];f=(p[m]/pt[0])**.25
              e[m]=et[0]*f**3;h[m]=4*np.log1p(pt[0]/et[0]*f)
              return e,h
          # Enforce the native stationary rigid-rotation first integral at
          # interpolation points rather than linearly interpolating pressure
          # across the free surface. Constant from the original central data.
          B=float(cold(np.array([a[0,0,7]]))[1][0]+(a[0,0,3]+a[0,0,4])/2)
          def equilibrium_pressure(r,rc,gg,ro,ww):
              p=np.zeros_like(r);m=r<=1.05*re*F
              v2=np.exp(-2*ro[m])*((Omega-ww[m])/F*rc[m])**2
              assert np.all((v2>=0)&(v2<1))
              h=np.maximum(B-(gg[m]+ro[m])/2-.5*np.log1p(-v2),0)
              j=np.clip(np.searchsorted(ht,h,side='right')-1,0,len(slope)-1)
              pn=pt[j]+(et[j]+pt[j])*np.expm1((1+slope[j])*(h-ht[j]))/(1+slope[j])
              low=h<ht[0];pn[low]=pt[0]*(np.expm1(h[low]/4)/(pt[0]/et[0]))**4
              p[m]=np.maximum(pn,0)
              return p
          def quad_sample(pos):
              xx,yy,zz=pos.T;rr=np.linalg.norm(pos,axis=-1);rc=np.hypot(xx,yy)
              ss=rr/(rr+re*F);uu=np.abs(zz)/np.where(rr>0,rr,1)
              al,gg,ro,ww=[v.ev(ss,uu) for v in sp]
              ac=np.exp(2*al);bc=np.exp(gg-ro);N=np.exp((gg+ro)/2);sqrtg=ac*np.sqrt(bc)
              p=equilibrium_pressure(rr,rc,gg,ro,ww);e,h=cold(p)
              speed=(Omega-ww)/F/N
              W=1/np.sqrt(1-np.where(p>0,bc*(speed*rc)**2,0))
              phi=np.stack([-yy,xx,np.zeros_like(xx)],-1)
              E=((e+p)*W**2-p)*RCONV
              S=(e+p)[:,None]*W[:,None]**2*(bc*speed)[:,None]*phi*RCONV
              D=(e+p)*np.exp(-h)*W*RCONV
              return np.c_[sqrtg*E,sqrtg[:,None]*S,sqrtg*D]
          def conservative_cold(Dg,Sg,gi):
              p=np.zeros_like(Dg);e=p.copy();h=p.copy();W=np.ones_like(Dg)
              m=Dg>0;D0=Dg[m]/RCONV
              ratio=np.sqrt(np.maximum(np.einsum('...ij,...i,...j->...',gi[m],Sg[m],Sg[m]),0))/RCONV/D0
              lo=np.full_like(D0,np.log(pt[0])-80.);hi=np.full_like(D0,np.log(pt[-1]))
              for _ in range(58):
                  mid=(lo+hi)/2;p0=np.exp(mid);e0,h0=cold(p0)
                  W0=np.sqrt(1+(ratio*np.exp(-h0))**2)
                  too=(e0+p0)*np.exp(-h0)*W0>D0
                  hi=np.where(too,mid,hi);lo=np.where(too,lo,mid)
              p[m]=np.exp((lo+hi)/2);e[m],h[m]=cold(p[m])
              W[m]=np.sqrt(1+(ratio*np.exp(-h[m]))**2)
              rho=(e+p)*np.exp(-h)*RCONV;E=((e+p)*W**2-p)*RCONV
              err=float(np.max(abs(rho[m]*W[m]/Dg[m]-1),initial=0))
              assert err<1e-10
              vel=np.divide(np.einsum('...ij,...j->...i',gi,Sg),(E+p*RCONV)[:,None],out=np.zeros_like(Sg),where=(E+p*RCONV)[:,None]>0)
              return rho,p*RCONV,e*RCONV,W,vel,E,err
          with out.open('wb') as fp:
              fp.write(struct.pack('<idd',n,x0,dx))
              for zz in xs:
                  Z=np.full_like(X,zz); r=np.sqrt(X*X+Y*Y+Z*Z); rc=np.hypot(X,Y)
                  safe=np.where(r>0,r,1.); ss=r/(r+re*F); uu=np.abs(Z)/safe
                  al,gg,rr,ww=[v.ev(ss,uu) for v in sp]
                  p=equilibrium_pressure(r,rc,gg,rr,ww)
                  j=np.clip(np.searchsorted(pt,p,side='right')-1,0,len(slope)-1)
                  dp=p-pt[j]; e=et[j]+slope[j]*dp
                  low=p<pt[0]; h=np.empty_like(p)
                  h[~low]=ht[j[~low]]+np.log1p((1+slope[j[~low]])*dp[~low]/(et[j[~low]]+pt[j[~low]]))/(1+slope[j[~low]])
                  t=(p[low]/pt[0])**.25; e[low]=et[0]*t**3; h[low]=4*np.log1p(pt[0]/et[0]*t)
                  ac=np.exp(2*al); bc=np.exp(gg-rr); lapse=np.exp((gg+rr)/2)
                  phi=np.stack([-Y,X,np.zeros_like(X)],-1); ep=phi/np.where(rc>0,rc,1.)[...,None]
                  g=ac[...,None,None]*np.eye(3)+(bc-ac)[...,None,None]*ep[..., :,None]*ep[...,None,:]
                  radial=np.stack([X,Y,Z],-1)/safe[...,None]
                  du=-uu[...,None]*radial/safe[...,None]; du[...,2]+=np.sign(Z)/safe
                  dw=sp[3].ev(ss,uu,dx=1)[...,None]/F*(re*F/(r+re*F)**2)[...,None]*radial+sp[3].ev(ss,uu,dy=1)[...,None]/F*du
                  pc=bc[...,None]*phi; K=-(pc[..., :,None]*dw[...,None,:]+dw[..., :,None]*pc[...,None,:])/(2*lapse[...,None,None])
                  beta=-ww[...,None]/F*phi
                  rho=(e+p)*np.exp(-h)*RCONV; mat=rho>1e-12
                  v=(Omega-ww)[...,None]/F/lapse[...,None]*phi
                  v2=np.einsum('...i,...ij,...j->...',v,g,v)
                  maximum=max(maximum,float(np.max(v2[mat],initial=0)))
                  minmetric=min(minmetric,float(np.min(np.linalg.eigvalsh(g))))
                  assert np.all(v2[mat]<1)
                  v[~mat]=0; W=1/np.sqrt(1-np.where(mat,v2,0))
                  rho[~mat]=1e-12; p[~mat]=0
                  # Replace pointwise matter by exact volume-averaged D and S_i,
                  # then reconstruct the cold primitive at the local metric.
                  # Geometry and K are left unchanged. 4^3 Gauss quadrature was
                  # independently compared against 8^3 on the same actual fields.
                  select=r<re*F+np.sqrt(3)*2*dx
                  pos=np.stack([X,Y,Z],-1)[select]
                  acc=np.zeros((len(pos),5))
                  for iq,xq in enumerate(qnodes):
                      for jq,yq in enumerate(qnodes):
                          for kq,zq in enumerate(qnodes):
                              acc+=qweights[iq]*qweights[jq]*qweights[kq]/8*quad_sample(pos+dx*np.array([xq,yq,zq]))
                  sqrtg=(ac*np.sqrt(bc))[select];avg=acc/sqrtg[:,None]
                  gi=np.linalg.inv(g[select])
                  rh,pr,er,Wr,vr,EE,cl=conservative_cold(avg[:,4],avg[:,1:4],gi)
                  closure_max=max(closure_max,cl)
                  rho[select]=rh;p[select]=pr/RCONV;e[select]=er/RCONV
                  v[select]=vr;W[select]=Wr
                  # Cell-center points only, no duplicate half-grid quadrature.
                  if round((zz+24)/dx)%2==1 and abs(zz)<24:
                      mask=select & (abs(X)<24)&(abs(Y)<24)&(np.rint((X+24)/dx).astype(int)%2==1)&(np.rint((Y+24)/dx).astype(int)%2==1)
                      take=mask[select]
                      mass_sum+=float(acc[take,4].sum()*(2*dx)**3)
                      J_sum+=float(np.sum(pos[take,0]*acc[take,2]-pos[take,1]*acc[take,1])*(2*dx)**3)
                      energy_absdiff+=float(np.sum(abs(EE[take]*sqrtg[take]-acc[take,0]))*(2*dx)**3)
                      energy_quad+=float(acc[take,0].sum()*(2*dx)**3)
                  mat=rho>1e-12
                  rho[~mat]=1e-12;p[~mat]=0;e[~mat]=0;v[~mat]=0;W[~mat]=1
                  eps=np.where(mat,e*RCONV/rho-1,0)
                  idx=((0,0),(0,1),(0,2),(1,1),(1,2),(2,2))
                  vals=np.stack([lapse,*np.moveaxis(beta,-1,0),*[g[...,i,j] for i,j in idx],*[K[...,i,j] for i,j in idx],rho,eps,*np.moveaxis(v,-1,0),*np.moveaxis(v*W[...,None],-1,0),p*RCONV],-1)
                  assert vals.shape[-1]==25 and np.isfinite(vals).all()
                  vals.astype('<f8').tofile(fp)
          assert minmetric>0 and closure_max<1e-10
          assert abs(mass_sum/2.4142703584211214-1)<.002 and abs(J_sum/.6892530936503651-1)<.002
          (d/'conservative_import.json').write_text(json.dumps(dict(Mb=mass_sum,Jz=J_sum,primitive_closure=closure_max,energy_L1_relative=energy_absdiff/energy_quad,quadrature_order=4,scope='cell-averaged D,S from equilibrium first integral; E reconstructed not independently conserved',bernoulli_constant=B),indent=2))
          (d/'import.json').write_text(json.dumps({'source_fields_sha256':hashlib.sha256(b).hexdigest(),'grid_sha256':hashlib.file_digest(out.open('rb'),'sha256').hexdigest(),'points':n**3,'max_matter_v2':maximum,'min_metric_eigenvalue':minmetric,'scope':'F171 native stationary fields, explicit floor, cubic metric and linear pressure interpolation; no RNSC re-solve'},indent=2))
          PY
          cat evidence/target.json
          sha256sum evidence/model.rns evidence/cold.h5 evidence/star.par > evidence/inputs.sha256
      - name: Build pinned native solvers
        shell: bash
        run: |
          set -euo pipefail
          git -C rnsc rev-parse HEAD | tee evidence/rnsc_commit.txt
          git -C athena rev-parse HEAD | tee evidence/athena_commit.txt
          make -C rnsc -j2 2>&1 | tee evidence/rnsc_build.log
          cd athena
          # Pinned upstream is missing its declared cold hybrid policy. Add only the adapter.
          cat > src/z4c/primitive/cold_hybrid_table.hpp <<'CPP'
          #ifndef J0740_COLD_HYBRID_TABLE_HPP
          #define J0740_COLD_HYBRID_TABLE_HPP
          #include <algorithm>
          #include <cmath>
          #include <stdexcept>
          #include "hybrid_table.hpp"
          #include "unit_system.hpp"
          namespace Primitive {
          // Compatibility adapter: delegate all cold thermodynamics to the native
          // HybridTable at T=0. No changes to the native evolution equations.
          class ColdHybridTable : public HybridTable {
           protected:
            Real T = 0;
            ColdHybridTable() = default;
            ~ColdHybridTable() = default;
            Real Pressure(Real n) { return HybridTable::Pressure(n,0,nullptr); }
            Real Energy(Real n) { return HybridTable::Energy(n,0,nullptr); }
            Real Enthalpy(Real n) { return HybridTable::Enthalpy(n,0,nullptr); }
            Real SpecificInternalEnergy(Real n) {
              return HybridTable::SpecificInternalEnergy(n,0,nullptr);
            }
            Real Y(Real, int) { throw std::logic_error("No composition in cold MPA1 table"); }
            int Count() {
              const auto x=GetRawLogNumberDensity();
              return 1+int(std::llround((std::log(max_n)-x[0])/(x[1]-x[0])));
            }
            Real dPdn(Real n) {
              if (!(n>0)) throw std::domain_error("Nonpositive density");
              const auto x=GetRawLogNumberDensity();
              const auto p=GetRawTable();
              const int count=Count();
              const Real dx=x[1]-x[0];
              const int i=std::max(0,std::min(count-2,int((std::log(n)-x[0])/dx)));
              return Pressure(n)*(p[i+1]-p[i])/(dx*n);
            }
            Real Inverse(Real v,int column) {
              if (!(v>0)) throw std::domain_error("Nonpositive inverse query");
              const auto x=GetRawLogNumberDensity();
              const int count=Count();
              const auto y=GetRawTable()+column*count;
              const Real lv=std::log(v);
              const int i=std::max(0,std::min(count-2,int(std::upper_bound(y,y+count,lv)-y)-1));
              if (!(y[i+1]>y[i])) throw std::domain_error("Nonmonotonic cold table");
              return std::exp(x[i]+(x[i+1]-x[i])*(lv-y[i])/(y[i+1]-y[i]));
            }
            Real DensityFromPressure(Real p) { return Inverse(p,ECLOGP); }
            Real DensityFromEnergy(Real e) { return Inverse(e,ECLOGE); }
           public:
            void ReadColdSliceFromFile(std::string file,std::string*) {
              if (NSCALARS!=0) throw std::logic_error("Cold adapter requires NSCALARS=0");
              ReadTableFromFile(file);
              SetThermalGamma(1.75);
              n_species=0;
              if (Count()<2) throw std::runtime_error("Invalid table");
              for (int i=0;i<64;++i) {
                const Real n=std::exp(std::log(min_n)+(std::log(max_n)-std::log(min_n))*i/63.);
                if (std::abs(DensityFromPressure(Pressure(n))/n-1)>1e-9 ||
                    std::abs(DensityFromEnergy(Energy(n))/n-1)>1e-9)
                  throw std::runtime_error("Cold table inverse mismatch");
              }
            }
          };
          }
          #endif
          CPP
          printf '#include "cold_hybrid_table.hpp"\n' > src/z4c/primitive/cold_hybrid_table.cpp
          cp src/z4c/primitive/cold_hybrid_table.hpp ../evidence/cold_adapter.hpp
          sha256sum src/z4c/primitive/cold_hybrid_table.{hpp,cpp} > ../evidence/cold_adapter.sha256
          # Native EOS exposes read-only table bounds. Reject nondefault scaling.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/eos/eostaudyn_ps_gr.cpp')
          s=p.read_text()
          for old,new in [
              ('eos.SetMaximumDensity(eos.GetMaximumDensity() * n_max_factor);','if (n_max_factor != 1.0) throw std::runtime_error("Unsupported density bound scaling");'),
              ('eos.SetMaximumTemperature(eos.GetMaximumTemperature() * T_max_factor);','if (T_max_factor != 1.0) throw std::runtime_error("Unsupported temperature bound scaling");')]:
              assert s.count(old)==1
              s=s.replace(old,new)
          p.write_text('#include <stdexcept>\n'+s)
          PY
          git diff -- src/eos/eostaudyn_ps_gr.cpp > ../evidence/eos_bounds.patch
          # Import the already validated F171 star, bypass failed native RNSC re-solve.
          cat > src/pgen/j0740_f171_grid.hpp <<'CPP'
          #include <fstream>
          #include <iostream>
          #include <vector>
          #include <cmath>
          #include <stdexcept>
          #include <cstdlib>
          namespace {
          struct F171Grid {
           int n=0; double x0=0,dx=0; std::vector<double> a;
           F171Grid() {
            const char* file=std::getenv("J0740_GRID");
            if(!file) throw std::runtime_error("J0740_GRID missing");
            std::ifstream f(file,std::ios::binary);
            f.read(reinterpret_cast<char*>(&n),4);
            f.read(reinterpret_cast<char*>(&x0),8);
            f.read(reinterpret_cast<char*>(&dx),8);
            const char* ns=std::getenv("J0740_N");
            if(!ns) throw std::runtime_error("J0740_N missing");
            const int N=std::stoi(ns);
            if(n!=2*N+17 || std::abs(x0+24+8*dx)>1e-12 || std::abs(dx*N-24)>1e-12) throw std::runtime_error("Grid header mismatch");
            a.resize(size_t(n)*n*n*25);
            f.read(reinterpret_cast<char*>(a.data()),a.size()*sizeof(double));
            if(!f || f.peek()!=EOF) throw std::runtime_error("Grid byte count mismatch");
           }
           int index(double x) const {
            const int i=std::lround((x-x0)/dx);
            if(i<0||i>=n||std::abs(x-(x0+i*dx))>1e-8)
             { std::cerr << "F171 coordinate mismatch x=" << x << " nearest=" << x0+i*dx << std::endl; throw std::runtime_error("Grid coordinate mismatch"); }
            return i;
           }
          };
          void F171Interpolation(ini_data*, int*,int*,int* n,double*x,double*y,double*z,
           double*a0,double*a1,double*a2,double*a3,
           double*a4,double*a5,double*a6,double*a7,double*a8,double*a9,
           double*a10,double*a11,double*a12,double*a13,double*a14,double*a15,
           double*a16,double*a17,double*a18,double*a19,double*a20,
