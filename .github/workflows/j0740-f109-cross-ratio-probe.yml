name: J0740 F109 cross-ratio native-C branch diagnostic
on:
  pull_request:
    branches:
      - science/j0740-apr4-firstlaw-gr-pilot-20261117
    paths:
      - 'research/j0740/f109/**'
      - '.github/workflows/j0740-f109-cross-ratio-probe.yml'
permissions:
  contents: read
  actions: read
jobs:
  cross_ratio_native_c_diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rns-alberta/rns
          ref: 97e85d325a33e37f702306414533f6cd77812477
          path: rns-upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical dependencies
        run: python -m pip install 'numpy==2.3.5' 'scipy==1.16.3'
      - name: Retrieve and checksum the accepted F108 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p results/F108 results/F109
          curl -fLsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14756746923/zip" -o results/F108/F108_artifact.zip
          printf '%s  %s\n' 281f2521f68f40f94da250a385bafb4d84ace2b6ebed8b466c0937d8f72d3eb5 results/F108/F108_artifact.zip | sha256sum -c -
          python -m zipfile -e results/F108/F108_artifact.zip results/F108
      - name: Validate F108 baseline and the bounded two-case plan
        env:
          F108_ARTIFACT_ZIP: results/F108/F108_artifact.zip
        run: |
          set -euo pipefail
          python -m unittest discover -s research/j0740/f109 -p 'test_f109_*.py' -v
          python - <<'PY'
          import os
          from pathlib import Path
          from research.j0740.f109.f109_cross_ratio_branch_probe import read_f108, CROSS_DENSITY_TICKS
          result, rows, stars = read_f108(Path(os.environ['F108_ARTIFACT_ZIP']))
          assert len(rows) == 280 and len(stars) == 28 and len(CROSS_DENSITY_TICKS) == 2
          assert stars[2622]['eos_interval_left_node_index_zero_based'] == 1968
          assert stars[2623]['eos_interval_right_node_index_zero_based'] == 1969
          print('F108_BASELINE_AND_TWO_CROSS_RATIO_CASES_PASS')
          PY
      - name: Restore exact pinned F99 EOS and compile pinned RNS C
        run: |
          set -euo pipefail
          cp research/j0740/f104/F99_DERIVED_1981_node_causal_cold_affine_EOS.rns m99.rns
          printf '%s  %s\n' c99eadee07bf6cbbf78f59b6171ef7e21ffad7d034f4ca4e9b7d85d36d9b4331 m99.rns | sha256sum -c -
          test "$(git -C rns-upstream rev-parse HEAD)" = '97e85d325a33e37f702306414533f6cd77812477'
          cp -a rns-upstream rns501
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'research/j0740/f81')
          from f81_exact_mass_spin import patch_print_only
          p = Path('rns501/rns.c')
          p.write_text(patch_print_only(p.read_text()))
          mf = Path('rns501/makefile')
          t = mf.read_text()
          old = 'HIGHSIZE=-DMDIV=151 -DSDIV=301'
          assert t.splitlines().count(old) == 1
          mf.write_text(t.replace(old, 'HIGHSIZE=-DMDIV=501 -DSDIV=1001', 1))
          src = Path('rns501/findmodel.c').read_bytes()
          assert b'float ans, fh,fl,fm,fnew,sroot,xh,xl,xm,xnew,xacc=1e-5;' in src
          PY
          make -C rns501 CC='gcc -include stdlib.h' rns
          sha256sum rns501/rns | tee results/F109/F109_NATIVE_C_BINARY_SHA256.txt
      - name: Run exactly two cross-density native-C evaluations
        env:
          F108_ARTIFACT_ZIP: results/F108/F108_artifact.zip
        run: |
          set -euo pipefail
          OPENBLAS_NUM_THREADS=1 python -u research/j0740/f109/f109_cross_ratio_branch_probe.py \
            --f108 results/F108/F108_artifact.zip \
            --eos m99.rns --rns "$GITHUB_WORKSPACE/rns501/rns" \
            --out results/F109/F109_CROSS_RATIO_BRANCH_DIAGNOSTIC.json \
            2>&1 | tee results/F109/F109_NATIVE_C_CROSS_PROBES.log
      - name: Preserve F108 baseline and raw cross-probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: J0740-F109-cross-ratio-native-C-branch-diagnostic
          path: |
            results/F108/F108_artifact.zip
            results/F109/
          if-no-files-found: warn
