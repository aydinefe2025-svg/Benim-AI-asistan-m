name: J0740 F108 fine-density fixed-J native C diagnostic
on:
  pull_request:
    branches:
      - science/j0740-apr4-firstlaw-gr-pilot-20261117
    paths:
      - 'research/j0740/f108/**'
      - '.github/workflows/j0740-f108-fine-density-fixed-j-diagnostic.yml'
permissions:
  contents: read
  actions: read
jobs:
  fine_density_native_c_diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rns-alberta/rns
          ref: 97e85d325a33e37f702306414533f6cd77812477
          path: rns-upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical dependencies
        run: python -m pip install 'numpy==2.3.5' 'scipy==1.16.3'
      - name: Retrieve and checksum the accepted F107 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p results/F107 results/F108
          curl -fLsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14755033392/zip" -o results/F107/F107_artifact.zip
          printf '%s  %s\n' 9e71a4332f6de293cab3c7af8f41f1b6b79ae55ae28df16bd4a877ebfec75b7f results/F107/F107_artifact.zip | sha256sum -c -
          python -m zipfile -e results/F107/F107_artifact.zip results/F107
      - name: Validate scan plan, baseline journal, and no-repeat guard
        env:
          F107_ARTIFACT_ZIP: results/F107/F107_artifact.zip
        run: |
          set -euo pipefail
          python -m unittest discover -s research/j0740/f108 -p 'test_f108_*.py' -v
          python - <<'PY'
          import os
          from pathlib import Path
          from research.j0740.f108.f108_fixed_j_fine_density_probe import read_f107, RHO, REUSE_TICKS
          result, rows, _ = read_f107(Path(os.environ['F107_ARTIFACT_ZIP']))
          assert result['F106_reference_validated'] is True
          assert len(rows) == 138 and len(RHO) == 28 and len(REUSE_TICKS) == 3
          print('F107_BASELINE_SHA_JOURNAL_AND_28_POINT_NO_REPEAT_PLAN_PASS')
          PY
      - name: Restore the exact pinned derived F99 EOS
        run: |
          set -euo pipefail
          cp research/j0740/f104/F99_DERIVED_1981_node_causal_cold_affine_EOS.rns m99.rns
          printf '%s  %s\n' c99eadee07bf6cbbf78f59b6171ef7e21ffad7d034f4ca4e9b7d85d36d9b4331 m99.rns | sha256sum -c -
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p = Path('m99.rns')
          Path('results/F108/F108_REUSE_F99_EOS.json').write_text(json.dumps({'status':'EXACT_PINNED_F99_DERIVED_EOS_RESTORED','sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'source_publisher_m_rns_sha256':'7643d0e4361adee77cc79d1b69eb445db70a52443b833c4dddafa973193fb580'},indent=2)+'\n')
          PY
      - name: Compile the pinned upstream Einstein RNS C binary on 501x1001
        run: |
          set -euo pipefail
          test "$(git -C rns-upstream rev-parse HEAD)" = '97e85d325a33e37f702306414533f6cd77812477'
          cp -a rns-upstream rns501
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'research/j0740/f81')
          from f81_exact_mass_spin import patch_print_only
          p = Path('rns501/rns.c')
          p.write_text(patch_print_only(p.read_text()))
          mf = Path('rns501/makefile')
          t = mf.read_text()
          old = 'HIGHSIZE=-DMDIV=151 -DSDIV=301'
          assert t.splitlines().count(old) == 1
          mf.write_text(t.replace(old, 'HIGHSIZE=-DMDIV=501 -DSDIV=1001', 1))
          src = Path('rns501/findmodel.c').read_bytes()
          assert b'float ans, fh,fl,fm,fnew,sroot,xh,xl,xm,xnew,xacc=1e-5;' in src
          PY
          make -C rns501 CC='gcc -include stdlib.h' rns
          sha256sum rns501/rns | tee results/F108/F108_NATIVE_C_BINARY_SHA256.txt
      - name: Run only 28 new fixed-J densities around the F107 local dip
        run: |
          set -euo pipefail
          OPENBLAS_NUM_THREADS=1 python -u research/j0740/f108/f108_fixed_j_fine_density_probe.py \
            --f107 results/F107/F107_artifact.zip \
            --eos m99.rns --rns "$GITHUB_WORKSPACE/rns501/rns" \
            --out results/F108/F108_FINE_DENSITY_501x1001.json \
            2>&1 | tee results/F108/F108_NATIVE_C_ROOTS.log
      - name: Preserve new output and all baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: J0740-F108-fine-density-501x1001-native-fixedJ-diagnostic
          path: |
            results/F107/F107_artifact.zip
            results/F108/
          if-no-files-found: warn
