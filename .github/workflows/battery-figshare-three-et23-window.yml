name: Battery original three-cell ET23 time-voltage window research screen
on:
  pull_request:
    paths:
      - 'research/battery_curve_audit/figshare_three_curve_probe.py'
      - 'tests/test_figshare_three_curve_probe.py'
      - '.github/workflows/battery-figshare-three-et23-window.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  three-original-et23-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout source exact PR
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require source security synthetic tests pass
        run: |
          python -m unittest tests.test_figshare_waveform_inventory tests.test_figshare_three_archive_probe tests.test_figshare_three_curve_probe -v
      - name: Parse original source pinned windows (never upload raw CSVs)
        run: |
          python -m research.battery_curve_audit.figshare_three_curve_probe \
            /tmp/cano_figshare_three_real_et23_pair_screen.json
      - name: Reject false field acceptance and require three original pairs reported
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/cano_figshare_three_real_et23_pair_screen.json').read_text())
          assert d['article_id']==25975315
          assert d['total_pairs']==3 and len(d['source_archives'])==3
          assert all(x['bounded_rows_examined']>=1000 for x in d['source_archives'])
          assert all(x['sample_count_each']>=1000 for x in d['pairwise_results'])
          assert d['physical_cell_independence_authenticated'] is False
          assert d['empirical_field_FPR_FNR_established'] is False
          assert d['time_unit_authoritatively_verified'] is False
          assert d['field_acceptance']=='NOT_ESTABLISHED'
          assert d['production_release_allowed'] is False
          print('SOURCE_REAL_WINDOW_PAIRS_ONLY',d['total_pairs'],
                sum(x['sampled_time_axis_exactly_equal'] for x in d['pairwise_results']))
          PY
      - name: Preserve only aggregate hashes and comparison counts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cano-battery-three-original-et23-window-comparisons
          path: /tmp/cano_figshare_three_real_et23_pair_screen.json
          retention-days: 7
          if-no-files-found: error
