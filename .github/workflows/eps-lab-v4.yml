name: EPS Lab V4 real photovoltaic curves
on:
  pull_request:
    paths:
      - research/eps_lab_v4/**
      - .github/workflows/eps-lab-v4.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: research/eps_lab_v4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python -m pip install numpy==1.26.4 scipy==1.13.1
      - run: python fetch_benchmark.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: python -m unittest -v test_pv_measured
      - run: python run_benchmark.py
      - run: python -c "import json; d=json.load(open('RESULT.json')); assert d['devices']['RTC']['test_n']==12 and d['devices']['PWP']['test_n']==12; assert abs(d['devices']['RTC']['model']['rmse_A']-0.0008134267)<1e-7; assert abs(d['devices']['PWP']['model']['rmse_A']-0.0020310841)<1e-7"
      - run: python make_viewer.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eps-v4-benchmark-receipt
          path: |
            research/eps_lab_v4/RESULT.json
            research/eps_lab_v4/CANO_EPS_Lab_V4.html
          if-no-files-found: error
  sandia:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: research/eps_lab_v4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python sandia_ingest.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sandia-source-receipt
          path: research/eps_lab_v4/SANDIA_SOURCE_RECEIPT.json
          if-no-files-found: error
