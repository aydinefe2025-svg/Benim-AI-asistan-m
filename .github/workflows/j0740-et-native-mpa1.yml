name: J0740 archived stationary curvature RHS budget
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/j0740-et-native-mpa1.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Read first-step archive without another evolution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          gh api repos/aydinefe2025-svg/Benim-AI-asistan-m/actions/artifacts/15177726961/zip > source.zip
          sha256sum source.zip > evidence/source.sha256
          unzip -tq source.zip
          unzip -q source.zip '*.xyz.h5' -d source
          python3 -m pip install numpy h5py
      - name: Decompose ADM curvature RHS and its momentum contribution
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,json,re,numpy as np,h5py
          def d(a,j,h):
              ax=2-j
              return (-np.roll(a,-2,ax)+8*np.roll(a,-1,ax)-8*np.roll(a,1,ax)+np.roll(a,2,ax))/(12*h[j])
          def geo(g,h):
              gi=np.linalg.inv(g); dg=[d(g,j,h) for j in range(3)]
              ch=np.zeros(g.shape[:-2]+(3,3,3))
              for a in range(3):
                  for b in range(3):
                      for c in range(3):
                          for l in range(3):
                              ch[...,a,b,c]+=.5*gi[...,a,l]*(dg[b][...,l,c]+dg[c][...,l,b]-dg[l][...,b,c])
              return gi,dg,ch
          def lie(g,b,h,dg):
              db=[d(b,j,h) for j in range(3)]
              out=sum(b[...,j,None,None]*dg[j] for j in range(3))
              for i in range(3):
                  for j in range(3):
                      for l in range(3):
                          out[...,i,j]+=g[...,l,j]*db[i][...,l]+g[...,i,l]*db[j][...,l]
              return out
          def curvature_tensor(ch,h):
              ric=np.zeros(ch.shape[:-3]+(3,3))
              for i in range(3):
                  for j in range(3):
                      for k in range(3):
                          ric[...,i,j]+=d(ch[...,k,i,j],k,h)-d(ch[...,k,i,k],j,h)
                          for l in range(3):
                              ric[...,i,j]+=ch[...,k,k,l]*ch[...,l,i,j]-ch[...,k,j,l]*ch[...,l,i,k]
              return ric
          def rhs_parts(g,K,alpha,b,rho,eps,p,v,h):
              gi,dg,ch=geo(g,h);ric=curvature_tensor(ch,h)
              da=[d(alpha,j,h) for j in range(3)]
              hess=np.zeros_like(g)
              for i in range(3):
                  for j in range(3):
                      hess[...,i,j]=d(da[j],i,h)-sum(ch[...,l,i,j]*da[l] for l in range(3))
              mixed=np.einsum('...ij,...jk->...ik',gi,K)
              tr=np.trace(mixed,axis1=-2,axis2=-1)
              kk=np.einsum('...ij,...jk->...ik',K,mixed)
              vc=np.einsum('...ij,...j->...i',g,v);v2=np.einsum('...i,...i->...',v,vc)
              assert np.all(alpha>0) and np.all(v2<1) and np.all(v2>=-1e-13)
              q=(rho*(1+eps)+p)/(1-v2)
              E=q-p; Sij=q[...,None,None]*vc[..., :,None]*vc[...,None,:]+p[...,None,None]*g
              S=np.einsum('...ij,...ij->...',gi,Sij)
              A=alpha[...,None,None]
              pieces={'lapse_hessian':-hess,'spatial_ricci':A*ric,'quadratic_K':A*(tr[...,None,None]*K-2*kk),'matter':-8*np.pi*A*(Sij-.5*(S-E)[...,None,None]*g),'shift_lie':lie(K,b,h,[d(K,j,h) for j in range(3)])}
              pieces['total']=sum(pieces.values())
              return pieces,gi,ch
          def momentum_geo(g,K,h):
              gi,_,ch=geo(g,h)
              mix=np.einsum('...ij,...jk->...ik',gi,K)
              tr=np.trace(mix,axis1=-2,axis2=-1)
              m=np.zeros(g.shape[:-2]+(3,))
              for i in range(3):
                  m[...,i]=sum(d(mix[...,j,i],j,h) for j in range(3))-d(tr,i,h)
                  for j in range(3):
                      for l in range(3):
                          m[...,i]+=ch[...,j,j,l]*mix[...,l,i]-ch[...,l,j,i]*mix[...,j,l]
              return m
          # Analytic controls: Minkowski; accelerated lapse; homogeneous matter.
          sh=(13,13,13);z,y,x=np.indices(sh,dtype=float);g=np.broadcast_to(np.eye(3),sh+(3,3)).copy()
          K=np.zeros_like(g);a=np.ones(sh);b=np.zeros(sh+(3,));v=b.copy();zero=np.zeros(sh);inn=np.s_[4:-4,4:-4,4:-4]
          p,_,_=rhs_parts(g,K,a,b,zero,zero,zero,v,[1]*3)
          assert np.max(abs(p['total'][inn]))<1e-12
          a=1+.01*z*z
          p,_,_=rhs_parts(g,K,a,b,zero,zero,zero,v,[1]*3)
          assert np.max(abs(p['total'][inn][...,2,2]+.02))<1e-12
          a=np.ones(sh);rho=np.full(sh,.001)
          p,_,_=rhs_parts(g,K,a,b,rho,zero,zero,v,[1]*3)
          assert np.max(abs(p['total'][inn]+4*np.pi*.001*np.eye(3)))<1e-12
          expected={'gxx','gxy','gxz','gyy','gyz','gzz','kxx','kxy','kxz','kyy','kyz','kzz','rho','eps','press','vel[0]','vel[1]','vel[2]','alp','betax','betay','betaz'}
          fields={}
          for path in pathlib.Path('source').rglob('*.xyz.h5'):
              n=path.name.removesuffix('.xyz.h5')
              if n not in expected:continue
              with h5py.File(path,'r') as f:
                  def visit(key,obj):
                      if not isinstance(obj,h5py.Dataset) or obj.ndim!=3:return
                      m=re.search(r'\bit=(0|128)\s+(.*)',key)
                      if not m or not re.search(r'\brl=2\b',m[2]):return
                      k=(n,int(m[1]),m[2]);assert k not in fields,k
                      fields[k]=(obj[...],np.array(obj.attrs['origin'],float),np.array(obj.attrs['delta'],float))
                  f.visititems(visit)
          report={'artifact':15177726961,'analytic_controls':'3/3 passed','scope':'offline fourth-order ADM curvature RHS; compare actual first-step K, not an exact native BSSN RHS or physical correction','patches':[]}
          for patch in sorted({p for _,_,p in fields}):
              if not all((n,t,patch) in fields for n in expected for t in (0,128)):continue
              r0,o,h=fields['rho',0,patch];shape=r0.shape
              for n in expected:
                  for t in (0,128):
                      q,oo,hh=fields[n,t,patch];assert q.shape==shape and np.array_equal(o,oo) and np.array_equal(h,hh) and np.isfinite(q).all()
              def get(n,t):return fields[n,t,patch][0]
              def tensor(prefix,t):
                  q=np.zeros(shape+(3,3))
                  for i,j in ((0,0),(0,1),(0,2),(1,1),(1,2),(2,2)):
                      q[...,i,j]=q[...,j,i]=get(prefix+'xyz'[i]+'xyz'[j],t)
                  return q
              g=tensor('g',0);K=tensor('k',0);a=get('alp',0);b=np.stack([get('beta'+i,0) for i in 'xyz'],axis=-1)
              v=np.stack([get(f'vel[{i}]',0) for i in range(3)],axis=-1)
              pieces,_,_=rhs_parts(g,K,a,b,r0,get('eps',0),get('press',0),v,h)
              g1=tensor('g',128);K1=tensor('k',128);dt=.09375
              actual=(K1-K)/dt
              zz,yy,xx=np.indices(shape);x=o[0]+h[0]*xx;y=o[1]+h[1]*yy;z=o[2]+h[2]*zz
              rad=np.sqrt(x*x+y*y+z*z);valid=np.zeros(shape,bool);valid[7:-7,7:-7,7:-7]=True;valid&=(z>=0)&(rad<=10)
              dense=r0>1e-8
              row={'patch':patch,'regions':{}}
              m0=momentum_geo(g,K,h)
              # Linear K contribution at fixed g, compared to actual total geometry change.
              m_parts={n:momentum_geo(g,q,h)*dt for n,q in pieces.items()}
              m_actual=momentum_geo(g1,K1,h)-m0
              m_K_actual=momentum_geo(g,K1-K,h)
              m_metric_actual=m_actual-m_K_actual
              for label,mask in {'inner':valid&dense&(r0>.5*r0.max()),'outer_fluid':valid&dense&(r0<=.5*r0.max()),'atmosphere':valid&~dense}.items():
                  assert mask.any(),label
                  def rms(q):return float(np.sqrt(np.mean(q[mask]**2)))
                  row['regions'][label]={'points':int(mask.sum()),'K_rhs_rms':{n:rms(q) for n,q in pieces.items()},'K_observed_dt_rms':rms(actual),'K_dt_minus_ADM_rhs_rms':rms(actual-pieces['total']),'Mz_predicted_K_term_rms':{n:rms(q[...,2]) for n,q in m_parts.items()},'Mz_actual_geometry_change_rms':rms(m_actual[...,2]),'Mz_actual_K_only_change_rms':rms(m_K_actual[...,2]),'Mz_actual_metric_only_change_rms':rms(m_metric_actual[...,2]),'Mz_K_prediction_error_rms':rms((m_K_actual-m_parts['total'])[...,2])}
              report['patches'].append(row)
          assert report['patches'],'no matching archive fields'
          pathlib.Path('evidence/curvature_rhs.json').write_text(json.dumps(report,indent=2,allow_nan=False))
          print('CURVATURE_RHS_BUDGET',json.dumps(report,allow_nan=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: j0740-stationary-curvature-rhs
          path: evidence/
          if-no-files-found: error
