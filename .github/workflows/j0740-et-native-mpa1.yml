          def budget(g,k,rho,eps,p,v,h,order):
              gi=np.linalg.inv(g)
              mixed=np.einsum('...ij,...jk->...ik',gi,k)
              trace=np.trace(mixed,axis1=-2,axis2=-1)
              dg=[deriv(g,j,h[j],order) for j in range(3)]
              gamma=np.zeros(g.shape[:-2]+(3,3,3))
              for a in range(3):
                  for b in range(3):
                      for c in range(3):
                          for d in range(3):
                              gamma[...,a,b,c]+=.5*gi[...,a,d]*(dg[b][...,d,c]+dg[c][...,d,b]-dg[d][...,b,c])
              geo=sum(deriv(mixed[...,j,2],j,h[j],order) for j in range(3))-deriv(trace,2,h[2],order)
              for j in range(3):
                  for l in range(3):
                      geo+=gamma[...,j,j,l]*mixed[...,l,2]-gamma[...,l,j,2]*mixed[...,j,l]
              vc=np.einsum('...ij,...j->...i',g,v)
              v2=np.einsum('...i,...i->...',v,vc)
              assert np.all(v2<1) and np.all(v2>=-1e-13)
