      - name: Match atmosphere thermodynamics to active MPA1 at unchanged floor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,math,numpy as np,re,json
          d=pathlib.Path('evidence')
          p=d/'control.par'; s=p.read_text()
          floor=1e-12
          for key in ('GRHydro::rho_abs_min','Hydro_RNSID::rns_rho_min'):
              m=re.findall(r'^'+re.escape(key)+r'\s*=\s*([0-9.eE+-]+)',s,re.M|re.I)
              assert len(m)==1 and float(m[0])==floor,(key,m)
          with (d/'mpa1_eos_omni_fixed.dat').open() as inp:
              header=[next(inp).rstrip('\n') for _ in range(7)]
              tab=np.loadtxt(inp)
          lo,hi=float(header[2][9:16]),float(header[2][25:32])
          x=np.linspace(math.log10(lo),math.log10(hi),len(tab))
          eps,g=np.interp(math.log10(floor),x,tab[:,0]),np.interp(math.log10(floor),x,tab[:,1])
          pressure=floor**g
          assert 0<eps and 0<pressure
          # GRHydro's general C2P uses a separate polytrope for atmosphere.
          # Match both p and epsilon exactly at the existing density floor;
          # do not replace the active cold_tabulated evolution EOS.
          gamma=1+pressure/(floor*eps)
          k=pressure/floor**gamma
          assert abs(k*floor**gamma/pressure-1)<1e-12
          assert abs(k*floor**(gamma-1)/(gamma-1)/eps-1)<1e-12
          assert pressure/(100*floor**2)>1e5
          for key,val in [('EOS_Omni::poly_gamma',gamma),('EOS_Omni::poly_k',k)]:
              s,n=re.subn(r'^'+re.escape(key)+r'\s*=.*$',f'{key} = {val:.17e}',s,flags=re.M)
              assert n==1,(key,n)
          p.write_text(s)
          report=dict(rho=floor,pressure=pressure,eps=eps,poly_gamma=gamma,poly_k=k,old_pressure=100*floor**2,old_eps=100*floor,scope='matched atmosphere closure at fixed floor; not a momentum repair claim')
          (d/'atmosphere_eos.json').write_text(json.dumps(report,indent=2))
          print('ATMOSPHERE_EOS',json.dumps(report))
          PY
