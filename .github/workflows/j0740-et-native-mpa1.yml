name: J0740 archived stationary metric constraint control
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/j0740-et-native-mpa1.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Read first-step archive without another evolution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          gh api repos/aydinefe2025-svg/Benim-AI-asistan-m/actions/artifacts/15177726961/zip > source.zip
          sha256sum source.zip > evidence/source.sha256
          unzip -tq source.zip
          unzip -q source.zip '*.xyz.h5' -d source
          python3 -m pip install numpy h5py
      - name: Test discrete stationary extrinsic curvature on actual initial fields
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,json,re,numpy as np,h5py
          def d(a,j,h):
              ax=2-j
              return (-np.roll(a,-2,ax)+8*np.roll(a,-1,ax)-8*np.roll(a,1,ax)+np.roll(a,2,ax))/(12*h[j])
          def geo(g,h):
              gi=np.linalg.inv(g); dg=[d(g,j,h) for j in range(3)]
              ch=np.zeros(g.shape[:-2]+(3,3,3))
              for a in range(3):
                  for b in range(3):
                      for c in range(3):
                          for l in range(3):
                              ch[...,a,b,c]+=.5*gi[...,a,l]*(dg[b][...,l,c]+dg[c][...,l,b]-dg[l][...,b,c])
              return gi,dg,ch
          def lie(g,b,h,dg):
              db=[d(b,j,h) for j in range(3)]
              out=sum(b[...,j,None,None]*dg[j] for j in range(3))
              for i in range(3):
                  for j in range(3):
                      for l in range(3):
                          out[...,i,j]+=g[...,l,j]*db[i][...,l]+g[...,i,l]*db[j][...,l]
              return out
          def curvature_scalar(gi,ch,h):
              ric=np.zeros_like(gi)
              for i in range(3):
                  for j in range(3):
                      for a in range(3):
                          ric[...,i,j]+=d(ch[...,a,i,j],a,h)-d(ch[...,a,i,a],j,h)
                          for b in range(3):
                              ric[...,i,j]+=ch[...,a,a,b]*ch[...,b,i,j]-ch[...,a,j,b]*ch[...,b,i,a]
              return np.einsum('...ij,...ij->...',gi,ric)
          def constraints(gi,ch,K,h,R,E,S):
              mix=np.einsum('...ij,...jk->...ik',gi,K)
              tr=np.trace(mix,axis1=-2,axis2=-1)
              H=R+tr*tr-np.einsum('...ij,...ji->...',mix,mix)-16*np.pi*E
              M=np.zeros(S.shape)
              for i in range(3):
                  M[...,i]=sum(d(mix[...,j,i],j,h) for j in range(3))-d(tr,i,h)-8*np.pi*S[...,i]
                  for j in range(3):
                      for l in range(3):
                          M[...,i]+=ch[...,j,j,l]*mix[...,l,i]-ch[...,l,j,i]*mix[...,j,l]
              return H,M
          def evaluate(g,K,alpha,b,rho,eps,p,v,h):
              gi,dg,ch=geo(g,h)
              assert np.all(alpha>0)
              L=lie(g,b,h,dg); Keq=L/(2*alpha[...,None,None])
              vc=np.einsum('...ij,...j->...i',g,v); v2=np.einsum('...i,...i->...',v,vc)
              assert np.all(v2<1) and np.all(v2>=-1e-13)
              w2=1/(1-v2); enthalpy=rho*(1+eps)+p
              E=enthalpy*w2-p; S=(enthalpy*w2)[...,None]*vc
              R=curvature_scalar(gi,ch,h)
              return L-2*alpha[...,None,None]*K,Keq,constraints(gi,ch,K,h,R,E,S),constraints(gi,ch,Keq,h,R,E,S)
          # Analytic controls: flat stationary rotating coordinates and linear shift.
          sh=(11,11,11);z,y,x=np.indices(sh,dtype=float);g=np.broadcast_to(np.eye(3),sh+(3,3)).copy()
          K=np.zeros_like(g);a=np.ones(sh);b=np.stack((-y,x,np.zeros(sh)),axis=-1)*.01
          zero=np.zeros(sh);v=np.zeros(sh+(3,));inner=np.s_[4:-4,4:-4,4:-4]
          r,keq,old,new=evaluate(g,K,a,b,zero,zero,zero,v,[1]*3)
          assert np.max(abs(r[inner]))<1e-12 and np.max(abs(keq[inner]))<1e-12
          assert np.max(abs(old[0][inner]))<1e-12 and np.max(abs(new[1][inner]))<1e-12
          b[:]=0;b[...,2]=.02*z;K[...,2,2]=.02
          r,keq,old,new=evaluate(g,K,a,b,zero,zero,zero,v,[1]*3)
          assert np.max(abs(r[inner]))<1e-12 and np.max(abs((keq-K)[inner]))<1e-12
          assert np.max(abs(new[0][inner]))<1e-12 and np.max(abs(new[1][inner]))<1e-12
          # Negative control: inconsistent K produces a measurable metric RHS.
          K[:]=0;r,keq,old,new=evaluate(g,K,a,b,zero,zero,zero,v,[1]*3)
          assert np.max(abs(r[inner][...,2,2]-.04))<1e-12
          expected={'gxx','gxy','gxz','gyy','gyz','gzz','kxx','kxy','kxz','kyy','kyz','kzz','rho','eps','press','vel[0]','vel[1]','vel[2]','alp','betax','betay','betaz'}
          fields={}
          for path in pathlib.Path('source').rglob('*.xyz.h5'):
              n=path.name.removesuffix('.xyz.h5')
              if n not in expected:continue
              with h5py.File(path,'r') as f:
                  def visit(key,obj):
                      if not isinstance(obj,h5py.Dataset) or obj.ndim!=3:return
                      m=re.search(r'\bit=(0|128)\s+(.*)',key)
                      if not m or not re.search(r'\brl=2\b',m[2]):return
                      k=(n,int(m[1]),m[2]);assert k not in fields,k
                      fields[k]=(obj[...],np.array(obj.attrs['origin'],float),np.array(obj.attrs['delta'],float))
                  f.visititems(visit)
          report={'artifact':15177726961,'analytic_controls':'3/3 passed','scope':'offline fourth-order stationary metric RHS and ADM constraints on finest interior; no evolved correction or physical certification','patches':[]}
          for patch in sorted({p for _,_,p in fields}):
              if not all((n,t,patch) in fields for n in expected for t in (0,128)):continue
              r0,o,h=fields['rho',0,patch];shape=r0.shape
              for n in expected:
                  for t in (0,128):
                      q,oo,hh=fields[n,t,patch];assert q.shape==shape and np.array_equal(o,oo) and np.array_equal(h,hh) and np.isfinite(q).all()
              def get(n,t):return fields[n,t,patch][0]
              def tensor(prefix,t):
                  q=np.zeros(shape+(3,3))
                  for i,j in ((0,0),(0,1),(0,2),(1,1),(1,2),(2,2)):
                      q[...,i,j]=q[...,j,i]=get(prefix+'xyz'[i]+'xyz'[j],t)
                  return q
              g=tensor('g',0);K=tensor('k',0);a=get('alp',0);b=np.stack([get('beta'+i,0) for i in 'xyz'],axis=-1)
              v=np.stack([get(f'vel[{i}]',0) for i in range(3)],axis=-1)
              rhs,Keq,old,new=evaluate(g,K,a,b,r0,get('eps',0),get('press',0),v,h)
              actual=(tensor('g',128)-g)/.09375
              zz,yy,xx=np.indices(shape);x=o[0]+h[0]*xx;y=o[1]+h[1]*yy;z=o[2]+h[2]*zz
              rad=np.sqrt(x*x+y*y+z*z);valid=np.zeros(shape,bool);valid[5:-5,5:-5,5:-5]=True;valid&=(z>=0)&(rad<=10)
              dense=r0>1e-8
              row={'patch':patch,'regions':{}}
              for label,mask in {'inner':valid&dense&(r0>.5*r0.max()),'outer_fluid':valid&dense&(r0<=.5*r0.max()),'atmosphere':valid&~dense}.items():
                  assert mask.any(),label
                  def rms(q):return float(np.sqrt(np.mean(q[mask]**2)))
                  H0,M0=old;H1,M1=new
                  row['regions'][label]={'points':int(mask.sum()),'metric_rhs_rms':rms(rhs),'observed_metric_dt_rms':rms(actual),'metric_dt_minus_rhs_rms':rms(actual-rhs),'K_original_rms':rms(K),'K_correction_rms':rms(Keq-K),'H_before':rms(H0),'H_after':rms(H1),'M_before':[rms(M0[...,i]) for i in range(3)],'M_after':[rms(M1[...,i]) for i in range(3)]}
              report['patches'].append(row)
          assert report['patches'],'no matching archive fields'
          report['candidate_non_worsening_all_regions']=all(r['H_after']<=r['H_before'] and all(b<=a for a,b in zip(r['M_before'],r['M_after'])) for patch in report['patches'] for r in patch['regions'].values())
          pathlib.Path('evidence/stationarity.json').write_text(json.dumps(report,indent=2,allow_nan=False))
          print('STATIONARITY_CONTROL',json.dumps(report,allow_nan=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: j0740-stationarity-control
          path: evidence/
          if-no-files-found: error
