name: J0740 archived first-step independent constraint budget
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/j0740-et-native-mpa1.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Read first-step archive without another evolution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          gh api repos/aydinefe2025-svg/Benim-AI-asistan-m/actions/artifacts/15177726961/zip > source.zip
          sha256sum source.zip > evidence/source.sha256
          unzip -tq source.zip
          unzip -q source.zip '*.xyz.h5' -d source
          python3 -m pip install numpy h5py
      - name: Independent ADM momentum budget
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,json,re,numpy as np,h5py
          def deriv(a,j,h,order):
              ax=2-j
              if order==2:return (np.roll(a,-1,ax)-np.roll(a,1,ax))/(2*h)
              return (-np.roll(a,-2,ax)+8*np.roll(a,-1,ax)-8*np.roll(a,1,ax)+np.roll(a,2,ax))/(12*h)
          def budget(g,k,rho,eps,p,v,h,order):
              gi=np.linalg.inv(g)
              mixed=np.einsum('...ij,...jk->...ik',gi,k)
              trace=np.trace(mixed,axis1=-2,axis2=-1)
              dg=[deriv(g,j,h[j],order) for j in range(3)]
              gamma=np.zeros(g.shape[:-2]+(3,3,3))
              for a in range(3):
                  for b in range(3):
                      for c in range(3):
                          for d in range(3):
                              gamma[...,a,b,c]+=.5*gi[...,a,d]*(dg[b][...,d,c]+dg[c][...,d,b]-dg[d][...,b,c])
              geo=sum(deriv(mixed[...,j,2],j,h[j],order) for j in range(3))-deriv(trace,2,h[2],order)
              for j in range(3):
                  for l in range(3):
                      geo+=gamma[...,j,j,l]*mixed[...,l,2]-gamma[...,l,j,2]*mixed[...,j,l]
              vc=np.einsum('...ij,...j->...i',g,v)
              v2=np.einsum('...i,...i->...',v,vc)
              assert np.all(v2<1) and np.all(v2>=-1e-13)
              source=8*np.pi*(rho*(1+eps)+p)/(1-v2)*vc[...,2]
              return geo,source,geo-source
          # Analytic controls on interior cells; two derivative orders.
          sh=(9,9,9);g=np.broadcast_to(np.eye(3),sh+(3,3)).copy()
          k=np.zeros_like(g);z=np.indices(sh)[0].astype(float)
          zero=np.zeros(sh);v=np.zeros(sh+(3,));inside=np.s_[2:-2,2:-2,2:-2]
          for order in (2,4):
              k[:]=0;k[...,0,0]=z
              assert np.max(abs(budget(g,k,zero,zero,zero,v,[1]*3,order)[2][inside]+1))<1e-12
              k[:]=0;k[...,2,2]=z
              assert np.max(abs(budget(g,k,zero,zero,zero,v,[1]*3,order)[2][inside]))<1e-12
              k[:]=0;v[...,2]=.1
              assert np.max(abs(budget(g,k,np.ones(sh),zero,zero,v,[1]*3,order)[2][inside]+8*np.pi*.1/.99))<1e-12
              v[:]=0
          fields={}
          expected={'gxx','gxy','gxz','gyy','gyz','gzz','kxx','kxy','kxz','kyy','kyz','kzz','rho','eps','press','vel[0]','vel[1]','vel[2]','M3','dens'}
          for pth in pathlib.Path('source').rglob('*.xyz.h5'):
              name=pth.name.removesuffix('.xyz.h5')
              if name not in expected:continue
              with h5py.File(pth,'r') as h:
                  def visit(n,obj):
                      if not isinstance(obj,h5py.Dataset) or obj.ndim!=3:return
                      m=re.search(r'\bit=(0|128)\s+(.*)',n)
                      if not m or not re.search(r'\brl=2\b',m[2]):return
                      key=(name,int(m[1]),m[2]);assert key not in fields,key
                      fields[key]=(obj[...],np.array(obj.attrs['origin'],float),np.array(obj.attrs['delta'],float))
                  h.visititems(visit)
          report={'artifact':15177726961,'analytic_controls':'6/6 passed','scope':'independent ADM lower-index constraint on interior of finest patch, not composite AMR or identical native discretization','patches':[]}
          for patch in sorted({p for _,_,p in fields}):
              if not all((n,t,patch) in fields for n in expected for t in (0,128)):continue
              r0,o,h=fields['rho',0,patch];shape=r0.shape
              assert np.allclose(h,.375)
              for n in expected:
                  for t in (0,128):
                      a,oo,hh=fields[n,t,patch]
                      assert a.shape==shape and np.array_equal(o,oo) and np.array_equal(h,hh) and np.isfinite(a).all(),(n,t)
              def get(n,t):return fields[n,t,patch][0]
              def tensor(prefix,t):
                  a=np.zeros(shape+(3,3))
                  for i,j in [(0,0),(0,1),(0,2),(1,1),(1,2),(2,2)]:
                      a[...,i,j]=a[...,j,i]=get(prefix+'xyz'[i]+'xyz'[j],t)
                  return a
              zz,yy,xx=np.indices(shape)
              x=o[0]+h[0]*xx;y=o[1]+h[1]*yy;z=o[2]+h[2]*zz
              rad=np.sqrt(x*x+y*y+z*z)
              valid=np.zeros(shape,bool);valid[3:-3,3:-3,3:-3]=True;valid&=(z>=-1e-12)&(rad<=10)
              dense=r0>1e-8;near=dense.copy()
              for ax in range(3):near|=np.roll(dense,1,ax)|np.roll(dense,-1,ax)
              masks={'inner':valid&dense&(r0>.5*r0.max()),'outer_fluid':valid&dense&(r0<=.5*r0.max()),'surface_atmosphere':valid&near&~dense,'far_atmosphere':valid&~near}
              row={'patch':patch,'regions':{},'integrals':{}}
              native=get('M3',128)-get('M3',0)
              for order in (2,4):
                  vals=[]
                  for t in (0,128):
                      metric=tensor('g',t);curv=tensor('k',t)
                      rho,eps,p=[get(n,t) for n in ('rho','eps','press')]
                      vel=np.stack([get(f'vel[{i}]',t) for i in range(3)],axis=-1)
                      vals.append(budget(metric,curv,rho,eps,p,vel,h,order))
                      if order==4:
                          weight=np.where(abs(z)<1e-12,1.,2.)*np.prod(h)
                          sg=np.sqrt(np.linalg.det(metric));vl=np.einsum('...ij,...j->...i',metric,vel)
                          sl=(rho*(1+eps)+p)[...,None]*vl/(1-np.einsum('...i,...i->...',vel,vl))[...,None]
                          row['integrals'][str(t)]={'baryon_mass_r_le_10':float(np.sum((weight*get('dens',t))[valid])),'matter_Jz_r_le_10':float(np.sum((weight*sg*(x*sl[...,1]-y*sl[...,0]))[valid]))}
                  d=[b-a for a,b in zip(vals[0],vals[1])]
                  for label,m in masks.items():
                      if not np.any(m):continue
                      rms=lambda a:float(np.sqrt(np.mean(a[m]**2)))
                      row['regions'].setdefault(label,{})[str(order)]={'points':int(m.sum()),'geometry_delta_rms':rms(d[0]),'matter_delta_rms':rms(d[1]),'ADM_residual_delta_rms':rms(d[2]),'native_delta_rms':rms(native),'relative_difference_to_native':float(np.linalg.norm((d[2]-native)[m])/max(np.linalg.norm(native[m]),1e-300))}
              report['patches'].append(row)
          assert report['patches'],'no complete matching patch in archive'
          pathlib.Path('evidence/constraint_budget.json').write_text(json.dumps(report,indent=2,allow_nan=False))
          print('CONSTRAINT_BUDGET',json.dumps(report,allow_nan=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: j0740-first-step-constraint-budget
          path: evidence/
          if-no-files-found: error
