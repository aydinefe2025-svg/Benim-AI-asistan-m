name: J0740 native MPA1 RNSID EOS Omni coupling
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/j0740-et-native-mpa1.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independent-bssn:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        dx: ['1.5']
        solver: ['HLLC']
    env:
      DX: ${{ matrix.dx }}
      SOLVER: ${{ matrix.solver }}
    steps:
      - name: Obtain official independent solver and pinned tutorial initial data
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          gh api repos/${{ github.repository }}/actions/artifacts/15138872722/zip > bridge.zip
          echo 'f233fcc59c19a0556e0cf370d67dac2d0eb2c3b082d2b08c293c7f51587834cf  bridge.zip' | sha256sum -c -
          unzip -tq bridge.zip
          unzip -j bridge.zip '*/model.rns' '*/mpa1_eos_omni.dat' '*/bridge.json' -d evidence || unzip -jo bridge.zip model.rns mpa1_eos_omni.dat bridge.json -d evidence
          echo 'bd9cda6359f4e68d4de3a27b3a0e80bd830d0fb3936f91dfea59517e403c090d  evidence/model.rns' | sha256sum -c -
          echo '7d745c1791d46bc1d54267ee75db61e6e2367aed96e5785068485196096193d2  evidence/mpa1_eos_omni.dat' | sha256sum -c -
          curl --fail --retry 3 -L 'https://raw.githubusercontent.com/einsteintoolkit/jupyter-et/0a3b5797e70b79509e5729c86065eca635882521/tutorial-server/notebooks/CactusTutorial.ipynb' -o evidence/source.ipynb
          sha256sum evidence/source.ipynb > evidence/source.sha256
          python3 - <<'PY'
          import json,pathlib,os,re
          d=pathlib.Path('evidence')
          nb=json.loads((d/'source.ipynb').read_text())
          cells=[''.join(c['source']) for c in nb['cells']]
          src=[s for s in cells if s.startswith('%%writefile par/tov_ET.par')]
          assert len(src)==1
          s=src[0].split('\n',1)[1]
          (d/'original.par').write_text(s)
          assert 'TOVSolver::TOV_Rho_Central[0] = 1.28e-3' in s
          assert 'TOVSolver::TOV_Gamma          = 2' in s
          assert 'TOVSolver::TOV_K              = 100' in s
          def setparam(key,value):
              global s
              s,n=re.subn(r'^\s*'+re.escape(key)+r'\s*=.*$',key+' = '+value,s,flags=re.M)
              assert n==1,(key,n)
          setparam('Cactus::cctk_final_time','2.0')
          for axis in 'xyz': setparam('CoordBase::d'+axis,os.environ['DX'])
          setparam('IO::out_dir','"/evidence/run"')
          setparam('IOScalar::outScalar_every','1')
          setparam('IOBasic::outInfo_every','1')
          # Rigid rotation breaks x/y mirror symmetry. Keep equatorial z symmetry only.
          for axis in 'xy':
              setparam('CoordBase::'+axis+'min','-24.0')
              setparam('CoordBase::boundary_shiftout_'+axis+'_lower','0')
              setparam('ReflectionSymmetry::reflection_'+axis,'"no"')
          setparam('GRHydro::riemann_solver','"'+os.environ['SOLVER']+'"')
          # Both solvers evolve the same Gamma=2 ideal-fluid EOS, initialized
          # with identical cold RNS polytropic data. Polytype omits energy evolution.
          setparam('GRHydro::GRHydro_eos_type','"General"')
          setparam('GRHydro::GRHydro_eos_table','"cold_tabulated"')
          setparam('NaNChecker::check_every','1')
          setparam('GRHydro::rho_abs_min','1e-12')
          assert s.count('ActiveThorns = "TOVSolver"')==1
          s=s.replace('ActiveThorns = "TOVSolver"','ActiveThorns = "Hydro_RNSID"')
          for key in ('HydroBase::initial_hydro','ADMBase::initial_data','ADMBase::initial_lapse','ADMBase::initial_shift'):
              setparam(key,'"hydro_rnsid"')
          s,n=re.subn(r'^TOVSolver::.*\n','',s,flags=re.M)
          assert n==3
          bridge=json.loads((d/'bridge.json').read_text())
          s+='\nHydro_RNSID::rho_central = '+str(bridge['central_density'])+'\nHydro_RNSID::axes_ratio = '+str(bridge['axes_ratio'])+'\nHydro_RNSID::rotation_type = "uniform"\nHydro_RNSID::accuracy = 1e-10\nHydro_RNSID::eos_type = "tab"\nHydro_RNSID::eos_file = "/evidence/model.rns"\nHydro_RNSID::rns_rho_min = 1e-12\nEOS_Omni::coldeos_read_table = "yes"\nEOS_Omni::coldeos_table_name = "/evidence/mpa1_eos_omni.dat"\nEOS_Omni::coldeos_use_thermal_gamma_law = "yes"\n'
          assert 'TOVSolver::' not in s
          (d/'control.par').write_text(s)
          PY
          docker pull einsteintoolkit/et-notebook@sha256:3bdd9860d69aaa7b6c42f3ac5094772edb50587b5462744913257bbb1caebd66
          docker image inspect einsteintoolkit/et-notebook@sha256:3bdd9860d69aaa7b6c42f3ac5094772edb50587b5462744913257bbb1caebd66 > evidence/image.json
          docker image inspect --format '{{index .RepoDigests 0}}' einsteintoolkit/et-notebook@sha256:3bdd9860d69aaa7b6c42f3ac5094772edb50587b5462744913257bbb1caebd66 > evidence/image-digest.txt
          test -s evidence/image-digest.txt
      - name: Execute actual independent BSSN and GRHydro evolution
        shell: bash
        run: |
          set -euo pipefail
          cat > evidence/execute.sh <<'SH'
          set -euo pipefail
          export OMP_NUM_THREADS=2 OMPI_ALLOW_RUN_AS_ROOT=1 OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1
          mkdir -p /tmp/et-control /evidence/run
          # Official base.docker sets etuser home to /usr/etuser; its
          # build-cactus-tarball.sh leaves Cactus.tar.gz in that home.
          archive=/usr/etuser/Cactus.tar.gz
          if [[ ! -s "$archive" ]]; then
            archive=$(find /usr/etuser /home /opt /root -type f -name Cactus.tar.gz -print -quit 2>/dev/null || true)
          fi
          if [[ -z "$archive" || ! -s "$archive" ]]; then
            echo 'Cactus archive unavailable' >&2
            exit 2
          fi
          printf '%s\n' "$archive" | tee /evidence/archive-path.txt
          sha256sum "$archive" > /evidence/archive.sha256
          tar -xzf "$archive" -C /tmp/et-control
          exe=$(find /tmp/et-control -type f -name cactus_sim -executable -print -quit)
          if [[ -z "$exe" ]]; then echo 'Extracted Cactus executable unavailable' >&2; exit 3; fi
          printf '%s\n' "$exe" | tee /evidence/executable-path.txt
          ldd "$exe" | tee /evidence/executable-ldd.txt
          if grep -q 'not found' /evidence/executable-ldd.txt; then exit 4; fi
          sha256sum "$exe" > /evidence/executable.sha256
          cd /evidence
          "$exe" /evidence/control.par 2>&1 | tee native.log
          if grep -Eq 'NaN/Inf value\(s\) found|scheduling graceful termination of Cactus' native.log; then exit 5; fi
          SH
          docker run --rm --user 0:0 --entrypoint /bin/bash -v "$PWD/evidence:/evidence" "$(cat evidence/image-digest.txt)" /evidence/execute.sh
      - name: Validate raw independent constraint histories
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,math,json,os,re
          d=pathlib.Path('evidence')
          def history(token,reduction):
              files=[p for p in (d/'run').rglob('*.asc') if token in p.name.lower() and reduction in p.name.lower()]
              assert files,(token,reduction,[p.name for p in (d/'run').rglob('*.asc')])
              ans=[]
              for p in files:
                  rows=[list(map(float,l.split())) for l in p.read_text().splitlines() if l.strip() and not l.lstrip().startswith('#')]
                  assert len(rows)>1 and all(len(x)>=3 and all(map(math.isfinite,x)) for x in rows),p
                  assert rows[-1][1]>=1.9,(p,rows[-1])
                  ans.append(dict(file=p.name,initial=rows[0],final=rows[-1],rows=len(rows)))
              return ans
          result=dict(scope='native F171 MPA1 EOS ingestion and independently reconstructed rotating star; not identical F171 fields; no certification',dx=float(os.environ['DX']),solver=os.environ['SOLVER'],evolution_eos='MPA1 cold_tabulated + GammaTh=1.75',axes_ratio=json.loads((d/'bridge.json').read_text())['axes_ratio'],hamiltonian=history('ham','norm2'),momentum=history('mom','norm2'),density=history('rho','maximum'),velocity=history('vel','maximum'),conserved_density=history('dens','sum'),image_digest=(d/'image-digest.txt').read_text().strip())
          assert any(abs(x)>1e-5 for v in result['velocity'] for x in v['initial'][2:]), 'nonzero initial rotation not measured'
          log=(d/'native.log').read_text()
          pat=r'INFO \(Hydro_RNSID\):\s+rho_center\s+e_center\s+Mass\s+Mass_0\s+R_e[^\n]*\nINFO \(Hydro_RNSID\):\s+([^\n]+)\nINFO \(Hydro_RNSID\):\s+J\s+T/W\s+Omega[^\n]*\nINFO \(Hydro_RNSID\):\s+([^\n]+)'
          match=re.findall(pat,log)
          assert match,'missing actual native mass/spin diagnostics'
          m,j=map(lambda x:list(map(float,x.split())),match[-1])
          C=2.99792458e10;G=6.67408e-8;MS=1.98848e33
          f=j[2]*C**3/(2*math.pi*G*MS)
          result['native_initial_mass_msun']=m[2]
          result['native_initial_spin_hz']=f
          result['native_initial_J_cgs']=j[0]*G*MS**2/C
          result['source_match']={'mass_relative':abs(m[2]/2.073-1),'spin_absolute_hz':abs(f-346.536369),'J_relative':abs(result['native_initial_J_cgs']/6.06724990745871e48-1)}
          result['source_match_gate']=result['source_match']['mass_relative']<1e-3 and result['source_match']['spin_absolute_hz']<.1 and result['source_match']['J_relative']<.01
          result['momentum_component_non_growth']=all(b<=a for rec in result['momentum'] for a,b in zip(rec['initial'][2:],rec['final'][2:]))
          (d/'independent.json').write_text(json.dumps(result,indent=2))
          print('NATIVE_MPA1_RESULT',json.dumps(result))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: independent-et-native-mpa1-${{ matrix.solver }}-dx-${{ matrix.dx }}
          path: evidence/
          if-no-files-found: error
