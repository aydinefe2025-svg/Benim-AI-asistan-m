name: J0740 native restart constraint scheduling control
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/j0740-et-native-mpa1.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independent-bssn:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - dx: '3'
            finest: '0.75'
            duration: '2.25'
            trial: retarget
            solver: HLLC
    env:
      DX: ${{ matrix.dx }}
      FINEST: ${{ matrix.finest }}
      DURATION: ${{ matrix.duration }}
      SOLVER: ${{ matrix.solver }}
      TRIAL: ${{ matrix.trial }}
    steps:
      - name: Obtain official independent solver and pinned tutorial initial data
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          gh api repos/${{ github.repository }}/actions/artifacts/15138872722/zip > bridge.zip
          echo 'f233fcc59c19a0556e0cf370d67dac2d0eb2c3b082d2b08c293c7f51587834cf  bridge.zip' | sha256sum -c -
          unzip -tq bridge.zip
          unzip -j bridge.zip '*/model.rns' '*/mpa1_eos_omni.dat' '*/bridge.json' -d evidence || unzip -jo bridge.zip model.rns mpa1_eos_omni.dat bridge.json -d evidence
          echo 'bd9cda6359f4e68d4de3a27b3a0e80bd830d0fb3936f91dfea59517e403c090d  evidence/model.rns' | sha256sum -c -
          echo '7d745c1791d46bc1d54267ee75db61e6e2367aed96e5785068485196096193d2  evidence/mpa1_eos_omni.dat' | sha256sum -c -
          curl --fail --retry 3 -L 'https://raw.githubusercontent.com/einsteintoolkit/jupyter-et/0a3b5797e70b79509e5729c86065eca635882521/tutorial-server/notebooks/CactusTutorial.ipynb' -o evidence/source.ipynb
          sha256sum evidence/source.ipynb > evidence/source.sha256
          python3 - <<'PY'
          import json,pathlib,os,re
          d=pathlib.Path('evidence')
          nb=json.loads((d/'source.ipynb').read_text())
          cells=[''.join(c['source']) for c in nb['cells']]
          src=[s for s in cells if s.startswith('%%writefile par/tov_ET.par')]
          assert len(src)==1
          s=src[0].split('\n',1)[1]
          (d/'original.par').write_text(s)
          assert 'TOVSolver::TOV_Rho_Central[0] = 1.28e-3' in s
          assert 'TOVSolver::TOV_Gamma          = 2' in s
          assert 'TOVSolver::TOV_K              = 100' in s
          def setparam(key,value):
              global s
              s,n=re.subn(r'^\s*'+re.escape(key)+r'\s*=.*$',key+' = '+value,s,flags=re.M)
              assert n==1,(key,n)
          setparam('Cactus::cctk_final_time',os.environ['DURATION'])
          for axis in 'xyz': setparam('CoordBase::d'+axis,os.environ['DX'])
          setparam('IO::out_dir','"/evidence/run"')
          setparam('IOScalar::outScalar_every','1')
          setparam('IOBasic::outInfo_every','8192')
          setparam('IOASCII::out1D_every','1')
          setparam('CarpetIOHDF5::out2D_every','1024')
          setparam('TerminationTrigger::max_walltime','5.5')
          setparam('TerminationTrigger::on_remaining_walltime','10')
          setparam('CarpetRegrid2::num_levels_1','3')
          setparam('CarpetRegrid2::radius_1[1]','24.0')
          s+='\nCarpetRegrid2::radius_1[2] = 12.0\n'
          for axis in 'xyz': setparam('CoordBase::'+axis+'max','192.0')
          assert float(os.environ['DX'])/4==float(os.environ['FINEST'])
          # Initial and sparse later 3D snapshots support independent AMR mass and angular-momentum integrals.
          s+='\nCarpetIOHDF5::out3D_every = 16384\nCarpetIOHDF5::out3D_vars = "GRHydro::dens ADMBase::metric ADMBase::curv ADMBase::lapse ADMBase::shift HydroBase::rho HydroBase::press HydroBase::eps HydroBase::vel"\n'
          s,n=re.subn(r'(IOASCII::out1D_vars\s*=\s*"[^\"]*?ADMBase::lapse)',r'\1\n ADMBase::shift',s,flags=re.S); assert n==1
          # Rigid rotation breaks x/y mirror symmetry. Keep equatorial z symmetry only.
          for axis in 'xy':
              setparam('CoordBase::'+axis+'min','-192.0')
              setparam('CoordBase::boundary_shiftout_'+axis+'_lower','0')
              setparam('ReflectionSymmetry::reflection_'+axis,'"no"')
          setparam('GRHydro::riemann_solver','"'+os.environ['SOLVER']+'"')
          # Both solvers evolve the same Gamma=2 ideal-fluid EOS, initialized
          # with identical cold RNS polytropic data. Polytype omits energy evolution.
          setparam('GRHydro::GRHydro_eos_type','"General"')
          setparam('GRHydro::GRHydro_eos_table','"cold_tabulated"')
          setparam('NaNChecker::check_every','1')
          setparam('GRHydro::rho_abs_min','1e-12')
          assert s.count('ActiveThorns = "TOVSolver"')==1
          s=s.replace('ActiveThorns = "TOVSolver"','ActiveThorns = "Hydro_RNSID"')
          for key in ('HydroBase::initial_hydro','ADMBase::initial_data','ADMBase::initial_lapse','ADMBase::initial_shift'):
              setparam(key,'"hydro_rnsid"')
          s,n=re.subn(r'^TOVSolver::.*\n','',s,flags=re.M)
          assert n==3
          bridge=json.loads((d/'bridge.json').read_text())
          s+='\nHydro_RNSID::rho_central = '+str(bridge['central_density'])+'\nHydro_RNSID::axes_ratio = '+str(bridge['axes_ratio'])+'\nHydro_RNSID::rotation_type = "uniform"\nHydro_RNSID::accuracy = 1e-10\nHydro_RNSID::eos_type = "tab"\nHydro_RNSID::eos_file = "/evidence/model.rns"\nHydro_RNSID::rns_rho_min = 1e-12\nEOS_Omni::coldeos_read_table = "yes"\nEOS_Omni::coldeos_table_name = "/evidence/mpa1_eos_omni.dat"\nEOS_Omni::coldeos_use_thermal_gamma_law = "yes"\n'
          assert 'TOVSolver::' not in s
          (d/'control.par').write_text(s)
          PY
          docker pull einsteintoolkit/et-notebook@sha256:3bdd9860d69aaa7b6c42f3ac5094772edb50587b5462744913257bbb1caebd66
          docker image inspect einsteintoolkit/et-notebook@sha256:3bdd9860d69aaa7b6c42f3ac5094772edb50587b5462744913257bbb1caebd66 > evidence/image.json
          docker image inspect --format '{{index .RepoDigests 0}}' einsteintoolkit/et-notebook@sha256:3bdd9860d69aaa7b6c42f3ac5094772edb50587b5462744913257bbb1caebd66 > evidence/image-digest.txt
          test -s evidence/image-digest.txt
      - name: Re-encode fixed-field native EOS header and independently verify thermodynamics
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install numpy
          python3 - <<'PY'
          import numpy as np, pathlib, json, hashlib, math
          d=pathlib.Path('evidence')
          original=d/'mpa1_eos_omni.dat'
          lines=original.read_text().splitlines()
          N=int(lines[1].split()[2])
          lo,hi=map(float,(lines[2].split()[2],lines[2].split()[5]))
          # Published EOS_Omni reader uses A16,A16 for density fields;
          # documented integer line places NYe at column 15 and NT at 27.
          # This is a candidate contract, verified finally by the pinned binary.
          def compact_inside(x,lower):
              candidates=set()
              for digits in range(1,17):
                  scale=10.**(math.floor(math.log10(x))-digits+1)
                  n=x/scale
                  for k in (math.floor(n),math.ceil(n),round(n)):
                      y=k*scale
                      for fmt in (f'.{digits}g',f'.{digits}e',f'.{digits}f'):
                          t=format(y,fmt)
                          if 'e' in t:
                              mant,ex=t.split('e')
                              t=mant.rstrip('0').rstrip('.')+'e'+str(int(ex)) if '.' in mant else mant+'e'+str(int(ex))
                          elif '.' in t:
                              t=t.rstrip('0').rstrip('.')
                          for s in (t,t.lstrip('0') if t.startswith('0.') else t):
                              if not s or len(s)>7: continue
                              v=float(s)
                              if v>0 and ((v>=x if lower else v<=x) or abs(v-x)<=math.ulp(x)): candidates.add(s)
              assert candidates,(x,lower)
              return min(candidates,key=lambda s:(abs(float(s)/x-1),len(s),s))
          l,h=compact_inside(lo,True),compact_inside(hi,False)
          L,H=float(l),float(h)
          assert max(abs(L/lo-1),abs(H/hi-1))<1e-3,(lo,hi,L,H)
          assert L<H
          # One floating-point ULP is decimal serialization roundoff, not EOS extrapolation.
          assert L>=lo or lo-L<=math.ulp(lo)
          assert H<=hi or H-hi<=math.ulp(hi)
          assert float(compact_inside(1.0000000000000002e-14,True))==1e-14
          assert float(compact_inside(0.0027219588509891255,False))<=0.0027219588509891255
          # Recompute the EOS at the actual serialized grid; never reinterpret
          # unchanged rows at shifted densities or extrapolate above source max.
          a=np.loadtxt(d/'model.rns',skiprows=1)
          C=2.99792458e10; MB=1.66e-24; G=6.67408e-8; MS=1.98848e33
          conv=(G*MS/C**2)**3/MS
          E,P,enthalpy,n=a[:,0]*C*C,a[:,1],a[:,2]/C**2,a[:,3]
          slope=np.diff(E)/np.diff(P)
          assert np.all(slope>=1-1e-10) and np.all(np.diff(n)>0)
          assert np.max(abs((E+P)*np.exp(-enthalpy)/(MB*C*C*n)-1))<1e-12
          def cold(rho):
              q=rho/(MB*conv)
              i=np.clip(np.searchsorted(n,q,side='right')-1,0,len(slope)-1)
              delta=(E[i]+P[i])/(1+slope[i])*np.expm1((1+slope[i])/slope[i]*np.log(q/n[i]))
              p=P[i]+delta; e=E[i]+slope[i]*delta; cs2=1/slope[i]
              low=q<n[0]; y=np.cbrt(q[low]/n[0]); aa=P[0]/E[0]; t=y/(1+aa-aa*y)
              p[low]=P[0]*t**4; e[low]=E[0]*t**3; cs2[low]=4*p[low]/(3*e[low])
              return p/C**2*conv,e/(q*MB*C*C)-1,np.sqrt(cs2)
          rho=np.geomspace(L,H,N); p,eps,cs=cold(rho)
          assert np.all(np.isfinite([p,eps,cs])) and np.all(p>0) and np.all((cs>0)&(cs<=1+1e-10))
          assert np.all(rho<1)
          gamma=np.log(p)/np.log(rho)
          fields=[f'Nrho = {N}','NYe = 1','NT = 1']
          widths=[14,12,12]
          assert all(len(x)<=w for x,w in zip(fields,widths))
          intline=''.join(x.ljust(w) for x,w in zip(fields,widths))
          rhofields=['RhoMin = '+l,'RhoMax = '+h]
          assert all(len(x)<=16 for x in rhofields)
          rhobounds=''.join(x.ljust(16) for x in rhofields)
          dest=d/'mpa1_eos_omni_fixed.dat'
          with dest.open('w') as out:
              out.write('\n'.join([lines[0],intline,rhobounds,*lines[3:7]])+'\n')
              np.savetxt(out,np.c_[eps,gamma,cs],fmt='%.17e')
          # Read serialized fixed-width fields, not the in-memory originals.
          with dest.open() as inp:
              first=[next(inp).rstrip('\n') for _ in range(7)]
              v=np.loadtxt(inp)
          assert [int(first[1][7:14]),int(first[1][20:26]),int(first[1][31:38])]==[N,1,1]
          assert [float(first[2][9:16]),float(first[2][25:32])]==[L,H]
          assert v.shape==(N,3)
          knots=n*MB*conv
          mid=np.sqrt(knots[:-1]*knots[1:])
          z=np.sort(np.r_[knots[(knots>=L)&(knots<=H)],mid[(mid>=L)&(mid<=H)],np.geomspace(L,H,100003)])
          pz,ez,cz=cold(z); x=np.log10(z); grid=np.log10(rho)
          p2=z**np.interp(x,grid,v[:,1]); e2=np.interp(x,grid,v[:,0]); c2=np.interp(x,grid,v[:,2])
          plinear=np.interp(x,grid,rho**v[:,1])
          err=dict(pressure_max_relative=float(np.max(abs(p2/pz-1))),pressure_linear_logrho_max_relative=float(np.max(abs(plinear/pz-1))),energy_max_relative=float(np.max(abs(e2-ez)/(1+abs(ez)))),sound_speed_max_absolute=float(np.max(abs(c2-cz))))
          assert max(err['pressure_max_relative'],err['pressure_linear_logrho_max_relative'])<1e-3,err
          assert err['energy_max_relative']<1e-4,err
          assert np.all((c2>0)&(c2<=1+1e-10))
          assert np.max(abs(z**(np.interp(x,grid,v[:,1])+.01)/pz-1))>1e-3
          center=json.loads((d/'bridge.json').read_text())['central_density']
          assert L<center<H,(L,center,H)
          report=dict(scope='fixed-field candidate, independent native read still required',source_sha256=hashlib.sha256(original.read_bytes()).hexdigest(),fixed_sha256=hashlib.sha256(dest.read_bytes()).hexdigest(),source_range=[lo,hi],native_range=[L,H],original_knots_outside_native_range=int(np.count_nonzero((knots<L)|(knots>H))),original_rows=N,errors=err,central_density=center)
          (d/'fixed_header.json').write_text(json.dumps(report,indent=2));print('FIXED_HEADER',json.dumps(report))
          par=d/'control.par'
          s=par.read_text()
          assert s.count('/evidence/mpa1_eos_omni.dat')==1
          par.write_text(s.replace('/evidence/mpa1_eos_omni.dat','/evidence/mpa1_eos_omni_fixed.dat'))
          PY
          # Preserve the original failed input and validate the candidate with
          # a compiled fixed-field reader before invoking the actual solver.
          cat > evidence/header_probe.f90 <<'F90'
          program probe
          implicit none
          character(len=256) :: b1,b2,b3
          integer :: n,ny,nt
          real(8) :: lo,hi
          read(*,'(A)') b1
          read(*,'(A14,A12,A12)') b1,b2,b3
          read(b1(8:),*) n
          read(b2(7:),*) ny
          read(b3(6:),*) nt
          read(*,'(A16,A16)') b1,b2
          read(b1(10:),*) lo
          read(b2(10:),*) hi
          if (n<=0.or.ny/=1.or.nt/=1.or.lo<=0.or.hi<=lo) stop 1
          print *,n,ny,nt,lo,hi
          end program
          F90
          gfortran evidence/header_probe.f90 -o /tmp/header_probe
          if /tmp/header_probe < evidence/mpa1_eos_omni.dat > evidence/original_header_probe.log 2>&1; then
            echo 'Expected original fixed-field probe failure did not occur' >&2; exit 6
          fi
          /tmp/header_probe < evidence/mpa1_eos_omni_fixed.dat | tee evidence/fixed_header_probe.log
      - name: Extend RNSID low-density support using the archived analytic crust
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, numpy as np, json, hashlib
          d=pathlib.Path('evidence')
          original=d/'model.rns'
          a=np.loadtxt(original,skiprows=1)
          assert int(original.read_text().splitlines()[0])==len(a)
          C=2.99792458e10; MB=1.66e-24
          rho0,p0,h0,n0=a[0]
          alpha=p0/(rho0*C*C)
          assert alpha>0 and np.all(a>0)
          assert abs(h0/C**2/(4*np.log1p(alpha))-1)<1e-9, 'F171 analytic crust anchor mismatch'
          # F164 used an exact crust adapter and EOS-consistent surface.
          # The unpatched legacy RNS interpolator cannot assume that continuation.
          # Cover both legacy RNS surface defaults (7.8 g/cm3 and 1.01e8 dyn/cm2),
          # including a safety interval below each. No high-density extrapolation.
          tmin=min((1.01e6/p0)**.25,(.078/rho0)**(1/3))
          if tmin>=1:
              raise SystemExit('Original already covers conservative low-pressure/density bounds; do not duplicate evolution')
          t=np.geomspace(tmin,1.,129)[:-1]
          rho=rho0*t**3; p=p0*t**4
          H=4*np.log1p(alpha*t)
          n=n0*(t*(1+alpha)/(1+alpha*t))**3
          extension=np.column_stack([rho,p,H*C*C,n])
          b=np.vstack([extension,a])
          assert np.all(np.isfinite(b)) and np.all(b>0)
          assert np.all(np.diff(b,axis=0)>0)
          assert np.array_equal(b[len(extension):],a)
          assert b[0,0]<7.8<b[-1,0] and b[0,1]<1.01e8<b[-1,1]
          E=b[:,0]*C*C; P=b[:,1]; h=b[:,2]/C**2
          firstlaw=np.max(abs((E+P)*np.exp(-h)/(MB*C*C*b[:,3])-1))
          assert firstlaw<1e-10,firstlaw
          assert np.all(np.diff(E)>=np.diff(P)*(1-1e-10))
          # Original EOS bytes remain archived. Preserve each original text row
          # exactly in the native input, append no new high-density rows.
          dest=d/'model_rnsid_crust.rns'
          with dest.open('w') as out:
              out.write(str(len(b))+'\n')
              np.savetxt(out,extension,fmt='%.17e')
              out.write(original.read_text().split('\n',1)[1])
          got=np.loadtxt(dest,skiprows=1)
          assert np.array_equal(got[len(extension):],a)
          assert np.array_equal(got[:len(extension)],extension)
          result=dict(scope='legacy RNSID low-density continuation candidate, not stability',old_rows=len(a),added_rows=len(extension),old_min=a[0].tolist(),new_min=b[0].tolist(),surface_pressure_covered=True,surface_density_covered=True,first_law_max_relative=float(firstlaw),old_sha256=hashlib.sha256(original.read_bytes()).hexdigest(),new_sha256=hashlib.sha256(dest.read_bytes()).hexdigest())
          (d/'rnsid_crust.json').write_text(json.dumps(result,indent=2))
          print('RNSID_CRUST',json.dumps(result))
          par=d/'control.par'
          s=par.read_text()
          assert s.count('Hydro_RNSID::eos_file = "/evidence/model.rns"')==1
          par.write_text(s.replace('Hydro_RNSID::eos_file = "/evidence/model.rns"','Hydro_RNSID::eos_file = "/evidence/model_rnsid_crust.rns"'))
          PY
      - name: Enable documented bracketed C2P fallback
        shell: bash
        run: |
          set -euo pipefail
          cp evidence/control.par evidence/control_before_c2p.par
          python3 - <<'PY'
          import pathlib,re
          p=pathlib.Path('evidence/control.par')
          s=p.read_text()
          key='GRHydro::c2p_resort_to_bisection'
          pattern=r'^\s*'+re.escape(key)+r'\s*=.*$'
          s,n=re.subn(pattern,key+' = "yes"',s,flags=re.M|re.I)
          assert n<=1
          if not n: s+='\n'+key+' = "yes"\n'
          p.write_text(s)
          assert len(re.findall(pattern,s,flags=re.M|re.I))==1
          PY
      - name: Correct F171 energy-density to RNSID baryon-density transfer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,json,math,numpy as np,re
          d=pathlib.Path('evidence')
          b=json.loads((d/'bridge.json').read_text())
          a=np.loadtxt(d/'model.rns',skiprows=1)
          C=2.99792458e10; MB=1.66e-24; G=6.67408e-8; MS=1.98848e33
          conv=(G*MS/C**2)**3/MS
          E,P,H,n=a[:,0]*C*C,a[:,1],a[:,2]/C**2,a[:,3]
          # F171 export.py passes retarget_rho with RNS -e (total
          # energy density/c^2); Hydro_RNSID rho_central is baryon density.
          old=float(b['central_density']); Etarget=old*C*C/conv
          i=int(np.searchsorted(E,Etarget,side='right')-1)
          assert 0<=i<len(E)-1
          slope=(E[i+1]-E[i])/(P[i+1]-P[i])
          delta=(Etarget-E[i])/slope
          Pc=P[i]+delta
          hc=H[i]+math.log1p((1+slope)*delta/(E[i]+P[i]))/(1+slope)
          nc=(Etarget+Pc)*math.exp(-hc)/(MB*C*C)
          new=nc*MB*conv
          assert 0<new<old and abs(new/old-1)>1e-3
          # Independently invert the original cold interpolant to recover E.
          dp=(E[i]+P[i])/(1+slope)*math.expm1((1+slope)/slope*math.log(nc/n[i]))
          back=E[i]+slope*dp
          assert abs(back/Etarget-1)<1e-12
          report=dict(scope='correct central-density variable, not retarget or stability claim',old_wrong_baryon_input=old,new_baryon_input=new,target_energy_density_geometric=old,source_energy_density_cgs=Etarget,roundtrip_relative=abs(back/Etarget-1),axes_ratio=b['axes_ratio'])
          (d/'density_transfer.json').write_text(json.dumps(report,indent=2))
          print('DENSITY_TRANSFER',json.dumps(report))
          par=d/'control.par';s=par.read_text()
          s,k=re.subn(r'^Hydro_RNSID::rho_central\s*=.*$',f'Hydro_RNSID::rho_central = {new:.17e}',s,flags=re.M)
          assert k==1
          par.write_text(s)
          PY
      - name: Apply isolated spin retarget candidate from measured successful equilibrium
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,re,pathlib
          d=pathlib.Path('evidence')
          p=d/'control.par'
          s=p.read_text()
          original=json.loads((d/'bridge.json').read_text())['axes_ratio']
          target=346.536369
          measured=347.1647363180208
          # Slow-rotation first-order estimate: flattening proportional to omega^2.
          # This is a candidate; actual native frequency, M and J are the gates.
          trial=os.environ['TRIAL']
          assert trial in ('original','retarget')
          q=1-(1-original)*(target/measured)**2 if trial=='retarget' else original
          assert original<=q<1 and q-original<0.001
          s,n=re.subn(r'^Hydro_RNSID::axes_ratio\s*=.*$',f'Hydro_RNSID::axes_ratio = {q:.17e}',s,flags=re.M)
          assert n==1
          p.write_text(s)
          (d/'spin_trial.json').write_text(json.dumps(dict(trial=trial,original=original,applied=q,target_hz=target,baseline_hz=measured,scope='candidate retarget, measured native match required'),indent=2))
          PY
      - name: Match atmosphere thermodynamics to active MPA1 at unchanged floor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,math,numpy as np,re,json
          d=pathlib.Path('evidence')
          p=d/'control.par'; s=p.read_text()
          floor=1e-12
          for key in ('GRHydro::rho_abs_min','Hydro_RNSID::rns_rho_min'):
              m=re.findall(r'^'+re.escape(key)+r'\s*=\s*([0-9.eE+-]+)',s,re.M|re.I)
              assert len(m)==1 and float(m[0])==floor,(key,m)
          with (d/'mpa1_eos_omni_fixed.dat').open() as inp:
              header=[next(inp).rstrip('\n') for _ in range(7)]
              tab=np.loadtxt(inp)
          lo,hi=float(header[2][9:16]),float(header[2][25:32])
