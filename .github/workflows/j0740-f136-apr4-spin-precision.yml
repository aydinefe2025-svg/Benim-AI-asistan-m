name: J0740 F136 original APR4 SetSpin precision diagnostic
on:
  pull_request:
    branches: [science/j0740-apr4-firstlaw-gr-pilot-20261117]
    paths:
      - 'research/j0740/f136/**'
      - '.github/workflows/j0740-f136-apr4-spin-precision.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native_spin_precision:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rns-alberta/rns
          ref: 97e85d325a33e37f702306414533f6cd77812477
          path: rns-upstream
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: nuclear-multimessenger-astronomy/jester
          ref: e6768650ce992abfd1153a6833857572fe5cd230
          path: jester-upstream
          sparse-checkout: |
            jesterTOV/tabulated_eos/lalsuite/APR4_EPP.npz
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy==2.3.5' 'scipy==1.16.3'
      - name: Source and negative-control check
        run: |
          set -euo pipefail
          echo '639c5381d49e13383c553771725f935b292e8ef7ff23367bd399a2bb9a3b7b88  jester-upstream/jesterTOV/tabulated_eos/lalsuite/APR4_EPP.npz' | sha256sum -c -
          python - <<'PY'
          from research.j0740.f136.f136_apr4_spin_precision import patch_spin_source,OLD
          assert patch_spin_source('prefix '+OLD+' suffix').count('double ans')==1
          try:patch_spin_source('no exact source')
          except ValueError:pass
          else:raise AssertionError('source drift accepted')
          PY
      - name: Patch output only and isolated SetSpin numerical root variables
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys,hashlib,json
          sys.path.insert(0,'research/j0740/f63')
          from f63_original_mpa1_fixed_J import patch_output_only
          p=Path('rns-upstream/rns.c');raw=p.read_bytes();p.write_bytes(patch_output_only(raw.decode('utf8')).encode('utf8'))
          d=Path('results/F136');d.mkdir(parents=True,exist_ok=True)
          (d/'C_output_patch.json').write_text(json.dumps({'upstream_rns_c_sha256':hashlib.sha256(raw).hexdigest(),'patched_rns_c_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'physics_equations_unchanged':True},indent=2)+'\n')
          PY
          python research/j0740/f136/f136_apr4_spin_precision.py --mode patch --findmodel rns-upstream/findmodel.c --out results/F136/SetSpin_precision_patch.json
      - name: Compile genuine C RNS with isolated numeric precision change
        run: make -C rns-upstream CC='gcc -include stdlib.h' rns
      - name: Compare -s spin anchor with direct -r fixed J at same density
        run: |
          python -u research/j0740/f136/f136_apr4_spin_precision.py --mode measure \
            --source jester-upstream/jesterTOV/tabulated_eos/lalsuite/APR4_EPP.npz \
            --rns rns-upstream/rns --out results/F136/F136_ORIGINAL_APR4_SPIN_VS_J.json
      - name: Save hashes even if source calculation fails
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          d=Path('results/F136');d.mkdir(parents=True,exist_ok=True)
          paths=[*d.glob('*.json'),*d.glob('*.rns'),Path('rns-upstream/rns'),Path('rns-upstream/rns.c'),Path('rns-upstream/findmodel.c')]
          (d/'F136_SHA256.json').write_text(json.dumps({str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in paths if p.is_file()},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: J0740-F136-original-APR4-SetSpin-precision-real-C
          path: results/F136/
          if-no-files-found: warn
