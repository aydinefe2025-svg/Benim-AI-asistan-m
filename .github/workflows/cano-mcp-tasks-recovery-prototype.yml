name: CANO MCP Tasks crash-recovery prototype (test only)

on:
  pull_request:
    branches:
      - fix/sqlite-backup-restore-20261031
    paths:
      - 'integration/mcp-tasks-recovery-prototype/**'
      - '.github/workflows/cano-mcp-tasks-recovery-prototype.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  task-recovery:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ['24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run isolated crash-recovery protocol test
        working-directory: integration/mcp-tasks-recovery-prototype
        run: npm test
