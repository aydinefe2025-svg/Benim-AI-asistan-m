name: Battery Figshare source stage-serial sidecar crosswalk
on:
  pull_request:
    paths:
      - 'research/battery_curve_audit/figshare_identity_provenance.py'
      - 'tests/test_battery_figshare_identity_provenance.py'
      - '.github/workflows/battery-figshare-three-identity-crosswalk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-original-three-cell-source-crosswalk:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout immutable tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run fail-closed synthetic metadata identity tests
        run: python -m unittest tests.test_battery_figshare_identity_provenance -v
      - name: Query actual publisher's 279-row overview and three MD5-verifiable source sidecars
        run: |
          python -m research.battery_curve_audit.figshare_identity_provenance \
            /tmp/cano_figshare_original_source_identity_crosswalk.json
      - name: No fabricated site or physical identity acceptance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/cano_figshare_original_source_identity_crosswalk.json').read_text())
          assert d['publisher_article_id']==25975315
          assert d['overview_original_publisher_md5_matches'] is True
          assert d['overview_rows']==279
          assert d['composite_stage_serial_key_rows']==279
          assert d['all_archive_md5_crc_verified'] is True
          assert len(d['publisher_archive_identities'])==3
          assert all(r['paired_meta_sha256'] for r in d['publisher_archive_identities'])
          assert d['physical_cells_independently_authenticated']==0
          assert d['independent_lab_institution_authenticated'] is False
          assert d['field_FPR_FNR_established'] is False
          assert d['field_acceptance']=='NOT_ESTABLISHED'
          assert d['production_release_allowed'] is False
          print('ORIGINAL_SOURCE_CROSSWALK', d['overview_source_names_joined'],
                d['sidecar_lab_and_internal_fields_both_matched'],
                [r['decision'] for r in d['publisher_archive_identities']])
          PY
      - name: Store only original source public label names and anonymous aggregate checks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cano-figshare-original-three-source-identity-crosswalk
          path: /tmp/cano_figshare_original_source_identity_crosswalk.json
          retention-days: 7
          if-no-files-found: error