name: Battery Bayreuth independent original source preflight
on:
  pull_request:
    paths:
      - 'research/battery_curve_audit/bayreuth_two_cell_independent_integral.py'
      - 'tests/test_bayreuth_two_cell_independent_integral.py'
      - 'research/battery_curve_audit/bayreuth_external_archive_preflight.py'
      - 'tests/test_bayreuth_external_archive_preflight.py'
      - '.github/workflows/battery-bayreuth-external-original-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-two-cells:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Exact source checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fail-closed source and integration tests, standard library only
        run: python -m unittest tests.test_bayreuth_external_archive_preflight tests.test_bayreuth_two_cell_independent_integral -v
      - name: Acquire TWO genuine source cells and independently integrate signed current over measured time
        run: |
          python -m research.battery_curve_audit.bayreuth_two_cell_independent_integral /tmp/cano_bayreuth_2cell_source_coulometry.json
      - name: Bound claims and check original actual current-time observations
        run: |
          python - <<'PY'
          import json
          x=json.load(open('/tmp/cano_bayreuth_2cell_source_coulometry.json',encoding='utf-8'))
          assert x['source_doi']=='10.5281/zenodo.15755725'
          assert x['distinct_original_source_cells']==2
          assert set(x['cell_ids'])=={'F0001','F0002'}
          assert x['not_an_instrument_calibration']
          assert x['not_48_cells_processed']
          assert x['not_same_cells_as_Stroebl']
          assert x['not_population_aging_certification']
          assert x['original_total_checkup_numeric_rows']>200000
          for name,expected_md5 in (('F0001','8181a89aee2e525ca52b60491ee3209b'),('F0002','3eaca9d8eff8ccf2d1caf55575a3af76')):
              q=x['comparison'][name]
              assert q['zip_crc_pass'] and q['source_zip_md5']==expected_md5
              for stage in ('beginning','ending'):
                  p=q['checkup_profiles'][stage]
                  assert p['rows_parsed']>500
              for phase in ('discharge','charge'):
                  c=q['paired_measurement'][phase]
                  assert c.get('comparable_same_command_line'), (name,phase,c)
                  assert c['not_a_certified_capacity_loss']
                  assert abs(c['source_step_delta_mAh'])<1000
                  assert abs(c['independently_integrated_trapezoid_delta_mAh'])<1000
          print('TWO_REAL_BAYREUTH_CELLS_ORIGINAL_MD5_CRC_AND_NUMERIC_CURRENT_TIME_INTEGRATION_PASS',x['original_total_checkup_numeric_rows'])
          PY
      - name: Upload numeric evidence only, not two raw publisher ZIPs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bayreuth-2025-two-original-cells-F0001-F0002-native-current-time-coulometry
          path: /tmp/cano_bayreuth_2cell_source_coulometry.json
          retention-days: 7
          if-no-files-found: error