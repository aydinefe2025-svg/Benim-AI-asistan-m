name: Battery Bayreuth independent original source preflight
on:
  pull_request:
    paths:
      - 'research/battery_curve_audit/bayreuth_external_archive_preflight.py'
      - 'tests/test_bayreuth_external_archive_preflight.py'
      - '.github/workflows/battery-bayreuth-external-original-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publisher-original-F0001-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Exact source checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Local fail-closed tests, no NumPy or SciPy
        run: python -m unittest tests.test_bayreuth_external_archive_preflight -v
      - name: Download original Bayreuth cell F0001 from publisher and enforce MD5 plus full ZIP CRC
        run: |
          python -m research.battery_curve_audit.bayreuth_external_archive_preflight /tmp/cano_bayreuth_F0001_independent_original_preflight.json
      - name: Verify original-source evidence scope is honestly bounded
        run: |
          python - <<'PY'
          import json
          p='/tmp/cano_bayreuth_F0001_independent_original_preflight.json'
          x=json.load(open(p,encoding='utf-8'))
          assert x['source_doi']=='10.5281/zenodo.15755725'
          assert x['source_publisher_md5']=='8181a89aee2e525ca52b60491ee3209b'
          assert x['zip_crc_all_pass'] is True
          assert x['zip_file_count']>=1
          assert x['cells_with_downloaded_original_zip']==1
          assert x['cells_reported_in_dataset_by_publishers']==48
          assert x['actual_DCIR_or_capacity_recalculated'] is False
          assert x['independent_lab_validation_of_original_Stroebl_4_cells'] is False
          assert x['physical_calibration_certificate_verified'] is False
          print('NEW_INDEPENDENT_BAYREUTH_ORIGINAL_F0001_VERIFIED_NO_CAUSAL_CLAIMS',x['source_byte_count'])
          PY
      - name: Upload bounded anonymous structure and integrity manifest, not raw ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: independent-bayreuth-2025-original-F0001-manifest
          path: /tmp/cano_bayreuth_F0001_independent_original_preflight.json
          retention-days: 7
          if-no-files-found: error