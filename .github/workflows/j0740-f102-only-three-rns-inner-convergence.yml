name: J0740 F102 retry only three unresolved native C roots with tighter equilibrium convergence
on:
  pull_request:
    branches:
      - science/j0740-apr4-firstlaw-gr-pilot-20261117
    paths:
      - 'research/j0740/f102/**'
      - '.github/workflows/j0740-f102-only-three-rns-inner-convergence.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  three_unresolved_native_c_roots_only:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rns-alberta/rns
          ref: 97e85d325a33e37f702306414533f6cd77812477
          path: rns-upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin numerical dependencies
        run: python -m pip install 'numpy==2.3.5' 'scipy==1.16.3'
      - name: Retrieve original immutable F100 and F101 source-native receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p results/F88 results/F99 results/F100 results/F101 results/F102
          gh run download 44818195695 -R "$GITHUB_REPOSITORY" -n J0740-F88-ACTUAL-ORIGINAL-APR-C-RNS-TWO-GRID -D results/F88
          gh run download 45008924540 -R "$GITHUB_REPOSITORY" -n J0740-F100-F99-DERIVED-COLD-GR-STATIC-MASSMAX-RADIAL-ZERO-REAL-ROTATING-C-28-STARS -D results/F100
          gh run download 45010831926 -R "$GITHUB_REPOSITORY" -n J0740-F101-ONLY-FOUR-GENUINE-EINSTEIN-C-DOUBLE-RIDDER-PRECISION-RECOVERY -D results/F101
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('results/F100/F100_REAL_NEW_28_TWO_GRID_EINSTEIN_C_STARS.json')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='2f60a33262319a50af39d03641eb0a52375037450964d0f3206ae8687712506f'
          m=json.loads(Path('results/F101/F101_ORIGINAL_24_PLUS_NEW_4_REAL_SOURCE_EINSTEIN_C_SHA256_MANIFEST.json').read_text())
          for n in ('F101_ONLY_MISSING_ORIGINAL_F100_REAL_C_201x401.jsonl','F101_F100_28_COMBINED_ORIGINAL_AND_PRECISION_RECOVERED_TRUE_C_STARS.json'):
           assert hashlib.sha256((Path('results/F101')/n).read_bytes()).hexdigest()==m[n]['sha256']
          print('F100_F101_IMMUTABLE_SOURCE_RECEIPTS_SHA_PASS')
          PY
      - name: Regenerate exact existing F99 derived EOS from pinned APR source
        run: |
          set -euo pipefail
          python research/j0740/f99/f99_physical_firstlaw_source_no_go_derived_eos.py --source results/F88/m.rns --out m102.rns --report results/F102/F102_REUSED_F99_SOURCE_EOS.json
          printf '%s  %s\n' c99eadee07bf6cbbf78f59b6171ef7e21ffad7d034f4ca4e9b7d85d36d9b4331 m102.rns | sha256sum -c -
      - name: Change only numerical precision and inner equilibrium convergence tolerance
        run: |
          set -euo pipefail
          test "$(git -C rns-upstream rev-parse HEAD)" = '97e85d325a33e37f702306414533f6cd77812477'
          cp -a rns-upstream rns151
          cp -a rns-upstream rns201
          python research/j0740/f102/f102_patch_rns_convergence_only.py rns151/findmodel.c rns201/findmodel.c | tee results/F102/F102_EXACT_SOURCE_NUMERICAL_PATCH_SHA.json
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'research/j0740/f81')
          from f81_exact_mass_spin import patch_print_only
          for name,grid in (('rns151','151x301'),('rns201','201x401')):
           p=Path(name)/'rns.c';p.write_text(patch_print_only(p.read_text()))
           make=Path(name)/'makefile';s=make.read_text();old='HIGHSIZE=-DMDIV=151 -DSDIV=301'
           assert s.splitlines().count(old)==1
           if grid=='201x401':make.write_text(s.replace(old,'HIGHSIZE=-DMDIV=201 -DSDIV=401',1))
          PY
          make -C rns151 CC='gcc -include stdlib.h' rns
          make -C rns201 CC='gcc -include stdlib.h' rns
          sha256sum rns151/rns rns201/rns | tee results/F102/F102_NATIVE_C_BINARIES_SHA256.txt
      - name: Retry only three unresolved original F100 points; reuse the one real recovered C root
        run: |
          set -euo pipefail
          python -u research/j0740/f102/f102_retry_only_three_failed.py \
            --original results/F100/F100_REAL_NEW_28_TWO_GRID_EINSTEIN_C_STARS.json \
            --eos m102.rns \
            --f101-201-log results/F101/F101_ONLY_MISSING_ORIGINAL_F100_REAL_C_201x401.jsonl \
            --rns151 "$GITHUB_WORKSPACE/rns151/rns" \
            --rns201 "$GITHUB_WORKSPACE/rns201/rns" \
            --out results/F102/F102_28_REAL_C_TWO_GRID_RECOVERY.json \
            2>&1 | tee results/F102/F102_ONLY_THREE_UNRESOLVED_NATIVE_C_ROOTS.log
      - name: Retain only actual source-native numerical results, including failure receipts
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          d=Path('results/F102');d.mkdir(parents=True,exist_ok=True)
          m={p.name:{'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'bytes':p.stat().st_size} for p in sorted(d.iterdir()) if p.is_file()}
          (d/'F102_SHA256_MANIFEST.json').write_text(json.dumps(m,indent=2)+'\n')
          PY
      - name: Upload F102 real C results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: J0740-F102-THREE-UNRESOLVED-REAL-C-ROOTS-ACCURACY-ONLY
          path: results/F102/
          if-no-files-found: warn
