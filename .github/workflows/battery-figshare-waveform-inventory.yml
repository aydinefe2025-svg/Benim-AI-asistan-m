name: Battery Figshare 279 real waveform archive inventory
on:
  pull_request:
    paths:
      - 'research/battery_curve_audit/figshare_waveform_inventory.py'
      - 'tests/test_figshare_waveform_inventory.py'
      - '.github/workflows/battery-figshare-waveform-inventory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-official-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout immutable PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fail-closed synthetic metadata and budget tests
        run: python -m unittest tests.test_figshare_waveform_inventory -v
      - name: Query publisher API only; never download raw waveforms
        run: |
          python -m research.battery_curve_audit.figshare_waveform_inventory \
            /tmp/cano_figshare279_waveform_inventory.json
      - name: No inference of physical independence from names or archive counts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/cano_figshare279_waveform_inventory.json').read_text())
          assert d['publisher_article_id']==25975315
          assert d['license']=='CC_BY_4_0_PUBLISHER_METADATA'
          assert d['publisher_file_count']>1
          assert d['publisher_listed_total_bytes']>0
          assert d['original_waveform_files_downloaded']==0
          assert d['independent_physical_cells_verified']==0
          assert d['waveform_cell_id_link_verified'] is False
          assert d['field_false_match_rate_established'] is False
          assert d['production_release_allowed'] is False
          assert all(x['size_bytes']<=80_000_000 for x in d['bounded_candidates_first_20'])
          print('PUBLISHER_INVENTORY_ONLY',d['bounded_archive_candidates_count'],
                d['smallest_potential_signal_file_bytes'],d['decision'])
          PY
      - name: Retain source-identifying bounded metadata receipt only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: battery-figshare279-bounded-archive-candidates
          path: /tmp/cano_figshare279_waveform_inventory.json
          retention-days: 7
          if-no-files-found: error
