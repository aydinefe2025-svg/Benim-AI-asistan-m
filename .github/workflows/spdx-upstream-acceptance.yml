name: SPDX original-upstream integration (isolated research)
on:
  pull_request:
    paths:
      - "research/opportunities/spdx_upstream_acceptance.py"
      - "research/opportunities/spdx_validation_pipeline.py"
      - "research/opportunities/spdx_fixture_matrix_24.py"
      - ".github/workflows/spdx-upstream-acceptance.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-pinned-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - name: Install exact validator version
        run: python -m pip install "jsonschema==4.26.0"
      - name: Real upstream merge + official SPDX JSON Schema
        run: |
          python research/opportunities/spdx_validation_pipeline.py --output spdx-acceptance-results.json
      - name: Preserve inspectable acceptance receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: spdx-upstream-acceptance
          path: spdx-acceptance-results.json
          if-no-files-found: warn
          retention-days: 14
