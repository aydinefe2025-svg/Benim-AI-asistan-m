name: J0740 F105 source-native fifth-mesh local fixed-J peak probe
on:
  pull_request:
    branches:
      - science/j0740-apr4-firstlaw-gr-pilot-20261117
    paths:
      - 'research/j0740/f105/**'
      - 'research/j0740/f106/**'
      - '.github/workflows/j0740-f105-fifth-mesh-fixed-j-peak-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  fifth_mesh_native_c_probe:
    if: ${{ !contains(github.event.pull_request.title, 'F106') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rns-alberta/rns
          ref: 97e85d325a33e37f702306414533f6cd77812477
          path: rns-upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical dependencies
        run: python -m pip install 'numpy==2.3.5' 'scipy==1.16.3'
      - name: Retrieve and lock F103 evidence and the original publisher APR input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p results/F88 results/F103 results/F104 results/F105
          curl -fLsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14751094327/zip" -o results/F103/F103_artifact.zip
          printf '%s  %s\n' 1491d406b68886522c514c7a08e40ef6e673cf8d48e86c6666c390a96eb11f30 results/F103/F103_artifact.zip | sha256sum -c -
          python -m zipfile -e results/F103/F103_artifact.zip results/F103
          curl -fLsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14751873260/zip" -o results/F104/F104_artifact.zip
          printf '%s  %s\n' b36198ac43fbd786cb1a7bc0022a7c69e35f30160242d0e2d28bbc0f662fcf02 results/F104/F104_artifact.zip | sha256sum -c -
          python -m zipfile -e results/F104/F104_artifact.zip results/F104
          gh run download 44818195695 -R "$GITHUB_REPOSITORY" -n J0740-F88-ACTUAL-ORIGINAL-APR-C-RNS-TWO-GRID -D results/F88
          printf '%s  %s\n' 8338af81270a87c93f19c28df86fbaac5618296aff6535177eb41052c77dcb12 results/F88/F87_verified_publisher_original.zip | sha256sum -c -
          printf '%s  %s\n' 7643d0e4361adee77cc79d1b69eb445db70a52443b833c4dddafa973193fb580 results/F88/m.rns | sha256sum -c -
      - name: Independently verify prior 251x501 C points, all raw calls, and F102 baseline
        env:
          F103_ARTIFACT_ZIP: results/F103/F103_artifact.zip
          F104_ARTIFACT_ZIP: results/F104/F104_artifact.zip
        run: |
          set -euo pipefail
          python -m unittest discover -s research/j0740/f105 -p 'test_f105_*.py' -v
          python - <<'PY'
          import os
          from pathlib import Path
          from research.j0740.f105.f105_fifth_mesh_peak_probe import read_baseline
          prior,base=read_baseline(Path(os.environ['F103_ARTIFACT_ZIP']))
          from research.j0740.f105.f105_fifth_mesh_peak_probe import read_f104
          prior4=read_f104(Path(os.environ['F104_ARTIFACT_ZIP']))
          assert len(prior4['new_native_C_stars']) == 7
          assert len(prior['new_native_C_stars']) == 7
          assert sum(len(v['stars']) for v in base['both_native_C_grids'].values()) == 28
          print('F105_F103_SEVEN_NATIVE_C_AND_F102_28_NATIVE_C_LOCKED')
          PY
      - name: Restore exact pinned F99 EOS bytes after verified original-source input
        run: |
          set -euo pipefail
          cp research/j0740/f104/F99_DERIVED_1981_node_causal_cold_affine_EOS.rns m99.rns
          printf '%s  %s\n' c99eadee07bf6cbbf78f59b6171ef7e21ffad7d034f4ca4e9b7d85d36d9b4331 m99.rns | sha256sum -c -
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p=Path('m99.rns')
          report={'status':'EXACT_PINNED_F99_DERIVED_EOS_RESTORED','sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'source_publisher_m_rns_sha256':'7643d0e4361adee77cc79d1b69eb445db70a52443b833c4dddafa973193fb580','reproduction_note':'Exact derived bytes are committed and checksum-verified; they are not re-derived with host-dependent NumPy exp during F105.'}
          Path('results/F105/F105_REUSE_F99_EOS.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - name: Compile pinned original Einstein RNS C on distinct 401x801 mesh
        run: |
          set -euo pipefail
          test "$(git -C rns-upstream rev-parse HEAD)" = '97e85d325a33e37f702306414533f6cd77812477'
          cp -a rns-upstream rns401
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0,'research/j0740/f81')
          from f81_exact_mass_spin import patch_print_only
          p=Path('rns401/rns.c')
          p.write_text(patch_print_only(p.read_text()))
          mf=Path('rns401/makefile')
          t=mf.read_text()
          old='HIGHSIZE=-DMDIV=151 -DSDIV=301'
          assert t.splitlines().count(old)==1
          mf.write_text(t.replace(old,'HIGHSIZE=-DMDIV=401 -DSDIV=801',1))
          src=Path('rns401/findmodel.c').read_bytes()
          assert b'float ans, fh,fl,fm,fnew,sroot,xh,xl,xm,xnew,xacc=1e-5;' in src
          PY
          make -C rns401 CC='gcc -include stdlib.h' rns
          sha256sum rns401/rns | tee results/F105/F105_NATIVE_C_BINARY_SHA256.txt
      - name: Run only the seven preselected F103 local densities on 401x801 native C
        run: |
          set -euo pipefail
          OPENBLAS_NUM_THREADS=1 python -u research/j0740/f105/f105_fifth_mesh_peak_probe.py             --f103 results/F103/F103_artifact.zip --f104 results/F104/F104_artifact.zip --eos m99.rns             --rns "$GITHUB_WORKSPACE/rns401/rns"             --out results/F105/F105_401x801_LOCAL_PEAK.json             2>&1 | tee results/F105/F105_NATIVE_C_ROOTS.log
      - name: Preserve only new F105 source-C trace and prior immutable baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: J0740-F105-401x801-fifth-mesh-native-fixedJ-local-peak
          path: |
            results/F105/
            results/F103/F103_artifact.zip
            results/F104/F104_artifact.zip
            results/F104/F104/F104_301x601_LOCAL_PEAK.json
            results/F104/F104/F104_301x601_LOCAL_PEAK.jsonl
            results/F103/F103/F103_251x501_LOCAL_PEAK.json
            results/F103/F103/F103_251x501_LOCAL_PEAK.jsonl
            results/F102/F102/F102_ORIGINAL_24_PLUS_F101_1_PLUS_F102_3_REAL_C_STARS.json
          if-no-files-found: warn
  sixth_mesh_native_c_probe:
    if: ${{ contains(github.event.pull_request.title, 'F106') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rns-alberta/rns
          ref: 97e85d325a33e37f702306414533f6cd77812477
          path: rns-upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical dependencies
        run: python -m pip install 'numpy==2.3.5' 'scipy==1.16.3'
      - name: Retrieve and lock F103 evidence and the original publisher APR input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p results/F88 results/F103 results/F104 results/F105 results/F106
          curl -fLsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14751094327/zip" -o results/F103/F103_artifact.zip
          printf '%s  %s\n' 1491d406b68886522c514c7a08e40ef6e673cf8d48e86c6666c390a96eb11f30 results/F103/F103_artifact.zip | sha256sum -c -
          python -m zipfile -e results/F103/F103_artifact.zip results/F103
          curl -fLsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14751873260/zip" -o results/F104/F104_artifact.zip
          printf '%s  %s\n' b36198ac43fbd786cb1a7bc0022a7c69e35f30160242d0e2d28bbc0f662fcf02 results/F104/F104_artifact.zip | sha256sum -c -
          python -m zipfile -e results/F104/F104_artifact.zip results/F104
          curl -fLsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14752851236/zip" -o results/F105/F105_failed_artifact.zip
          printf '%s  %s\n' c6d2de2ad7ade68a87e2efd9ff79300faf55d8745a4e2b62abb22ce3216b5de0 results/F105/F105_failed_artifact.zip | sha256sum -c -
          gh run download 44818195695 -R "$GITHUB_REPOSITORY" -n J0740-F88-ACTUAL-ORIGINAL-APR-C-RNS-TWO-GRID -D results/F88
          printf '%s  %s\n' 8338af81270a87c93f19c28df86fbaac5618296aff6535177eb41052c77dcb12 results/F88/F87_verified_publisher_original.zip | sha256sum -c -
          printf '%s  %s\n' 7643d0e4361adee77cc79d1b69eb445db70a52443b833c4dddafa973193fb580 results/F88/m.rns | sha256sum -c -
      - name: Independently verify prior 251x501 C points, all raw calls, and F102 baseline
        env:
          F103_ARTIFACT_ZIP: results/F103/F103_artifact.zip
          F104_ARTIFACT_ZIP: results/F104/F104_artifact.zip
          F105_ARTIFACT_ZIP: results/F105/F105_failed_artifact.zip
        run: |
          set -euo pipefail
          python -m unittest discover -s research/j0740/f106 -p 'test_f106_*.py' -v
          python - <<'PY'
          import os
          from pathlib import Path
          from research.j0740.f106.f106_sixth_mesh_peak_probe import read_baseline
          prior,base=read_baseline(Path(os.environ['F103_ARTIFACT_ZIP']))
          from research.j0740.f106.f106_sixth_mesh_peak_probe import read_f104
          from research.j0740.f106.f106_sixth_mesh_peak_probe import read_f105_failed
          prior4=read_f104(Path(os.environ['F104_ARTIFACT_ZIP']))
          prior5=read_f105_failed(Path(os.environ['F105_ARTIFACT_ZIP']))
          assert prior5['status']=='FAIL_CLOSED'
          assert len(prior4['new_native_C_stars']) == 7
          assert len(prior['new_native_C_stars']) == 7
          assert sum(len(v['stars']) for v in base['both_native_C_grids'].values()) == 28
          print('F106_F103_F104_AND_F105_FAILURE_LOCKED')
          PY
      - name: Restore exact pinned F99 EOS bytes after verified original-source input
        run: |
          set -euo pipefail
          cp research/j0740/f104/F99_DERIVED_1981_node_causal_cold_affine_EOS.rns m99.rns
          printf '%s  %s\n' c99eadee07bf6cbbf78f59b6171ef7e21ffad7d034f4ca4e9b7d85d36d9b4331 m99.rns | sha256sum -c -
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p=Path('m99.rns')
          report={'status':'EXACT_PINNED_F99_DERIVED_EOS_RESTORED','sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'source_publisher_m_rns_sha256':'7643d0e4361adee77cc79d1b69eb445db70a52443b833c4dddafa973193fb580','reproduction_note':'Exact derived bytes are committed and checksum-verified; they are not re-derived with host-dependent NumPy exp during F106.'}
          Path('results/F106/F106_REUSE_F99_EOS.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - name: Compile pinned original Einstein RNS C on distinct 501x1001 mesh
        run: |
          set -euo pipefail
          test "$(git -C rns-upstream rev-parse HEAD)" = '97e85d325a33e37f702306414533f6cd77812477'
          cp -a rns-upstream rns501
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0,'research/j0740/f81')
          from f81_exact_mass_spin import patch_print_only
          p=Path('rns501/rns.c')
          p.write_text(patch_print_only(p.read_text()))
          mf=Path('rns501/makefile')
          t=mf.read_text()
          old='HIGHSIZE=-DMDIV=151 -DSDIV=301'
          assert t.splitlines().count(old)==1
          mf.write_text(t.replace(old,'HIGHSIZE=-DMDIV=501 -DSDIV=1001',1))
          src=Path('rns501/findmodel.c').read_bytes()
          assert b'float ans, fh,fl,fm,fnew,sroot,xh,xl,xm,xnew,xacc=1e-5;' in src
          PY
          make -C rns501 CC='gcc -include stdlib.h' rns
          sha256sum rns501/rns | tee results/F106/F106_NATIVE_C_BINARY_SHA256.txt
      - name: Run only the seven preselected F103 local densities on 501x1001 native C
        run: |
          set -euo pipefail
          OPENBLAS_NUM_THREADS=1 python -u research/j0740/f106/f106_sixth_mesh_peak_probe.py             --f103 results/F103/F103_artifact.zip --f104 results/F104/F104_artifact.zip --f105 results/F105/F105_failed_artifact.zip --eos m99.rns             --rns "$GITHUB_WORKSPACE/rns501/rns"             --out results/F106/F106_501x1001_LOCAL_PEAK.json             2>&1 | tee results/F106/F106_NATIVE_C_ROOTS.log
      - name: Preserve only new F106 source-C trace and prior immutable baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: J0740-F106-501x1001-sixth-mesh-native-fixedJ-local-peak
          path: |
            results/F106/
            results/F103/F103_artifact.zip
            results/F104/F104_artifact.zip
            results/F105/F105_failed_artifact.zip
            results/F104/F104/F104_301x601_LOCAL_PEAK.json
            results/F104/F104/F104_301x601_LOCAL_PEAK.jsonl
            results/F103/F103/F103_251x501_LOCAL_PEAK.json
            results/F103/F103/F103_251x501_LOCAL_PEAK.jsonl
            results/F102/F102/F102_ORIGINAL_24_PLUS_F101_1_PLUS_F102_3_REAL_C_STARS.json
          if-no-files-found: warn
