name: CANO colony continuation

on:
  workflow_run:
    workflows:
      - CANO scheduled colony cycle
    types:
      - completed
    branches:
      - main

# The continuation token can only dispatch a workflow in this repository.
permissions: {}

concurrency:
  group: cano-colony-continuation
  cancel-in-progress: false

jobs:
  continue:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: write
    steps:
      - name: Wait before the next bounded cycle
        run: sleep 900

      - name: Continue only if no newer cycle has started
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/cano-colony-cycle.yml/runs?per_page=1"
          latest_run_id="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}" | jq -r '.workflow_runs[0].id // empty')"

          if [[ "${latest_run_id}" != "${SOURCE_RUN_ID}" ]]; then
            echo "A newer colony run exists; its completion will own the next continuation."
            exit 0
          fi

          status="$(curl --silent --show-error -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/cano-colony-cycle.yml/dispatches" \
            -d '{"ref":"main"}')"

          if [[ "${status}" != "204" ]]; then
            echo "workflow_dispatch returned HTTP ${status}"
            exit 1
          fi
          echo "Next bounded colony cycle dispatched."
