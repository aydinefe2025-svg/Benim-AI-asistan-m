name: CANO colony continuation

on:
  workflow_run:
    workflows:
      - CANO scheduled colony cycle
    types:
      - completed
    branches:
      - main

permissions: {}

concurrency:
  group: cano-colony-continuation
  cancel-in-progress: false

jobs:
  continue:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Verify the source run published a validated report
        id: report
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          report_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/cano-latest/colony-cycle.json"
          report_file="$(mktemp)"
          trap 'rm -f "${report_file}"' EXIT
          curl --fail --silent --show-error --max-time 15 "${report_url}" --output "${report_file}"
          python scripts/cano_continuation_gate.py \
            --report "${report_file}" \
            --source-run-id "${SOURCE_RUN_ID}" \
            --output "${GITHUB_OUTPUT}"

      - name: Run a fixed two-attempt follow-up batch
        if: steps.report.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api_root="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          runs_url="${api_root}/actions/workflows/cano-colony-cycle.yml/runs?branch=main&per_page=1"

          # The fixed loop caps each validated source report at two extra dispatches.
          # This workflow never dispatches itself.
          for attempt in 1 2; do
            echo "Bounded follow-up attempt ${attempt}/2."
            sleep 900

            latest="$(curl --fail --silent --show-error --max-time 15 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${runs_url}")"
            latest_status="$(jq -r '.workflow_runs[0].status // empty' <<<"${latest}")"
            created_at="$(jq -r '.workflow_runs[0].created_at // empty' <<<"${latest}")"

            if [[ "${latest_status}" != "completed" || -z "${created_at}" ]]; then
              echo "Latest cycle is absent or still running; skipping attempt ${attempt}."
              continue
            fi

            created_epoch="$(date -u -d "${created_at}" +%s)"
            now_epoch="$(date -u +%s)"
            age_seconds=$((now_epoch - created_epoch))
            if (( age_seconds < 840 )); then
              echo "Latest cycle is too recent; skipping attempt ${attempt}."
              continue
            fi

            status="$(curl --silent --show-error --max-time 15 -o /dev/null -w "%{http_code}" \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              "${api_root}/actions/workflows/cano-colony-cycle.yml/dispatches" \
              -d '{"ref":"main"}')"

            if [[ "${status}" != "204" ]]; then
              echo "workflow_dispatch returned HTTP ${status}"
              exit 1
            fi
            echo "Follow-up attempt ${attempt}/2 dispatched."
          done

          echo "Follow-up batch ended; the fixed two-attempt budget is exhausted."
