name: Battery Graz 2026 five-cell publisher original preflight
on:
  pull_request:
    paths:
      - 'research/battery_curve_audit/graz_five_cell_original_preflight.py'
      - 'tests/test_graz_five_cell_original_preflight.py'
      - '.github/workflows/battery-graz-five-original-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fail-closed offline synthetic validation
        run: python -m unittest tests.test_graz_five_cell_original_preflight -v
      - name: Fetch real five-cell Graz publisher original and check MD5 bytes CRC and file headers
        run: python -m research.battery_curve_audit.graz_five_cell_original_preflight /tmp/graz_five_cell_original_source_evidence.json
      - name: Verify scientific guardrails
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/graz_five_cell_original_source_evidence.json',encoding='utf-8'))
          assert d['publisher_record_doi']=='10.5281/zenodo.22079387'
          assert d['publisher_md5']==d['recomputed_source_md5']=='b9ed863766e30afbd0e309951c855d08'
          assert d['source_byte_integrity_verified'] and d['archive_structure']['zip_crc_all_members_pass']
          assert d['archive_structure']['file_count']>=1
          assert d['static_preload_not_dynamic_impact']
          for k in ['cell_id_time_series_join_verified','source_column_units_verified',
                    'source_capacity_recomputed','individual_force_thickness_calibration_verified',
                    'same_samples_as_four_cell_older_record_proven']:
              assert d[k] is False, k
          assert d['not_a_qualified_capacity_or_safety_model']
          print("GRAZ_REAL_SOURCE_PREFLIGHT_ACCEPTED_NO_CAUSAL_CLAIMS")
          PY
      - name: Store only evidence, not publisher original raw ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: graz-2026-five-physical-cell-original-zip-structure-evidence
          path: /tmp/graz_five_cell_original_source_evidence.json
          if-no-files-found: error
          retention-days: 7
