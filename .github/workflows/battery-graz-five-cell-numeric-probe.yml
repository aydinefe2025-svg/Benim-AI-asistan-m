name: Battery Graz five-cell original time and electrical fields
on:
  pull_request:
    paths:
      - 'research/battery_curve_audit/graz_five_cell_numeric_probe.py'
      - 'tests/test_graz_five_cell_numeric_probe.py'
      - '.github/workflows/battery-graz-five-cell-numeric-probe.yml'
      - 'research/battery_curve_audit/graz_five_cell_original_preflight.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  genuine-five-cell-electrical-channel-parse:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fail-closed timestamp and SP header fixture tests
        run: python -m unittest tests.test_graz_five_cell_numeric_probe -v
      - name: Original publisher ZIP five-cell raw current-time fields and SP metadata
        run: python -m research.battery_curve_audit.graz_five_cell_numeric_probe /tmp/graz_five_real_cell_numeric_log_probe.json
      - name: Preserve no invented physical inference
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/graz_five_real_cell_numeric_log_probe.json',encoding='utf-8'))
          assert d['publisher_doi']=='10.5281/zenodo.22079387'
          assert d['source_original_md5_verified']=='b9ed863766e30afbd0e309951c855d08'
          assert d['electric_original_log_count']==5 and d['sp_original_log_count']==15
          assert d['all_five_cell_folders_have_1_cycling_and_3_sp_logs']
          assert d['raw_numeric_log_rows_parsed']>=500
          for k in ('time_series_signal_alignment_verified','sp_physical_force_units_verified',
                    'electrical_current_units_independently_verified',
                    'calibrated_capacity_or_soh_recomputed','dynamic_impact_measured',
                    'preload_causal_effect_established','old_four_cell_archive_samples_join_verified'):
              assert d[k] is False, k
          for cell in ['01','02','03','04','05']:
              e=d['cells'][cell]['electric_log']
              assert e['counts']['numeric_timestamp_rows']>=100
              assert e['current_header_has_no_declared_unit'] and e['not_absolute_Ah_capacity']
          print("FIVE_ORIGINAL_NUMERIC_LOGS_READ_WITHOUT_CLAIMING_AH_OR_PHYSICAL_VALIDATION")
          PY
      - name: Original numeric channel summary artifact without raw logs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: graz-5-publisher-original-electrical-timeseries-and-sp-metadata-probe
          path: /tmp/graz_five_real_cell_numeric_log_probe.json
          if-no-files-found: error
          retention-days: 7
