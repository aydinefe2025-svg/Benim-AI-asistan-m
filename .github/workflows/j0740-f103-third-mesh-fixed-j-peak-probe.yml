name: J0740 F103 source-native third-mesh local fixed-J peak probe
on:
  pull_request:
    branches:
      - science/j0740-apr4-firstlaw-gr-pilot-20261117
    paths:
      - 'research/j0740/f103/**'
      - '.github/workflows/j0740-f103-third-mesh-fixed-j-peak-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  third_mesh_native_c_probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rns-alberta/rns
          ref: 97e85d325a33e37f702306414533f6cd77812477
          path: rns-upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical dependencies
        run: python -m pip install 'numpy==2.3.5' 'scipy==1.16.3'
      - name: Retrieve and SHA-lock the exact F102 real-source baseline artifact and original APR publisher input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p results/F102 results/F88 results/F103
          curl -fLsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14750322505/zip" -o results/F102/F102_PR763.zip
          printf '%s  %s\n' d52c186306c8a7bda8a1490fd61a68b7eb5f7fbfcd201ad1b0c21ba2af301f1a results/F102/F102_PR763.zip | sha256sum -c -
          gh run download 44818195695 -R "$GITHUB_REPOSITORY" -n J0740-F88-ACTUAL-ORIGINAL-APR-C-RNS-TWO-GRID -D results/F88
          printf '%s  %s\n' 8338af81270a87c93f19c28df86fbaac5618296aff6535177eb41052c77dcb12 results/F88/F87_verified_publisher_original.zip | sha256sum -c -
          printf '%s  %s\n' 7643d0e4361adee77cc79d1b69eb445db70a52443b833c4dddafa973193fb580 results/F88/m.rns | sha256sum -c -
          python -m zipfile -e results/F102/F102_PR763.zip results/F102
      - name: Verify immutable baseline and F103 preflight
        env:
          F102_ARTIFACT_ZIP: results/F102/F102_PR763.zip
        run: |
          set -euo pipefail
          python -m unittest discover -s research/j0740/f103 -p 'test_f103_*.py' -v
          python - <<'PY'
          import os
          from pathlib import Path
          from research.j0740.f103.f103_third_mesh_peak_probe import read_baseline
          d=read_baseline(Path(os.environ['F102_ARTIFACT_ZIP']))
          assert len(d['both_native_C_grids']) == 2
          print('F103_IMMUTABLE_F102_28_REAL_NATIVE_C_STARS_REUSED')
          PY
      - name: Recreate the exact pinned distinct F99 EOS used by F102
        run: |
          set -euo pipefail
          python research/j0740/f99/f99_physical_firstlaw_source_no_go_derived_eos.py --source results/F88/m.rns --out m99.rns --report results/F103/F103_REUSE_F99_EOS.json
          printf '%s  %s\n' c99eadee07bf6cbbf78f59b6171ef7e21ffad7d034f4ca4e9b7d85d36d9b4331 m99.rns | sha256sum -c -
      - name: Compile original Einstein C RNS at the distinct 251x501 mesh, print-only output patch
        run: |
          set -euo pipefail
          test "$(git -C rns-upstream rev-parse HEAD)" = '97e85d325a33e37f702306414533f6cd77812477'
          cp -a rns-upstream rns251
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0,'research/j0740/f81')
          from f81_exact_mass_spin import patch_print_only
          p=Path('rns251/rns.c')
          p.write_text(patch_print_only(p.read_text()))
          mf=Path('rns251/makefile')
          t=mf.read_text()
          old='HIGHSIZE=-DMDIV=151 -DSDIV=301'
          assert t.splitlines().count(old)==1
          mf.write_text(t.replace(old,'HIGHSIZE=-DMDIV=251 -DSDIV=501',1))
          src=Path('rns251/findmodel.c').read_bytes()
          assert b'float ans, fh,fl,fm,fnew,sroot,xh,xl,xm,xnew,xacc=1e-5;' in src
          PY
          make -C rns251 CC='gcc -include stdlib.h' rns
          sha256sum rns251/rns | tee results/F103/F103_NATIVE_C_BINARY_SHA256.txt
      - name: Run only seven new 251x501 true C fixed-J models near the already-observed peak
        run: |
          set -euo pipefail
          OPENBLAS_NUM_THREADS=1 python -u research/j0740/f103/f103_third_mesh_peak_probe.py             --f102 results/F102/F102_PR763.zip             --eos m99.rns             --rns "$GITHUB_WORKSPACE/rns251/rns"             --out results/F103/F103_251x501_LOCAL_PEAK.json             2>&1 | tee results/F103/F103_NATIVE_C_ROOTS.log
      - name: Preserve full F103 calculations and immutable source receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: J0740-F103-251x501-third-mesh-native-fixedJ-local-peak
          path: |
            results/F103/
            results/F102/F102_PR763.zip
            results/F102/F102_ORIGINAL_24_PLUS_F101_1_PLUS_F102_3_REAL_C_STARS.json
            results/F102/F102_DIRECT_TRUE_C_R_RATIO_ONLY_*.jsonl
          if-no-files-found: warn
