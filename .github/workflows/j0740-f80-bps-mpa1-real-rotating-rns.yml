name: J0740 F80 real BPS-MPA1 alternate-EOS rotating GR C/RNS two grids
on:
  pull_request:
    branches:
      - science/j0740-apr4-firstlaw-gr-pilot-20261117
    paths:
      - 'research/j0740/f80/**'
      - '.github/workflows/j0740-f80-bps-mpa1-real-rotating-rns.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  direct-original-c-full-GR-bps-mpa1-two-spacetime-grids:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact immutable upstream RNS equations
        uses: actions/checkout@v4
        with:
          repository: rns-alberta/rns
          ref: 97e85d325a33e37f702306414533f6cd77812477
          path: rns-upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin numeric math dependencies
        run: python -m pip install 'numpy==2.3.5' 'scipy==1.16.3'
      - name: Authenticate original EOS and real prior TOV bytes (without repeating TOV experiment)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          for name in ('JESTER_BPS_crust_e6768650.csv','JESTER_LALSuite_MPA1_source_e6768650.csv'):
              p=Path('research/j0740/physical_eos_validation')/name
              raw=p.read_bytes()
              newline=b'\r\n' if b'\r\n' in raw else b'\n'
              p.write_bytes(raw.rstrip(b'\r\n')+newline)
          PY
          echo 'a4195d48ae98fd64d0a9676891ccab5a5c035e713780ad1187e85571a98a1787  research/j0740/physical_eos_validation/JESTER_BPS_crust_e6768650.csv' | sha256sum -c -
          echo 'f51d6476f999bf02a839fcb5f318d94c9f11338d270644c3c8b617cdb95a32c9  research/j0740/physical_eos_validation/JESTER_LALSuite_MPA1_source_e6768650.csv' | sha256sum -c -
          # The committed text includes one transport-added terminal CRLF blank line.
          # Remove ONLY that provably unphysical blank line if and only if it restores
          # the existing independent F67/BPS source-export SHA; never regenerate EOS.
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('research/j0740/physical_eos_validation/JESTER_BPS_MPA1_RNS_20261119.rns')
          raw=p.read_bytes()
          expected='f4a183661962acdddc7aebde3830116578feb6fba88a1a68c9fd57a993058675'
          digest=lambda b:hashlib.sha256(b).hexdigest()
          if digest(raw)!=expected:
              if not raw.endswith(b'\n\r\n') or digest(raw[:-2])!=expected:
                  raise ValueError('F80_SOURCE_RNS_UNEXPLAINED_DRIFT')
              p.write_bytes(raw[:-2]); print('F80 exact canonical source restored after removing one transport terminal empty CRLF; no physical data modified')
          print('source EOS digest',digest(p.read_bytes()))
          PY
          echo 'f4a183661962acdddc7aebde3830116578feb6fba88a1a68c9fd57a993058675  research/j0740/physical_eos_validation/JESTER_BPS_MPA1_RNS_20261119.rns' | sha256sum -c -
          test "$(git -C rns-upstream rev-parse HEAD)" = '97e85d325a33e37f702306414533f6cd77812477'
      - name: Run 12 adversarial *synthetic validator tests* (NOT rotating evidence)
        run: python -m unittest discover -s research/j0740/f80 -p 'test_f80_*.py' -v
      - name: Compile two distinct source-pinned full-GR C RNS solver grids without modifying physics
        shell: bash
        run: |
          set -euo pipefail
          cp -a rns-upstream rns151
          cp -a rns-upstream rns201
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          old='printf("%g \\t %4.3f \\t %4.2f \\t %4.1f \\n",'
          new='printf("%.12e \\t %.12e \\t %.12e \\t %.12e \\n",'
          refs={}
          for folder,grid in [('rns151','151x301'),('rns201','201x401')]:
              p=Path(folder)/'rns.c'
              original=p.read_bytes()
              s=original.decode()
              if s.count(old)!=1:raise RuntimeError('RNS pin precision patch refused: C output source drift')
              p.write_text(s.replace(old,new,1))
              mk=Path(folder)/'makefile'
              m=mk.read_text()
              if m.splitlines().count('HIGHSIZE=-DMDIV=151 -DSDIV=301')!=1:
                  raise RuntimeError('RNS makefile original mesh drift')
              if grid=='201x401':mk.write_text(m.replace('HIGHSIZE=-DMDIV=151 -DSDIV=301',
                                    'HIGHSIZE=-DMDIV=201 -DSDIV=401',1))
              refs[folder]={'grid':grid,'original_rns_c_sha256':hashlib.sha256(original).hexdigest(),
                            'patched_rns_c_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
                            'original_makefile_sha256':hashlib.sha256(m.encode()).hexdigest(),
                            'modified_physics_equations':False,
                            'patch_description':'Only one original printf format string precision change; mesh flags explicit'}
          root=Path('results/F80');root.mkdir(parents=True,exist_ok=True)
          (root/'F80_C_source_patch_receipt.json').write_text(json.dumps(refs,indent=2,sort_keys=True)+'\n')
          PY
          make -C rns151 CC='gcc -include stdlib.h' rns
          make -C rns201 CC='gcc -include stdlib.h' rns
          test "$(sha256sum rns151/rns | cut -d' ' -f1)" != "$(sha256sum rns201/rns | cut -d' ' -f1)"
          sha256sum rns151/rns rns201/rns
      - name: Solve two actual direct-C full-GR rotating stars at 2.073 Msun and 346.536369 Hz
        shell: bash
        run: |
          set -euo pipefail
          cp research/j0740/physical_eos_validation/JESTER_BPS_MPA1_RNS_20261119.rns results/F80/m.rns
          cd results/F80
          python -u ../../research/j0740/f80/f80_run_real_rns.py \
            --eos m.rns \
            --rns "$GITHUB_WORKSPACE/rns151/rns" "$GITHUB_WORKSPACE/rns201/rns" \
            --out F80_actual_two_grid_C_RNS_20261120.json \
            2>&1 | tee F80_direct_RNS_execution.txt
      - name: Refuse physical false certification and check actual same-mass rotation
        shell: bash
        run: |
          set -euo pipefail
          python research/j0740/f80/f80_rotation_acceptance.py \
            --raw results/F80/F80_actual_two_grid_C_RNS_20261120.json \
            --tov research/j0740/physical_eos_validation/JESTER_BPS_MPA1_matched_TOV_20261119.json \
            --eos results/F80/m.rns \
            --out results/F80/F80_verified_two_grid_rotating_physics_20261120.json
      - name: Persist SHA256 evidence even on solver failure
        shell: bash
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('results/F80');root.mkdir(parents=True,exist_ok=True)
          src=[*root.glob('*'),Path('rns151/rns.c'),Path('rns201/rns.c'),Path('rns151/rns'),Path('rns201/rns'),
            Path('research/j0740/physical_eos_validation/JESTER_BPS_MPA1_matched_TOV_20261119.json'),
            Path('research/j0740/f80/f80_run_real_rns.py'),Path('research/j0740/f80/f80_rotation_acceptance.py')]
          data={str(p):{'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'bytes':p.stat().st_size} for p in src if p.is_file()}
          (root/'F80_actual_C_RNS_SHA256_receipt.json').write_text(json.dumps({'RNS_source_commit':'97e85d325a33e37f702306414533f6cd77812477',
            'original_BPS_MPA1_EOS_source_sha256':'f4a183661962acdddc7aebde3830116578feb6fba88a1a68c9fd57a993058675',
            'files':data},indent=2,sort_keys=True)+'\n')
          PY
      - name: Preserve actual C star output or honest failure record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: J0740-F80-actual-BPS-MPA1-hybrid-rotating-2grid-GR-or-error
          path: results/F80/
          if-no-files-found: warn
          retention-days: 30
