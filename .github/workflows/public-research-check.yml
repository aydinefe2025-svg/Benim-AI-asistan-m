name: Public research checks
on:
  pull_request:
  push:
    branches:
      - fix/capability-honesty-and-tools-20261102
jobs:
  research-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q app.py core tests
      - name: Run public research tests
        run: python -m unittest discover -s tests -p 'test_public_research.py' -v
