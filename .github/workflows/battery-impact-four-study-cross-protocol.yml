name: Battery impact published four-study non-pooling evidence
on:
  pull_request:
    paths:
      - 'research/battery_curve_audit/impact_2017_2026_cross_protocol_evidence.py'
      - 'tests/test_impact_2017_2026_cross_protocol_evidence.py'
      - '.github/workflows/battery-impact-four-study-cross-protocol.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  primary-physical-evidence-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout pinned
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test four study source provenance and endpoint separation
        run: python -m unittest discover -s tests -p 'test_impact_2017_2026_cross_protocol_evidence.py' -v
      - name: Generate original-source cross-protocol evidence and hash
        run: |
          mkdir -p /tmp/cano_impact_4study
          python research/battery_curve_audit/impact_2017_2026_cross_protocol_evidence.py --output /tmp/cano_impact_4study/impact_2017_2026_source_aligned_four_study_evidence.json
          python - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('/tmp/cano_impact_4study/impact_2017_2026_source_aligned_four_study_evidence.json')
          d=json.loads(p.read_text())
          assert d['source_count']==4 and d['cross_protocol_pooling_allowed'] is False
          assert d['observed_counterexample']['capacity_retained_pct']==99.4
          assert d['observed_counterexample']['deformation_energy_to_failure_reduction_pct']==40
          assert d['independent_hidden_fault_corroboration']['post_abuse_hidden_resistive_short_observed'] is True
          assert d['individual_cell_damage_capacity_function_identifiable'] is False
          receipt={'source_count':4,'source_url_count':4,'json_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'json_bytes':len(p.read_bytes()),'source_level_only':True,'pass':True}
          (p.parent/'source_hash_and_claim_bounds.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print('FOUR_SOURCE_SCOPE_AND_HASH_PASS',receipt)
          PY
      - name: Upload numerical evidence and scope receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: impact-2017-2026-cross-protocol-original-published-evidence
          path: /tmp/cano_impact_4study/
          retention-days: 14
          if-no-files-found: error
