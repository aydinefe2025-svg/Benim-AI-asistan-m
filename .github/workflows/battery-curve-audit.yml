name: Battery independent holdout and real CSV audit

on:
  pull_request:
    paths:
      - "research/battery_curve_audit/**"
      - "tests/test_battery_independent_holdout.py"
      - "tests/test_battery_customer_pipeline.py"
      - "tests/test_battery_integrated_gate.py"
      - "tests/test_battery_integrated_output_safety.py"
      - "tests/test_battery_field_pilot_evidence.py"
      - "tests/test_customer_preflight.py"
      - "tests/test_battery_numeric_equivalence.py"
      - "tests/test_battery_near_duplicate_guard.py"
      - ".github/workflows/battery-curve-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  battery-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Synthetic parser smoke test
        run: python research/battery_curve_audit/original_20261118.py --self-test

      - name: Independent split regression suite
        run: python -m unittest discover -s tests -p "test_battery_independent_holdout.py" -v

      - name: Offline one-command customer pipeline regression suite
        run: python -m unittest discover -s tests -p "test_battery_customer_pipeline.py" -v

      - name: Near-duplicate regression suite (synthetic only)
        run: python -m unittest discover -s tests -p "test_battery_near_duplicate_guard.py" -v

      - name: Numeric-equivalence regression suite
        run: python -m unittest discover -s tests -p "test_battery_numeric_equivalence.py" -v

      - name: Customer preflight synthetic regression suite
        run: python -m unittest discover -s tests -p "test_customer_preflight.py" -v

      - name: Integrated fail-closed acceptance regression suites
        run: |
          python -m unittest discover -s tests -p "test_battery_integrated_gate.py" -v
          python -m unittest discover -s tests -p "test_battery_integrated_output_safety.py" -v

      - name: Fetch and independently parse all 20 publisher CSVs
        run: |
          python research/battery_curve_audit/original_20261118.py \
            --download --data-dir "${RUNNER_TEMP}/publisher_csvs" \
            --output-json "${RUNNER_TEMP}/battery_audit.json" \
            > "${RUNNER_TEMP}/run_stdout.log"

      - name: Verify published baseline values and hash-pinned provenance
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          a = json.loads((Path(os.environ["RUNNER_TEMP"]) / "battery_audit.json").read_text())
          curves = a["all_curve_identity"]
          assert a["source_files"] == 20, a["source_files"]
          assert a["trace_count"] == 60, a["trace_count"]
          assert sum(x["n"] for x in curves if x["mode"] == "dchg") == 506141
          assert sum(x["n"] for x in curves if x["mode"] == "chg") == 197516
          expected_widths = {"chg_2":4600, "chg_4":2008, "chg_6":66644, "dchg_6":323258}
          assert a["width_counts"] == expected_widths, a["width_counts"]
          assert len(a["duplicate_groups"]) == 1
          group = a["duplicate_groups"][0]
          assert len(group) == 3 and all(c["mode"] == "dchg" and c["run"] == 1 and c["n"] == 3764 for c in group)
          assert {c["cell"] for c in group} == {
              "apreh171000701957", "apreh171000707901", "apreh171000711199"
          }
          print("PASS: 20 publisher Git blob pinned originals; 60 traces; 703657 samples; one exact three-cell group")
          PY

      - name: Create independent partition manifest and verify readback
        run: |
          python research/battery_curve_audit/independent_holdout.py \
            --audit-json "${RUNNER_TEMP}/battery_audit.json" \
            --output-json "${RUNNER_TEMP}/battery_holdout.json"
          python research/battery_curve_audit/independent_holdout.py \
            --audit-json "${RUNNER_TEMP}/battery_audit.json" \
            --verify-json "${RUNNER_TEMP}/battery_holdout.json"

      - name: Verify the customer adapter against the same 20 original publisher CSVs
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from research.battery_curve_audit.original_20261118 import ROOT, SUFFIXES
          work = Path(os.environ["RUNNER_TEMP"])
          files = [{"path": f"{ROOT}{kind}_{suffix}.csv", "cell": suffix, "mode": kind}
                   for kind in ("dchg", "chg") for suffix in SUFFIXES]
          (work / "customer_manifest.json").write_text(json.dumps(
              {"schema": "cano.battery.customer-files.v1", "files": files}), encoding="utf-8")
          PY
          python research/battery_curve_audit/customer_preflight.py \
            --manifest "${RUNNER_TEMP}/customer_manifest.json" \
            --root "${RUNNER_TEMP}/publisher_csvs" \
            --report "${RUNNER_TEMP}/customer_report.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          work=Path(os.environ["RUNNER_TEMP"])
          original=json.loads((work/"battery_audit.json").read_text())
          customer=json.loads((work/"customer_report.json").read_text())
          key=lambda c: (c["cell"],c["mode"],c["run"],c["trace_sha256"])
          assert sorted(map(key, original["all_curve_identity"])) == sorted(map(key, customer["all_curve_identity"]))
          assert original["source_files"] == customer["source_files"] == 20
          assert original["measured_time_voltage_pairs"] == customer["measured_time_voltage_pairs"] == 703657
          assert customer["review_status"] == "REVIEW_REQUIRED"
          print("PASS: read-only customer adapter matches original 20 CSV and 60 curve hashes; no customer split accepted in this stage")
          PY

      - name: Near-screen original publisher CSVs (no automatic physical-duplicate claim)
        run: |
          python research/battery_curve_audit/near_duplicate_guard.py \
            --data-dir "${RUNNER_TEMP}/publisher_csvs" \
            --audit-json "${RUNNER_TEMP}/battery_audit.json" \
            --holdout-json "${RUNNER_TEMP}/battery_holdout.json" \
            --output-json "${RUNNER_TEMP}/battery_near_screen.json"
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, "research/battery_curve_audit")
          from near_duplicate_guard import digest, verify_split
          tmp=Path(os.environ["RUNNER_TEMP"])
          audit=json.loads((tmp/"battery_audit.json").read_text())
          near=json.loads((tmp/"battery_near_screen.json").read_text())
          assert near["source_audit_sha256"] == digest(audit)
          assert near["near_candidate_count"] == len(near["near_candidates"])
          candidate_safe=near["proposed_near_safe_holdout"]
          if candidate_safe is None:
              assert near["decision"] == "BLOCK_INSUFFICIENT_INDEPENDENT_GROUPS"
          else:
              verify_split(audit["all_curve_identity"], near["near_candidates"], candidate_safe)
          print("SCREEN:",near["decision"],"candidates",near["near_candidate_count"])
          PY

      - name: Numeric-equivalence audit of same original 20 publisher CSVs
        run: |
          python research/battery_curve_audit/numeric_equivalence_guard.py \
            --manifest "${RUNNER_TEMP}/customer_manifest.json" \
            --root "${RUNNER_TEMP}/publisher_csvs" \
            --report "${RUNNER_TEMP}/battery_numeric_audit.json"
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, "research/battery_curve_audit")
          from independent_holdout import verify_manifest
          from numeric_equivalence_guard import digest
          root = Path(os.environ["RUNNER_TEMP"])
          original = json.loads((root/"customer_report.json").read_text())
          numeric = json.loads((root/"battery_numeric_audit.json").read_text())
          assert numeric["original_text_audit_sha256"] == digest(original)
          assert numeric["source_files"] == 20
          assert numeric["trace_count"] == 60
          assert numeric["measured_time_voltage_pairs"] == 703657
          assert numeric["unique_curve_count"] <= original["unique_curve_count"]
          assert all(a["trace_sha256"] == b["raw_trace_sha256"] and
                     a["source_sha256"] == b["source_sha256"] for a,b in
                     zip(original["all_curve_identity"], numeric["all_curve_identity"]))
          print("PASS: numeric equality source-pinned full 20 publisher CSVs;",
                "numeric_unique",numeric["unique_curve_count"],
                "numeric_only_groups",len(numeric["numeric_only_duplicate_groups"]),
                "screen_only",True)
          PY

      - name: Exercise one-command offline customer pipeline on 20 original CSVs
        run: |
          # Real APR cross-cell duplicates MUST fail closed with exit 2.
          # An explicitly private, NOT_CERTIFIED review split may be created,
          # but --report-only must not override the rejected acceptance code.
          set +e
          python research/battery_curve_audit/customer_pipeline.py \
            --manifest "${RUNNER_TEMP}/customer_manifest.json" \
            --root "${RUNNER_TEMP}/publisher_csvs" \
            --summary "${RUNNER_TEMP}/customer_public_summary.json" \
            --private-split "${RUNNER_TEMP}/customer_private_split.json"
          status=$?
          set -e
          test "$status" -eq 2
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, "research/battery_curve_audit")
          import near_duplicate_guard as near
          p=Path(os.environ["RUNNER_TEMP"])
          s=json.loads((p/"customer_public_summary.json").read_text())
          private=json.loads((p/"customer_private_split.json").read_text())
          numeric=json.loads((p/"battery_numeric_audit.json").read_text())
          assert s["schema"]=="cano.battery.customer-local-pipeline.v1"
          assert s["decision"]=="REVIEW_REQUIRED"  # Real known APR triplet, not a certified pass.
          assert (s["source_files"],s["trace_count"],s["sample_pairs"])==(20,60,703657)
          assert s["numeric_unique_traces"]==58 and s["cross_cell_numeric_duplicate_groups"]==1
          assert s["near_candidates"]==0 and s["independent_groups"]==8
          assert s["unit_contract"]["time_unit"]=="h" and s["unit_contract"]["voltage_unit"]=="v"
          assert private["status"]=="NOT_CERTIFIED" and private["review_required"]
          assert private["split"]["exact_and_candidate_connected_groups"]==8
          assert near.verify_split(numeric["all_curve_identity"], [], private["split"])=={"train":6,"validation":2,"test":2}
          raw=(p/"customer_public_summary.json").read_text()
          for forbidden in ("apreh", "bse001", ".csv", "raw_trace_sha256", "numeric_trace_sha256"):
              assert forbidden not in raw, forbidden
          print("PASS: one-command customer pipeline, original 20 CSVs, privacy, 8 groups, review gate held")
          PY

      - name: Integrated customer acceptance (original publisher triplet must require review)
        run: |
          set +e
          python research/battery_curve_audit/integrated_customer_gate.py \
            --manifest "${RUNNER_TEMP}/customer_manifest.json" \
            --root "${RUNNER_TEMP}/publisher_csvs" \
            --report "${RUNNER_TEMP}/battery_integrated_report.json" \
            --accepted-split "${RUNNER_TEMP}/accepted_customer_split.json"
          status=$?
          set -e
          test "$status" -eq 2
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])
          a=json.loads((p/"battery_integrated_report.json").read_text())
          assert a["decision"] == "REVIEW_REQUIRED"
          assert a["source_files"] == 20 and a["trace_count"] == 60
          assert a["time_voltage_pairs"] == 703657
          assert a["raw_unique"] == a["numeric_unique"] == 58
          assert a["cross_cell_numeric_duplicate_groups"] == 1
          assert a["numeric_only_duplicate_groups"] == 0
          assert a["near_candidate_count"] == 0
          assert a["split"]["exact_and_candidate_connected_groups"] == 8
          assert a["split"]["partition_cell_counts"] == {"train":6,"validation":2,"test":2}
          assert not (p/"accepted_customer_split.json").exists()
          print("PASS: combined 20 CSV source gate REVIEW_REQUIRED; no unsafe accepted split")
          PY

      - name: Build and verify source-pinned offline Windows pilot ZIP
        run: |
          python research/battery_curve_audit/package_offline_pilot.py \
            --output "${RUNNER_TEMP}/CANO_BATARYA_OFFLINE_PILOT_20261119.zip"
          python - <<'PY'
          import os
          import sys
          import tempfile
          import subprocess
          from pathlib import Path
          from zipfile import ZipFile
          artifact=Path(os.environ["RUNNER_TEMP"])/"CANO_BATARYA_OFFLINE_PILOT_20261119.zip"
          with tempfile.TemporaryDirectory() as tmp:
              with ZipFile(artifact) as z:
                  assert z.testzip() is None
                  z.extractall(tmp)
              folder=Path(tmp)/"CANO_BATARYA_CEVRIMDISI_PILOT"
              subprocess.run([sys.executable,"verify_package.py","--tests","--demo"],cwd=folder,check=True)
          print("PASS: isolated ZIP extraction, checksum readback, targeted regressions and 2 synthetic demo runs")
          PY

      - name: Publish offline Windows/Linux pilot bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cano-battery-offline-pilot-20261119
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/CANO_BATARYA_OFFLINE_PILOT_20261119.zip

      - name: Publish read-only evidence artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: battery-publisher-audit-and-holdout
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/battery_audit.json
            ${{ runner.temp }}/battery_holdout.json
            ${{ runner.temp }}/run_stdout.log
            ${{ runner.temp }}/customer_report.json
            ${{ runner.temp }}/battery_near_screen.json
            ${{ runner.temp }}/battery_numeric_audit.json
            ${{ runner.temp }}/battery_integrated_report.json
            ${{ runner.temp }}/customer_public_summary.json
