name: Battery independent holdout and real CSV audit

on:
  pull_request:
    paths:
      - "research/battery_curve_audit/**"
      - "tests/test_battery_independent_holdout.py"
      - "tests/test_battery_near_duplicate_guard.py"
      - ".github/workflows/battery-curve-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  battery-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Synthetic parser smoke test
        run: python research/battery_curve_audit/original_20261118.py --self-test

      - name: Independent split regression suite
        run: python -m unittest discover -s tests -p "test_battery_independent_holdout.py" -v

      - name: Near-duplicate regression suite (synthetic only)
        run: python -m unittest discover -s tests -p "test_battery_near_duplicate_guard.py" -v

      - name: Fetch and independently parse all 20 publisher CSVs
        run: |
          python research/battery_curve_audit/original_20261118.py \
            --download --data-dir "${RUNNER_TEMP}/publisher_csvs" \
            --output-json "${RUNNER_TEMP}/battery_audit.json" \
            > "${RUNNER_TEMP}/run_stdout.log"

      - name: Verify published baseline values and hash-pinned provenance
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          a = json.loads((Path(os.environ["RUNNER_TEMP"]) / "battery_audit.json").read_text())
          curves = a["all_curve_identity"]
          assert a["source_files"] == 20, a["source_files"]
          assert a["trace_count"] == 60, a["trace_count"]
          assert sum(x["n"] for x in curves if x["mode"] == "dchg") == 506141
          assert sum(x["n"] for x in curves if x["mode"] == "chg") == 197516
          expected_widths = {"chg_2":4600, "chg_4":2008, "chg_6":66644, "dchg_6":323258}
          assert a["width_counts"] == expected_widths, a["width_counts"]
          assert len(a["duplicate_groups"]) == 1
          group = a["duplicate_groups"][0]
          assert len(group) == 3 and all(c["mode"] == "dchg" and c["run"] == 1 and c["n"] == 3764 for c in group)
          assert {c["cell"] for c in group} == {
              "apreh171000701957", "apreh171000707901", "apreh171000711199"
          }
          print("PASS: 20 publisher Git blob pinned originals; 60 traces; 703657 samples; one exact three-cell group")
          PY

      - name: Create independent partition manifest and verify readback
        run: |
          python research/battery_curve_audit/independent_holdout.py \
            --audit-json "${RUNNER_TEMP}/battery_audit.json" \
            --output-json "${RUNNER_TEMP}/battery_holdout.json"
          python research/battery_curve_audit/independent_holdout.py \
            --audit-json "${RUNNER_TEMP}/battery_audit.json" \
            --verify-json "${RUNNER_TEMP}/battery_holdout.json"

      - name: Screen pinned publisher curves for near-duplicate review candidates
        run: |
          python research/battery_curve_audit/near_duplicate_guard.py \
            --data-dir "${RUNNER_TEMP}/publisher_csvs" \
            --audit-json "${RUNNER_TEMP}/battery_audit.json" \
            --holdout-json "${RUNNER_TEMP}/battery_holdout.json" \
            --output-json "${RUNNER_TEMP}/battery_near_screen.json"

      - name: Independently recheck near-screen receipt and group graph
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, "research/battery_curve_audit")
          from near_duplicate_guard import digest, verify_split
          tmp=Path(os.environ["RUNNER_TEMP"])
          a=json.loads((tmp/"battery_audit.json").read_text(encoding="utf-8"))
          n=json.loads((tmp/"battery_near_screen.json").read_text(encoding="utf-8"))
          assert n["source_audit_sha256"] == digest(a)
          assert n["near_candidate_count"] == len(n["near_candidates"])
          p=n["proposed_near_safe_holdout"]
          if p is None:
              assert n["decision"] == "BLOCK_INSUFFICIENT_INDEPENDENT_GROUPS"
          else:
              verify_split(a["all_curve_identity"], n["near_candidates"], p)
          print("SCREEN:", n["decision"], "near_candidates=", n["near_candidate_count"],
                "cross_legacy=", n["cross_legacy_holdout_count"])
          PY

      - name: Publish read-only evidence artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: battery-publisher-audit-and-holdout
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/battery_audit.json
            ${{ runner.temp }}/battery_holdout.json
            ${{ runner.temp }}/run_stdout.log
            ${{ runner.temp }}/battery_near_screen.json
