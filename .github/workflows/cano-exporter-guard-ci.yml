name: CANO exporter isolated security acceptance

on:
  push:
    branches:
      - fix/cano-render-encrypted-export-20261112
    paths:
      - .github/workflows/cano-exporter-guard-ci.yml
      - scripts/cano_cloud_encrypted_export.py
      - scripts/cano_backup_source_gate.py
      - scripts/cano_encrypted_backup.py
      - scripts/cano_pg_backup.py
      - tests/test_cano_export_content_guard.py
      - tests/test_cano_export_source_profile_regression.py
      - tests/test_cano_export_redirect_guard.py
      - tests/test_cano_cloud_encrypted_export.py
      - tests/test_cano_encrypted_backup.py
      - tests/test_cano_pg_backup.py

permissions:
  contents: read

jobs:
  isolated-offline-tests:
    name: exporter-synthetic-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.14"
    steps:
      - name: Checkout existing exporter branch (read-only)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up test Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install only synthetic test cryptography dependency
        run: python -m pip install --disable-pip-version-check --no-input "cryptography>=44,<51"
      - name: Check source syntax
        run: python -m compileall -q scripts/cano_cloud_encrypted_export.py scripts/cano_backup_source_gate.py scripts/cano_encrypted_backup.py scripts/cano_pg_backup.py
      - name: Source identity, scope, token-redirect regressions (no real DB or HTTP)
        run: python -m unittest discover -s tests -p "test_cano_export*.py" -v
      - name: Exporter HTTP protocol regressions (offline mocks)
        run: python -m unittest discover -s tests -p "test_cano_cloud_encrypted_export.py" -v
      - name: Encrypted backup and restore primitive regressions (synthetic data)
        run: python -m unittest discover -s tests -p "test_cano_encrypted_backup.py" -v
      - name: PostgreSQL backup adapter regressions (synthetic only)
        run: python -m unittest discover -s tests -p "test_cano_pg_backup.py" -v
