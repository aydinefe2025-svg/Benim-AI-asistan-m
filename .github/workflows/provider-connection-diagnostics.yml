name: Read-only provider connection diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-connectivity:
    # Only run reviewed code from the default branch; never execute PR code with secrets.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install HTTP client
        run: python -m pip install "requests>=2.32,<3"
      - name: Check model listings and Telegram identity only
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GOOGLE_MODEL: ${{ vars.GOOGLE_MODEL || 'gemini-3.6-flash' }}
        shell: bash
        run: |
          set +e
          python scripts/check_connections.py > provider-connection-results.json
          diagnostic_status=$?
          cat provider-connection-results.json
          exit "$diagnostic_status"
      - name: Preserve redacted results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-connection-results
          path: provider-connection-results.json
          if-no-files-found: warn
          retention-days: 7
