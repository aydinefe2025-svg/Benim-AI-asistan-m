name: J0740 archived static-star discrete Euler balance
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/j0740-static-equilibrium-archive-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  static-balance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Recover and measure the existing static reference without evolving it again
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          sudo apt-get update -qq
          sudo apt-get install -y python3-numpy python3-h5py
          gh api repos/${{ github.repository }}/actions/artifacts/15135382845/zip > static.zip
          echo 'a6b05e4cbca9c708c1cf4fa52be3533aef9195d497742d4d1c85bb821af0d986  static.zip' | sha256sum -c -
          /usr/bin/python3 - <<'PY'
          import pathlib,zipfile,json,numpy as np,h5py
          with zipfile.ZipFile('static.zip') as z:
              assert z.testzip() is None
              for name in z.namelist():
                  if name.endswith('.athdf') and '.out' in name:
                      p=pathlib.Path('evidence')/pathlib.PurePosixPath(name).name
                      assert not p.exists()
                      with p.open('wb') as f:
                          import shutil
                          with z.open(name) as src:shutil.copyfileobj(src,f)
          d=pathlib.Path('evidence')
          files=sorted(d.glob('*.out2.*.athdf'))
          assert len(files)>=2
          N=64;dx=.75
          def read(file,key):
              names=[x.decode() if isinstance(x,bytes) else str(x) for x in file.attrs['VariableNames']]
              ds=[x.decode() if isinstance(x,bytes) else str(x) for x in file.attrs['DatasetNames']]
              idx=names.index(key)
              for n,c in zip(ds,file.attrs['NumVariables']):
                  if idx<c:return file[n][idx,...]
                  idx-=c
              raise AssertionError(key)
          def grid(file,key):
              a=read(file,key);out=np.empty((N,N,N));count=np.zeros((N,N,N),dtype=np.uint8)
              for b in range(a.shape[0]):
                  i,j,k=[np.rint((file[q][b]+24)/dx-.5).astype(int) for q in ('x1v','x2v','x3v')]
                  assert all(np.all((v>=0)&(v<N)) for v in (i,j,k))
                  for q,v in zip(('x1v','x2v','x3v'),(i,j,k)):
                      assert np.allclose(file[q][b],-24+(v+.5)*dx,rtol=0,atol=1e-10)
                  out[np.ix_(k,j,i)]=a[b]
                  count[np.ix_(k,j,i)]+=1
              assert (count==1).all() and np.isfinite(out).all()
              return out
          def derivative(f,axis):
              a=np.moveaxis(f,axis,0);b=np.zeros_like(a)
              b[2:-2]=(a[:-4]-8*a[1:-3]+8*a[3:-1]-a[4:])/(12*dx)
              return np.moveaxis(b,0,axis)
          xyz=-24+(np.arange(N)+.5)*dx
          Z,Y,X=np.meshgrid(xyz,xyz,xyz,indexing='ij')
          test=X**3+2*Y**2+Z
          assert np.max(abs(derivative(test,2)[2:-2,2:-2,2:-2]-3*X[2:-2,2:-2,2:-2]**2))<1e-9
          assert np.max(abs(derivative(test,1)[2:-2,2:-2,2:-2]-4*Y[2:-2,2:-2,2:-2]))<1e-9
          assert np.max(abs(derivative(test,0)[2:-2,2:-2,2:-2]-1))<1e-9
          def fields(f):
              with h5py.File(f) as c,h5py.File(str(f).replace('.out2.','.out3.')) as g,h5py.File(str(f).replace('.out2.','.out4.')) as p:
                  t=float(c.attrs['Time'])
                  assert abs(float(g.attrs['Time'])-t)<1e-12 and abs(float(p.attrs['Time'])-t)<1e-12
                  return t,grid(c,'geom.con.M'),grid(c,'geom.con.H'),grid(g,'geom.adm.alpha'),grid(p,'rho'),grid(p,'press')
          t0,m0,H0,alpha,rho,p=fields(files[0])
          t1,m1,H1,alpha1,rho1,p1=fields(files[-1])
          assert t0==0 and t1>=1.99 and (alpha>0).all() and (rho>0).all() and (p>=0).all()
          assert np.all(m0>=0) and np.all(m1>=0)
          assert np.isclose(m0.sum()*dx**3,0.,atol=1e-18)
          assert np.isclose(m1.sum()*dx**3,1.540056170496135e-6,rtol=1e-8)
          # Static isentropic Gamma=2 first integral: alpha*h=constant, h=1+2p/rho.
          # Use measured pressure and density; separately report cold EOS mismatch.
          B=np.log(alpha)+np.log1p(2*p/rho)
          F2=sum(derivative(B,axis)**2 for axis in range(3))
          r=np.sqrt(X*X+Y*Y+Z*Z)
          # Require all stencil points to be in matter for core derivative statistics.
          interior=np.ones_like(rho,dtype=bool)
          for axis in range(3):
              for off in (-2,-1,0,1,2):
                  interior &= np.roll(rho,off,axis=axis)>1e-10
          valid=np.zeros_like(interior);valid[2:-2,2:-2,2:-2]=True
          masks={'dense_core':(rho>=1e-4)&interior&valid,'low_density_matter':(rho>1e-10)&(rho<1e-4)&valid,'surface_stencil':(rho>1e-10)&(~interior)&valid,'atmosphere':(rho<=1e-10)&valid}
          out={'scope':'archived static-star first integral and spatial association, not proof of causal forcing or a correction','source_run':45854719630,'time':[t0,t1],'M0':float(m0.sum()*dx**3),'Mfinal':float(m1.sum()*dx**3),'regions':{}}
          for name,mask in masks.items():
              n=int(mask.sum())
              if not n:continue
              f2=F2[mask];mm=m1[mask]
              eos=p[mask]/(100*rho[mask]**2)-1
              corr=None
              if np.std(f2)>0 and np.std(mm)>0:corr=float(np.corrcoef(f2,mm)[0,1])
              out['regions'][name]=dict(cells=n,first_integral_spread=float(np.ptp(B[mask])),force_rms=float(np.sqrt(f2.mean())),cold_eos_relative_rms=float(np.sqrt(np.mean(eos**2))),initial_H2=float(np.sum(H0[mask]**2)*dx**3),final_M2=float(mm.sum()*dx**3),force_M2_pearson=corr)
          assert 'dense_core' in out['regions'] and 'low_density_matter' in out['regions']
          pathlib.Path('evidence/static_balance.json').write_text(json.dumps(out,indent=2,allow_nan=False))
          print('STATIC_BALANCE',json.dumps(out,allow_nan=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: static-equilibrium-audit
          path: evidence/static_balance.json
          if-no-files-found: error
