name: J0740 reproduce historical Legred EOS update (2026-11-18)
on:
  push:
    branches:
      - science/j0740-apr4-firstlaw-gr-pilot-20261117
    paths:
      - research/j0740/historical_20261025/reproduce_historical_legred_update.py
      - .github/workflows/j0740-historical-legred-reproduction.yml
permissions:
  contents: read
jobs:
  historical-reproduction:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: science/j0740-apr4-firstlaw-gr-pilot-20261117
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned numerical stack
        run: python -m pip install 'numpy==2.2.6' 'scipy==1.15.3' 'h5py==3.13.0'
      - name: Download and hash the three original public source files
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, urllib.request, time
          root=Path('research/j0740/historical_20261025/inputs')
          root.mkdir(parents=True,exist_ok=True)
          files=[
            ('mr_samples_and_contours.tar.gz','https://zenodo.org/records/10519473/files/mr_samples_and_contours.tar.gz?download=1',40605003,'ca8e70eeca81feb71321f1a88a24f2f9'),
            ('NICER+XMM_J0740_full.txt','https://zenodo.org/records/4670689/files/NICER+XMM_J0740_full.txt?download=1',168073694,'c28a3995e60f364b34a66c29a37bf79d'),
            ('LCEHL_EOS_posterior_samples_PSR+GW+NICER.h5','https://zenodo.org/records/6502467/files/LCEHL_EOS_posterior_samples_PSR+GW+NICER.h5?download=1',192213112,'64bdad9b43726162a25546d07305747d'),
          ]
          manifest={}
          for name,url,expected_size,expected_md5 in files:
            target=root/name
            last=None
            for attempt in range(3):
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'J0740-A01.01.51-historical-reproduction/1.0','Accept':'application/octet-stream'})
                md5=hashlib.md5(); sha=hashlib.sha256(); size=0
                with urllib.request.urlopen(req,timeout=180) as src, target.open('wb') as dst:
                  while True:
                    block=src.read(1<<20)
                    if not block: break
                    dst.write(block); md5.update(block); sha.update(block); size+=len(block)
                if size!=expected_size or md5.hexdigest()!=expected_md5:
                  raise ValueError(f'SOURCE_HASH_OR_SIZE_MISMATCH {name} bytes={size} md5={md5.hexdigest()}')
                manifest[name]={'bytes':size,'md5':md5.hexdigest(),'sha256':sha.hexdigest(),'url':url.split('?')[0]}
                print('SOURCE_PASS',name,size,manifest[name]['sha256'],flush=True)
                break
              except Exception as exc:
                last=exc; target.unlink(missing_ok=True)
                if attempt==2: raise
                time.sleep(3)
          Path('research/j0740/historical_20261025/source_integrity_20261118.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\\n')
          PY
      - name: Syntax check and reproduce historical weighted KDE-to-KDE update
        run: |
          python -m py_compile research/j0740/historical_20261025/reproduce_historical_legred_update.py
          python research/j0740/historical_20261025/reproduce_historical_legred_update.py
      - name: Create execution and SHA-256 manifest
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          base=Path('research/j0740/historical_20261025')
          code=base/'reproduce_historical_legred_update.py'
          output=base/'J0740_reproduction_20261118.json'
          sources=json.loads((base/'source_integrity_20261118.json').read_text())
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          manifest={
            'status':'PASS_HISTORICAL_REPRODUCTION; NOT_NEW_POSTERIOR',
            'workflow_run_id':os.environ['GITHUB_RUN_ID'],
            'commit_sha':os.environ['GITHUB_SHA'],
            'runner_code_sha256':sha(code),
            'result_json_sha256':sha(output),
            'source_files':sources,
            'reproduction_json':output.name,
            'raw_inputs_in_artifact':False
          }
          (base/'J0740_reproduction_manifest_20261118.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\\n')
          print(json.dumps(manifest,indent=2,sort_keys=True))
          PY
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: j0740-historical-legred-reproduction-20261118
          path: |
            research/j0740/historical_20261025/J0740_reproduction_20261118.json
            research/j0740/historical_20261025/J0740_reproduction_manifest_20261118.json
            research/j0740/historical_20261025/source_integrity_20261118.json
          retention-days: 30
