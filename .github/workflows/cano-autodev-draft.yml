name: CANO bounded draft development worker

on:
  # Manual opt-in only until real owner-scoped end-to-end acceptance.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write # explicitly dispatch the existing secret-free core test workflow

concurrency:
  group: cano-autodev-draft
  cancel-in-progress: false

jobs:
  one-draft:
    if: vars.CANO_AUTODEV_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Verify worker safety contracts before requesting credentials
        run: python -m unittest tests.test_cano_autodev_worker -q
      - name: Install minimal pinned-range worker dependencies
        run: python -m pip install "psycopg[binary]>=3.2,<4" "groq>=0.12,<2" "requests>=2.31,<3"
      - name: Process at most one Neon code job into a draft PR
        env:
          CANO_AUTODEV_ENABLED: 'true'
          CANO_AUTODEV_DATABASE_URL: ${{ secrets.CANO_AUTODEV_DATABASE_URL }}
          CANO_AUTODEV_OWNER_KEY: ${{ secrets.CANO_AUTODEV_OWNER_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          CANO_AUTODEV_MODEL: ${{ vars.CANO_AUTODEV_MODEL }}
        run: python -m scripts.cano_autodev_worker
