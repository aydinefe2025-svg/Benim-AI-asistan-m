name: J0740 F166 derived four-model disjoint suffix integrals
on:
  pull_request:
    branches: [science/j0740-f165-derived-seven-native-integral-20261125]
    paths: ['.github/workflows/j0740-f166-derived-suffix.yml', 'research/j0740/f166/**']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0
      - name: Recover already verified complete posterior and seven previously validated derived RNS witnesses
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/f165-prep"
          for pair in 14914475266:chain 15005136234:ENG 15002814220:MPA1 15004265354:MS1 15004620563:MS1B 15003943855:WFF1 15004458302:WFF2 14408011818:APR4_CAUSAL; do
            id=${pair%:*}; name=${pair#*:}
            curl -fLsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" -o "$RUNNER_TEMP/f165-prep/$name.zip"
          done
      - name: Download SHA-pinned frozen F165 proposal artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fLsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/15004929885/zip" -o "$RUNNER_TEMP/frozen.zip"
      - name: Test fail-closed prefix and native linkage contracts
        run: cd research/j0740/f166 && python -m unittest -v test_f166.py
      - name: Regenerate four unfinished derived EOS proposals and prove every reused prefix
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python research/j0740/f166/prepare.py "$RUNNER_TEMP/f165-prep" "$RUNNER_TEMP/f166-full"
          python research/j0740/f166/split.py "$RUNNER_TEMP/frozen.zip" "$RUNNER_TEMP/f166-full" evidence-f166-proposal
      - uses: actions/upload-artifact@v4
        with:
          name: F166-frozen-suffix-proposals
          path: evidence-f166-proposal/
          if-no-files-found: error
  original_joint_likelihood:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix:
        include:
          - {model: MS1, seed: 352001, offset: 4096}
          - {model: MS1, seed: 352001, offset: 8192}
          - {model: MS1, seed: 352001, offset: 12288}
          - {model: MS1, seed: 352003, offset: 4096}
          - {model: MS1, seed: 352003, offset: 8192}
          - {model: MS1, seed: 352003, offset: 12288}
          - {model: MS1, seed: 352007, offset: 4096}
          - {model: MS1, seed: 352007, offset: 8192}
          - {model: MS1, seed: 352007, offset: 12288}
          - {model: MS1, seed: 352011, offset: 4096}
          - {model: MS1, seed: 352011, offset: 8192}
          - {model: MS1, seed: 352011, offset: 12288}
          - {model: MS1B, seed: 352001, offset: 4096}
          - {model: MS1B, seed: 352001, offset: 8192}
          - {model: MS1B, seed: 352001, offset: 12288}
          - {model: MS1B, seed: 352003, offset: 4096}
          - {model: MS1B, seed: 352003, offset: 8192}
          - {model: MS1B, seed: 352003, offset: 12288}
          - {model: MS1B, seed: 352007, offset: 4096}
          - {model: MS1B, seed: 352007, offset: 8192}
          - {model: MS1B, seed: 352007, offset: 12288}
          - {model: MS1B, seed: 352011, offset: 4096}
          - {model: MS1B, seed: 352011, offset: 8192}
          - {model: MS1B, seed: 352011, offset: 12288}
          - {model: WFF1, seed: 352001, offset: 4096}
          - {model: WFF1, seed: 352003, offset: 4096}
          - {model: WFF1, seed: 352007, offset: 4096}
          - {model: WFF1, seed: 352011, offset: 4096}
          - {model: WFF2, seed: 352001, offset: 4096}
          - {model: WFF2, seed: 352003, offset: 4096}
          - {model: WFF2, seed: 352007, offset: 4096}
          - {model: WFF2, seed: 352011, offset: 4096}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve immutable F146 source bytes and exact member hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence-f165 "$RUNNER_TEMP/f165-input"
          for pair in 14905441131:inputs 14905157121:manifest; do
            id=${pair%:*}; name=${pair#*:}
            curl -fLsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" -o "$RUNNER_TEMP/$name.zip"
          done
          printf '%s  %s\n' ffc877fb69f49c8a23b8494456bf0fe85cc7c45922a684b4d6389f1fe00478e9 "$RUNNER_TEMP/inputs.zip" ef59b3874f4f105b2d1de68396a903026cf957412e645d5cf07d6cd8307c990d "$RUNNER_TEMP/manifest.zip" | sha256sum -c
          python3 - <<'PY'
          import hashlib,json,os,zipfile,pathlib
          tmp=pathlib.Path(os.environ['RUNNER_TEMP'])
          out=tmp/'f165-input'
          with zipfile.ZipFile(tmp/'manifest.zip') as z:
              receipt=json.loads(z.read('input_stage.json'))
          assert receipt['status']=='PASS_ORIGINAL_INPUT_STAGING'
          with zipfile.ZipFile(tmp/'inputs.zip') as z:
              assert set(z.namelist())==set(receipt['selected_members'])
              for name,v in receipt['selected_members'].items():
                  target=out.joinpath(name)
                  assert target.resolve().is_relative_to(out.resolve())
                  target.parent.mkdir(parents=True,exist_ok=True)
                  h=hashlib.sha256()
                  count=0
                  with z.open(name) as src,target.open('wb') as dst:
                      for b in iter(lambda:src.read(1048576),b''):
                          h.update(b); count+=len(b); dst.write(b)
                  assert count==v['bytes'] and h.hexdigest()==v['sha256'],name
          root=out/'J0740_GAMMA_zenodo'
          mod=root/'STU/STU_NICER_XMM_hr/STU_modules'
          lines=[]
          for line in (mod/'config.ini').read_text().splitlines():
              if line.strip()=='--multinest':continue
              if '=' in line:
                  key,old=line.split('=',1)
                  if key=='--NICER-matrix-path':
                      path=tmp/'F165_generated_counts.txt'
                      assert not path.exists()
                  else:
                      matches=list(root.rglob(pathlib.Path(old).name))
                      assert len(matches)==1,(key,matches)
                      path=matches[0]
                  line=key+'='+str(path)
              lines.append(line)
          assert '--NICER' in lines and '--XMM' in lines
          (tmp/'f165_config.ini').write_text('\n'.join(lines)+'\n')
          pathlib.Path('evidence-f165/input_verification.json').write_text(json.dumps({'source_artifact_id':14905441131,'verified_members':len(receipt['selected_members']),'selected_bytes':receipt['selected_bytes'],'generated_matrix_initially_absent':True,'sampler_enabled':False},indent=2))
          PY
          cp "$RUNNER_TEMP/f165_config.ini" evidence-f165/config_relocated.ini
      - name: Install GSL development library
        run: sudo apt-get update -qq && sudo apt-get install -y libgsl-dev
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: xpsi-legacy
          init-shell: bash
          cache-environment: false
          condarc: |
            channels:
              - defaults
              - conda-forge
            channel_priority: flexible
          create-args: >-
            python=2.7
            numpy=1.16.5
            scipy=1.2.1
            cython=0.28.5
            matplotlib=2.2.3
            wrapt=1.11.2
            setuptools=44.0.0
            six
      - name: Compile X-PSI v1.2.0 (publisher run version)
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.2.0 https://github.com/xpsi-group/xpsi.git "$RUNNER_TEMP/xpsi-v1.2.0"
          git -C "$RUNNER_TEMP/xpsi-v1.2.0" rev-parse HEAD | tee evidence-f165/source_commit.txt
          test "$(cat evidence-f165/source_commit.txt)" = 78880035d0a8aba021761266327dc17e28cd4ed6
          cd "$RUNNER_TEMP/xpsi-v1.2.0"
          python - <<'PY'
          import os
          p='xpsi/likelihoods/default_background_marginalisation.pyx'
          s=open(p).read()
          a='        if limit > 0.0:\\n            LOGLIKE = llzero * (0.1 + 0.9 * np.random.rand(1))\\n            break'.replace('\\n','\n')
          b='        if limit > 0.0:\\n            print("F165_HIGH_COUNTS_CUTOFF", i, limit, av_STAR * SCALE, av_DATA)\\n            if not os.environ.get("F165_BYPASS_CUTOFF"):\\n                LOGLIKE = llzero * (0.1 + 0.9 * np.random.rand(1))\\n                break'.replace('\\n','\n')
          assert s.count(a)==1
          s=s.replace(a,b)
          a='            else:\\n                LOGLIKE = llzero * (0.1 + 0.9 * np.random.rand(1))\\n                break'.replace('\\n','\n')
          assert s.count(a)==1
          s=s.replace(a,'            else:\\n                print("F165_QUADRATURE_NONPOSITIVE", i, result, abserr)\\n                LOGLIKE = llzero * (0.1 + 0.9 * np.random.rand(1))\\n                break'.replace('\\n','\n'))
          s=s.replace('import numpy as np','import os\nimport numpy as np',1)
          open(p,'w').write(s)
          PY
          git diff -- xpsi/likelihoods/default_background_marginalisation.pyx > "$GITHUB_WORKSPACE/evidence-f165/explicit_source_patch.diff"
          CC=gcc python setup.py install --NumHot > "$GITHUB_WORKSPACE/evidence-f165/build.log" 2>&1 || { tail -120 "$GITHUB_WORKSPACE/evidence-f165/build.log"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: F166-frozen-suffix-proposals
          path: ${{ runner.temp }}/f165-proposals
      - name: Evaluate independent real rotating-curve photons
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MODEL: ${{ matrix.model }}
          SEED: ${{ matrix.seed }}
          OFFSET: ${{ matrix.offset }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/f165-input/J0740_GAMMA_zenodo/STU/STU_NICER_XMM_hr/STU_modules"
          printf '%s  %s\n' 440451fd57c8d8c775f3c847861d6fce77a82ab975ca090fb660289191d8c1af main_lp40k_Xse001_Dfix.py | sha256sum -c
          PYTHONPATH="$GITHUB_WORKSPACE/research/j0740/f150" python -u "$GITHUB_WORKSPACE/research/j0740/f165/native.py" "$RUNNER_TEMP/f165_config.ini" "$RUNNER_TEMP/f165-proposals/${MODEL}_${SEED}_${OFFSET}.json" "$GITHUB_WORKSPACE/evidence-f165/native.json" 2>&1 | tee "$GITHUB_WORKSPACE/evidence-f165/native.log"
          grep -F F165_NATIVE_COMPLETE "$GITHUB_WORKSPACE/evidence-f165/native.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: F166-${{ matrix.model }}-${{ matrix.seed }}-${{ matrix.offset }}
          path: evidence-f165/
          if-no-files-found: error
  audit:
    needs: original_joint_likelihood
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.3.5 scipy==1.17.0
      - uses: actions/download-artifact@v4
        with:
          name: F166-frozen-suffix-proposals
          path: proposals
      - uses: actions/download-artifact@v4
        with:
          pattern: F166-*-35*-*
          path: suffix-receipts
      - name: Recover only already evaluated F165 prefixes with published SHA256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p old-receipts
          for row in 15012903922:F165-WFF1-352011:6ccd427420bb338b60872d45eb5ad7116159ba4e0431d39cb2507ba6152170d3 15012372101:F165-WFF1-352007:cdfdc870bdf01f23efe5b88c7ac43415cc2b2f40c1ebcc045842cbf2618d8be6 15012187416:F165-MS1B-352007:d3f2e2fc771ed618caaba3f258a27b265ddfd63c5b17f9e0c9e29809a0f93982 15011309907:F165-WFF2-352011:d1b46eb53069a0cd7d0b1341913162314d3dfdcd71f7d3bd14b90069d3a62ae3 15010306240:F165-MS1-352003:eb74e54b775c2ac81dd4b98ad91c1b5b2d832bcfdbcbd79ba72a35e7ffdff24a 15009832048:F165-WFF2-352003:2b98bb7d85077e4aa3bf60ac71a38e8ea204718f76ec6d95c9bc148199752b3a 15009772396:F165-WFF2-352001:a9bb270c6afadd74c57c7e539131fa4081e46a043f4ff6294277c3f051fffea6 15009602996:F165-MS1-352001:456534c9b7533504d0172c452ae3ed18ff64ddee5a7b2d5522318f11e6abc7f2 15009198509:F165-MS1-352011:d6d34282e62251ea57c9e972f90e2e63d66cd46551d7d533fd4699602d59d46a 15009036543:F165-WFF1-352003:0c77625afd0f68eddbdc7f7b492fa38d45997a51c28cc3821011facc93d6dd80 15008785261:F165-MS1B-352011:d573f8aabc4de9346e65c019db7af7e10aed213feddf176b7f564b5d073c968b 15008714340:F165-MS1B-352001:4fa58e2ea43ea0eb1570a318b72fc2d3a38cd3146ddad7aada132f8b87581437 15008383596:F165-MS1-352007:6555c89fd69075e9cc9473992f0cbf22563982c1abd0ea8670c19a2351e2f806 15008356521:F165-WFF2-352007:0b0f1bad485fb10d86f1e88d3fa3eb5c10ebab83d33309524bee7af457a19475 15007683206:F165-WFF1-352001:3528e8935325cc01eeb283c8c4d815ecc4c6bcd73c7f2f65deedfd1d92f86bb3 15007168531:F165-MS1B-352003:94b3e8ebf7e67bce9affbcc1a15778a9df29478f1136613f5e9e02df9f67d8e2; do
            IFS=: read -r id name digest <<< "$row"
            curl -fLsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" -o "old-receipts/$name.zip"
            printf '%s  %s\n' "$digest" "old-receipts/$name.zip" | sha256sum -c
          done
      - run: python research/j0740/f166/audit.py proposals old-receipts suffix-receipts F166_acceptance.json
      - uses: actions/upload-artifact@v4
        with:
          name: F166-independent-acceptance
          path: F166_acceptance.json
          if-no-files-found: error
