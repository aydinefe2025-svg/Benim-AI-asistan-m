name: Credential fallback regression

on:
  pull_request:
    paths:
      - 'core/provider_config.py'
      - 'tests/test_credential_fallback_regression.py'
      - '.github/workflows/credential-fallback.yml'
  push:
    branches:
      - 'test/issue48-credential-fallback-regression'
    paths:
      - 'core/provider_config.py'
      - 'tests/test_credential_fallback_regression.py'
      - '.github/workflows/credential-fallback.yml'

jobs:
  credential-fallback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run credential fallback regression tests
        run: python -m unittest discover -s tests -p 'test_credential_fallback_regression.py' -v
