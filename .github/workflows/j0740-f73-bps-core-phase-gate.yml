name: J0740 F73 original BPS vs F67 global chemical-potential phase gate
on:
  pull_request:
    branches:
      - science/j0740-apr4-firstlaw-gr-pilot-20261117
    paths:
      - 'research/j0740/f73/**'
      - '.github/workflows/j0740-f73-bps-core-phase-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source-thermodynamic-phase-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin all numerical libraries
        run: python -m pip install 'numpy==2.3.5' 'scipy==1.16.3'
      - name: Reject data-source drift before running model
        shell: bash
        run: |
          set -euo pipefail
          echo 'a4195d48ae98fd64d0a9676891ccab5a5c035e713780ad1187e85571a98a1787  research/j0740/physical_eos_validation/JESTER_BPS_crust_e6768650.csv' | sha256sum -c -
          echo 'd3c4388ef18ab645d410672da3d886d2b9bda446236c2cc4784024fe3be39f22  research/j0740/physical_eos_validation/F67_MPA1_PCHIP_COLD_relative_thermo_20261119.dat' | sha256sum -c -
      - name: Run nine adversarial plus real-source physical-gate tests
        run: python -m unittest discover -s research/j0740/f73 -p 'test_f73_*.py' -v
      - name: Execute real BPS knot and F67 PCHIP first-law phase selection
        run: |
          python -u research/j0740/f73/f73_bps_f67_global_phase_gate.py \
            --out results/F73/F73_BPS_F67_global_phase_join_gate_20261119.json
      - name: Prohibit false physical EOS certification
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib
          x=json.loads(pathlib.Path('results/F73/F73_BPS_F67_global_phase_join_gate_20261119.json').read_text())
          assert x['status']=='NUMERIC_SOURCE_LOCK_PASS_SINGLE_GLOBALLY_STABLE_BPS_F67_SWITCH_EXCLUDED'
          assert x['physical_original_MPA1_certification']=='NOT_ESTABLISHED'
          assert x['source_native_XPSI_and_seven_original_EOS_Bayes']=='NOT_RUN'
          assert x['at_native_BPS_upper_endpoint']['inward_density_step_admissible_at_mu_match'] is False
          assert not x['candidate_brackets_and_global_gate']['single_switch_to_core_compatible_with_upper_endpoint']
          assert len(x['candidate_brackets_and_global_gate']['candidate_sign_change_brackets_in_scanned_range'])>=2
          print('F73 actual-source BPS/F67 global phase test PASS — no physical-EOS false admission')
          PY
      - name: Record exact source and output hashes
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          paths=list(pathlib.Path('results/F73').glob('*.json'))+[
             pathlib.Path('research/j0740/physical_eos_validation/JESTER_BPS_crust_e6768650.csv'),
             pathlib.Path('research/j0740/physical_eos_validation/F67_MPA1_PCHIP_COLD_relative_thermo_20261119.dat'),
             pathlib.Path('research/j0740/f73/f73_bps_f67_global_phase_gate.py')]
          records={str(p):{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
             for p in paths if p.exists()}
          pathlib.Path('results/F73').mkdir(parents=True,exist_ok=True)
          pathlib.Path('results/F73/F73_CI_SHA256_manifest.json').write_text(json.dumps(records,sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: J0740-F73-native-BPS-F67-global-phase-gate-or-failure
          path: results/F73/
          retention-days: 90
          if-no-files-found: warn
