name: Battery Graz original 10 EIS spreadsheets source audit
on:
  pull_request:
    paths:
      - 'research/battery_curve_audit/graz_eis_2026_source_audit.py'
      - 'research/battery_curve_audit/graz_eis_2026_same_cell_delta.py'
      - 'tests/test_graz_eis_2026_source_audit.py'
      - 'tests/test_graz_eis_same_cell_delta.py'
      - '.github/workflows/battery-graz-2026-eis-original-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-publisher-eis-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reject fake, nonfinite, duplicate, and malformed OOXML
        run: python -m unittest tests.test_graz_eis_2026_source_audit tests.test_graz_eis_same_cell_delta -v
      - name: Fetch exactly ten publisher original EIS XLSX, check MD5 and ZIP CRC, inspect actual sheets
        run: python -m research.battery_curve_audit.graz_eis_2026_source_audit /tmp/cano_graz_original_eis_10_source_layout.json
      - name: Compare five actual EIS stages within each of ten ORIGINAL workbooks
        run: python -m research.battery_curve_audit.graz_eis_2026_same_cell_delta /tmp/cano_graz_original_eis_10_stage_comparison.json
      - name: Enforce ten genuine source IDs with numerical workbook data and no false certification
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/cano_graz_original_eis_10_source_layout.json')
          d=json.loads(p.read_text())
          assert d['record_id']==18213931
          assert d['source_workbook_count']==10
          assert d['all_publisher_md5_and_zip_crc_verified'] is True
          assert d['sum_source_numeric_cells']>100
          assert len({x['publisher_filename'] for x in d['source_spreadsheet_details']})==10
          assert all(x['sheet_count']>=1 and x['numeric_source_cell_count']>1 for x in d['source_spreadsheet_details'])
          for key in ('same_specimen_repeated_eis_levels_authenticated','absolute_eis_calibration_verified','original_physical_pre_post_capacity_measured','EIS_is_capacity','field_FPR_FNR_established','production_release_allowed'):
              assert d[key] is False
          e=json.loads(Path('/tmp/cano_graz_original_eis_10_stage_comparison.json').read_text())
          assert e['publisher_workbooks_checked']==10
          assert e['total_original_eis_spectrum_triplets']==5050
          assert len(e['cell_stage_data'])==10
          assert len({c['filename'] for c in e['cell_stage_data']})==10
          for c in e['cell_stage_data']:
              assert len(c['stages'])==5
              assert all(p['spectrum_rows']==101 for p in c['stages'])
              assert c['stages'][0]['median_impedance_magnitude_change_pct']==0
              assert c['stages'][0]['positive_frequency_point_count']==0
              assert c['stages'][0]['negative_frequency_point_count']==0
          for key in ('instrument_calibration_independently_verified','mechanical_force_calibration_independently_verified','actual_capacity_Ah_measured','field_FPR_FNR_established','production_release_allowed'):
              assert e[key] is False
          print('GRAZ_ORIGINAL_10_EIS_WORKBOOKS_VERIFIED_REAL_SHEETS', d['sum_source_numeric_cells'])
          print('GRAZ_REAL_5050_EIS_SAME_CELL_STAGE_COMPARISONS',e['cross_cell_description_not_causal'])
          PY
      - name: Save redacted real publisher EIS workbook structure only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: graz-2026-ten-original-eis-source-layout
          path: |
            /tmp/cano_graz_original_eis_10_source_layout.json
            /tmp/cano_graz_original_eis_10_stage_comparison.json
          retention-days: 7
          if-no-files-found: error