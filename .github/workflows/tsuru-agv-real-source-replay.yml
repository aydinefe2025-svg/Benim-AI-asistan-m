name: TSURU AGV original-source replay (real bytes)
on:
  pull_request:
    paths:
      - research/tsuru_agv_real_source_ci.py
      - research/birds_eps_constellation_qc.py
      - research/agv_temp_stratified_qc.py
      - research/test_agv_temp_stratified_qc.py
      - .github/workflows/tsuru-agv-real-source-replay.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-original-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Verify source identities and replay real TSURU and AGV
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python research/tsuru_agv_real_source_ci.py
      - name: Verify UGUISU RAAVANA NEPALISAT original XLSX source bytes, CRC and numeric QC
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python research/birds_eps_constellation_qc.py
      - name: Test matched-temperature algorithm with synthetic controls
        run: python -m unittest discover -s research -p 'test_agv_temp_stratified_qc.py' -v
      - name: Verify AGV source again and audit temperature-matched year contrasts
        run: python research/agv_temp_stratified_qc.py
      - name: Retain independently inspectable source replay receipt
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: four-birds-eps-agv-original-python-receipts
          path: |
            TSURU_AGV_REAL_SOURCE_CI_RECEIPT.json
            BIRDS_FOUR_EPS_CI_RECEIPT.json
            AGV_TEMP_MATCHED_REAL_SOURCE_RECEIPT.json
          if-no-files-found: error
          retention-days: 30
