name: TSURU AGV original-source replay (real bytes)
on:
  pull_request:
    paths:
      - research/tsuru_agv_real_source_ci.py
      - research/birds_eps_constellation_qc.py
      - research/birds_manuscript_population_guard.py
      - research/test_birds_manuscript_population_guard.py
      - research/birds_published_panel_rules.py
      - research/test_birds_published_panel_rules.py
      - research/agv_temp_stratified_qc.py
      - research/test_agv_temp_stratified_qc.py
      - research/agv_day_cluster_common_support.py
      - research/test_agv_day_cluster_common_support.py
      - research/agv_month_pair_block_sensitivity.py
      - research/test_agv_month_pair_block_sensitivity.py
      - .github/workflows/tsuru-agv-real-source-replay.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-original-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Verify source identities and replay real TSURU and AGV
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python research/tsuru_agv_real_source_ci.py
      - name: Verify UGUISU RAAVANA NEPALISAT original XLSX source bytes, CRC and numeric QC
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python research/birds_eps_constellation_qc.py
      - name: Confirm 2022 paper's 8439 manually labelled samples do not match current original source population
        run: |
          python -m unittest discover -s research -p 'test_birds_manuscript_population_guard.py' -v
          python research/birds_manuscript_population_guard.py
      - name: Test matched-temperature algorithm with synthetic controls
        run: python -m unittest discover -s research -p 'test_agv_temp_stratified_qc.py' -v
      - name: Verify AGV source again and audit temperature-matched year contrasts
        run: python research/agv_temp_stratified_qc.py
      - name: Test day clusters and exact source-row common support with synthetic controls
        run: python -m unittest discover -s research -p 'test_agv_day_cluster_common_support.py' -v
      - name: Reproduce AGV common-support and day-cluster audit from publisher CSV
        run: python research/agv_day_cluster_common_support.py
      - name: Test month-pair block resampling and missing-support rejection
        run: python -m unittest discover -s research -p 'test_agv_month_pair_block_sensitivity.py' -v
      - name: Audit original AGV with paired-month block sensitivity and retain numerical receipt
        run: python research/agv_month_pair_block_sensitivity.py
      - name: Test published panel alert boundaries with controlled synthetic rows
        run: python -m unittest discover -s research -p 'test_birds_published_panel_rules.py' -v
      - name: Reproduce literature screen on all four original BIRDS EPS sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python research/birds_published_panel_rules.py
      - name: Retain independently inspectable source replay receipt
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: four-birds-eps-agv-original-python-receipts
          path: |
            TSURU_AGV_REAL_SOURCE_CI_RECEIPT.json
            BIRDS_FOUR_EPS_CI_RECEIPT.json
            BIRDS_2022_PAPER_POPULATION_CONCORDANCE_RECEIPT.json
            BIRDS_FOUR_PUBLISHED_PANEL_RULES_SCREEN_RECEIPT.json
            AGV_TEMP_MATCHED_REAL_SOURCE_RECEIPT.json
            AGV_DAY_CLUSTER_COMMON_SUPPORT_RECEIPT.json
            AGV_PAIRED_MONTH_BLOCK_SENSITIVITY_RECEIPT.json
          if-no-files-found: error
          retention-days: 30

  verify-original-sources-windows:
    runs-on: windows-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Verify original TSURU and AGV publisher source identity on Windows
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python research/tsuru_agv_real_source_ci.py
      - name: Verify other three original BIRDS XLSX source books on Windows
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python research/birds_eps_constellation_qc.py
      - name: Confirm 2022 paper's 8439 manually labelled samples do not match current original source population
        run: |
          python -m unittest discover -s research -p 'test_birds_manuscript_population_guard.py' -v
          python research/birds_manuscript_population_guard.py
      - name: Run temperature sensitivity regression controls on Windows
        run: python -m unittest discover -s research -p 'test_agv_temp_stratified_qc.py' -v
      - name: Reproduce AGV temperature-stratified original-source contrast on Windows
        run: python research/agv_temp_stratified_qc.py
      - name: Run common-support and clustered-day regression controls on Windows
        run: python -m unittest discover -s research -p 'test_agv_day_cluster_common_support.py' -v
      - name: Reproduce original AGV day-cluster and common-support audit on Windows
        run: python research/agv_day_cluster_common_support.py
      - name: Test month-pair block resampling on hosted Windows
        run: python -m unittest discover -s research -p 'test_agv_month_pair_block_sensitivity.py' -v
      - name: Replay original AGV paired-month block sensitivity on Windows
        run: python research/agv_month_pair_block_sensitivity.py
      - name: Test published panel alert boundaries with controlled synthetic rows
        run: python -m unittest discover -s research -p 'test_birds_published_panel_rules.py' -v
      - name: Reproduce literature screen on all four original BIRDS EPS sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python research/birds_published_panel_rules.py
      - name: Retain Windows source replay proof
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: four-birds-eps-agv-original-python-receipts-windows
          path: |
            TSURU_AGV_REAL_SOURCE_CI_RECEIPT.json
            BIRDS_FOUR_EPS_CI_RECEIPT.json
            BIRDS_2022_PAPER_POPULATION_CONCORDANCE_RECEIPT.json
            BIRDS_FOUR_PUBLISHED_PANEL_RULES_SCREEN_RECEIPT.json
            AGV_TEMP_MATCHED_REAL_SOURCE_RECEIPT.json
            AGV_DAY_CLUSTER_COMMON_SUPPORT_RECEIPT.json
            AGV_PAIRED_MONTH_BLOCK_SENSITIVITY_RECEIPT.json
          if-no-files-found: error
          retention-days: 30
