          echo '75b661468c94bf3b3c3e7fc073a8e808e25687b1e45eacdba3d33ae5b7bad42f  prefix.zip' | sha256sum -c
          unzip -q prefix.zip -d fresh-receipts/F168-MS1-368003-12288
