          curl -fLsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/15036992654/zip" -o prefix.zip
          echo '0b5588d730db48a306a051a833d362ae7efc02facd4cc9ba0782f465e35d1f7f  prefix.zip' | sha256sum -c
