name: J0740 consistent monotone Steffen EOS candidate tests
on:
  pull_request:
    paths:
      - "research/j0740/rotating_gr/consistent_eos.py"
      - "research/j0740/rotating_gr/steffen_interpolant.py"
      - "research/j0740/rotating_gr/test_consistent_steffen_eos.py"
      - ".github/workflows/j0740-consistent-steffen-eos.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  thermodynamic-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy scipy
      - name: Test monotonicity, low-pressure crust, causality and h(P) inversion
        working-directory: research/j0740/rotating_gr
        run: python -m unittest -v test_consistent_steffen_eos
