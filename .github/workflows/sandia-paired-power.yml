name: Sandia exact matched photovoltaic power
on:
  pull_request:
    paths:
      - research/eps_lab_v4/pair_audit.py
      - research/eps_lab_v4/test_pair_audit.py
      - .github/workflows/sandia-paired-power.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: research/eps_lab_v4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python -m unittest -v test_pair_audit
      - run: python sandia_ingest.py
      - run: python pair_audit.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sandia-paired-power-receipt
          path: research/eps_lab_v4/SANDIA_PAIRED_POWER_RECEIPT.json
          if-no-files-found: error
          retention-days: 30
