name: J0740 F126 same-density independent native RNS C seed
on:
  pull_request:
    branches:
      - science/j0740-apr4-firstlaw-gr-pilot-20261117
    paths:
      - 'research/j0740/f126/**'
      - '.github/workflows/j0740-f126-same-density-one-seed.yml'
permissions:
  contents: read
  actions: read
jobs:
  one_c_same_density_diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rns-alberta/rns
          ref: 97e85d325a33e37f702306414533f6cd77812477
          path: rns-upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Obtain exact source F124 artifact and its nested proof chain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p results/F124 results/F126
          curl -fLsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14774015248/zip" -o results/F124/F124_artifact.zip
          printf '%s  %s\n' d82d43d5b72d9d2f7e7ee90f4163bf308905ec2dfca9d5c709885976e42fb196 results/F124/F124_artifact.zip | sha256sum -c -
      - name: Pin immutable F99 EOS and source C/RNS commit
        run: |
          set -euo pipefail
          cp research/j0740/f104/F99_DERIVED_1981_node_causal_cold_affine_EOS.rns m99.rns
          printf '%s  %s\n' c99eadee07bf6cbbf78f59b6171ef7e21ffad7d034f4ca4e9b7d85d36d9b4331 m99.rns | sha256sum -c -
          test "$(git -C rns-upstream rev-parse HEAD)" = '97e85d325a33e37f702306414533f6cd77812477'
      - name: Verify precise F124 baseline and fail-closed seed test suite
        env:
          F124_ARTIFACT_ZIP: results/F124/F124_artifact.zip
          F99_EOS_PATH: m99.rns
        run: |
          set -euo pipefail
          python -m unittest discover -s research/j0740/f126 -p 'test_*.py' -v
      - name: Build exact RNS C on identical 3001x6001 mesh
        run: |
          set -euo pipefail
          cp -a rns-upstream rns3001
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, "research/j0740/f81")
          from f81_exact_mass_spin import patch_print_only
          p = Path("rns3001/rns.c")
          p.write_text(patch_print_only(p.read_text()))
          mf = Path("rns3001/makefile")
          t = mf.read_text()
          old = "HIGHSIZE=-DMDIV=151 -DSDIV=301"
          assert t.splitlines().count(old) == 1
          mf.write_text(t.replace(old, "HIGHSIZE=-DMDIV=3001 -DSDIV=6001", 1))
          PY
          make -C rns3001 CC='gcc -include stdlib.h' rns
          sha256sum rns3001/rns | tee results/F126/F126_RNS_C_BINARY_SHA256.txt
      - name: Run one genuinely NEW low-neighbor seed at the EXACT F124 high-root density
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          python -u research/j0740/f126/f126_same_density_seed_probe.py \
            --f124 results/F124/F124_artifact.zip --eos m99.rns \
            --rns "$GITHUB_WORKSPACE/rns3001/rns" \
            --out results/F126/F126_SAME_DENSITY_LOW_SEED.json \
            2>&1 | tee results/F126/F126_SAME_DENSITY_LOW_SEED.log
      - name: Preserve old F124 proof and all new C evidence including fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: J0740-F126-same-density-native-RNS-C-seed
          path: |
            results/F124/F124_artifact.zip
            results/F126/
          if-no-files-found: warn
