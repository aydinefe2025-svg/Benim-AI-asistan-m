name: J0740 causal APR4 constant-J rotating stability gate F37
on:
  push:
    branches:
      - science/j0740-apr4-firstlaw-gr-pilot-20261117
    paths:
      - research/j0740/physical_eos/apr4_causal_fixed_J_turning.py
      - .github/workflows/j0740-apr4-causal-fixed-J.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: j0740-causal-apr4-fixed-J
  cancel-in-progress: false
jobs:
  fixed-J-turning:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: rns-alberta/rns
          ref: 97e85d325a33e37f702306414533f6cd77812477
          path: rns-upstream
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: nuclear-multimessenger-astronomy/jester
          ref: e6768650ce992abfd1153a6833857572fe5cd230
          path: jester-upstream
          sparse-checkout: |
            jesterTOV/tabulated_eos/lalsuite
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Exact source dependencies
        run: |
          python -m pip install numpy scipy
          mkdir -p results/source results/work
          python -m pip download 'lalsuite==7.26.4' --no-deps --only-binary=:all: --dest results/source
      - name: Recover F36 exact native causal EOS with all source hashes
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile,sys
          sys.path.insert(0,"research/j0740/physical_eos")
          sys.path.insert(0,"research/j0740/rotating_gr")
          import native_lalsuite_apr4_causal_model as native
          from apr4_causal_rns_root import validate_source,make_rows
          from jester_to_rns import write_rns
          wheel,=list(Path("results/source").glob("lalsuite-7.26.4-*.whl"))
          assert native.sha256(wheel)==native.LAL_WHEEL_SHA
          with zipfile.ZipFile(wheel) as z:
              names=[s for s in z.namelist() if s.endswith("LALSimNeutronStarEOS_APR4_EPP.dat")]
              assert len(names)==1
              table=Path("results/source/LALSimNeutronStarEOS_APR4_EPP_7.26.4.dat")
              table.write_bytes(z.read(names[0]))
          assert native.sha256(table)==native.LAL_TABLE_SHA
          npz=Path("jester-upstream/jesterTOV/tabulated_eos/lalsuite/APR4_EPP.npz")
          mavg=validate_source(table,npz)
          eos=native.NativeAPR4CausalEOS(table)
          rows,meta=make_rows(eos,mavg,196)
          path=Path("results/work/APR4_CAUSAL_7p26p4_196.rns")
          write_rns(path,rows)
          assert native.sha256(path)=="623be1716201463c775e8bfc4b560f4646ecbbac14ba30335599ea38311e4a19"
          print("EXACT_F36_CAUSAL_EOS_TABLE_REPRODUCED")
          PY
      - name: F37 parser and physics guardrail unit tests
        run: python research/j0740/physical_eos/apr4_causal_fixed_J_turning.py --mode selftest
      - name: Add only J output to pinned RNS printf, no solver arithmetic modifications
        run: |
          python research/j0740/physical_eos/apr4_causal_fixed_J_turning.py \
            --mode patch --source rns-upstream/rns.c \
            --out results/J_output_patch.json
      - name: Compile full C GR solver fine 201x401 spatial mesh
        run: |
          make -C rns-upstream CC='gcc -include stdlib.h' HIGHSIZE='-DMDIV=201 -DSDIV=401' rns
      - name: RNS real fixed angular momentum J sequence and mass turning-bracket
        run: |
          python research/j0740/physical_eos/apr4_causal_fixed_J_turning.py \
            --mode run \
            --table results/work/APR4_CAUSAL_7p26p4_196.rns \
            --binary rns-upstream/rns \
            --patch-report results/J_output_patch.json \
            --out results/J0740_CAUSAL_APR4_CONSTANT_J_TURNING.json
      - name: Preserve original numerical J sequence and failure trace
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: j0740-causal-apr4-fixed-J-turning-F37
          path: |
            results/J0740_CAUSAL_APR4_CONSTANT_J_TURNING.json
            results/J_output_patch.json
            results/work/APR4_CAUSAL_7p26p4_196.rns
          if-no-files-found: warn
          retention-days: 30
