name: LCO publisher original capacity and deformation replay
on:
  pull_request:
    paths:
      - 'research/battery_curve_audit/lco_source_native_capacity_deformation.py'
      - '.github/workflows/lco-source-native-capacity-deformation.yml'
permissions:
  contents: read
jobs:
  source-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify original Windows evidence archive bytes and all member hashes
        run: |
          mkdir -p /tmp/lco-transferred
          python - <<'PY'
          import hashlib,json,pathlib,zipfile,shutil
          root=pathlib.Path('research/battery_curve_audit/transfer_evidence')
          out=pathlib.Path('/tmp/lco-transferred')
          specs={
            'LCO_PREFIX_WARNING_REAL_EVIDENCE_20261125.zip':('206071beff6b44ffe315d0ad364ae59f94927d445f6dc5614cc30928b01dd534',8),
            'LCO_DYNAMIC_GUARDED_REAL_EVIDENCE_20261125.zip':('46aabbe83396e23f620f39b1e0f3dada8e7ee2e7b1a2ecf02a0035f7fc88d39a',10)}
          receipt={}
          for n,(digest,count) in specs.items():
              p=root/n; b=p.read_bytes()
              assert hashlib.sha256(b).hexdigest()==digest
              with zipfile.ZipFile(p) as z:
                  assert z.testzip() is None
                  manifest=json.loads(z.read('SHA256_MANIFEST.json'))
                  assert len(manifest)==count
                  assert all(hashlib.sha256(z.read(k)).hexdigest()==v for k,v in manifest.items())
              shutil.copyfile(p,out/n)
              receipt[n]={'bytes':len(b),'sha256':digest,'members_verified':count}
          (out/'transfer_receipt.json').write_text(json.dumps(receipt,indent=2))
          print(json.dumps(receipt))
          PY
      - name: Export exact Windows evidence for durable archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lco-windows-exact-evidence-transfer
          path: /tmp/lco-transferred/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Scientific parser dependencies
        run: python -m pip install 'numpy==2.2.6' 'scipy==1.15.3'
      - name: Source checksum and physical-unit numerical replay
        run: python research/battery_curve_audit/lco_source_native_capacity_deformation.py /tmp/lco-result
      - name: Independently replay dynamic alarm rules on Linux from original source
        run: |
          mkdir -p /tmp/lco-dynamic/evidence
          python - <<'PY'
          import zipfile,pathlib
          z=zipfile.ZipFile('/tmp/lco-transferred/LCO_DYNAMIC_GUARDED_REAL_EVIDENCE_20261125.zip')
          out=pathlib.Path('/tmp/lco-dynamic')
          for n in ('lco_dynamic_voltage_warning.py','lco_dynamic_guarded_warning.py','lco_dynamic_verify.py'):
              (out/n).write_bytes(z.read(n))
          (out/'evidence'/'Aging_Dataset_Cycling.mat').symlink_to('/tmp/Aging_Dataset_Cycling.mat')
          PY
          cd /tmp/lco-dynamic
          python lco_dynamic_guarded_warning.py > /tmp/lco-dynamic-run.log
          python lco_dynamic_verify.py
          python - <<'PY'
          import json,zipfile,pathlib,math
          z=zipfile.ZipFile('/tmp/lco-transferred/LCO_DYNAMIC_GUARDED_REAL_EVIDENCE_20261125.zip')
          orig=json.loads(z.read('evidence/LCO_GUARDED_DYNAMIC_RECEIPT_20261125.json'))
          new=json.loads(pathlib.Path('evidence/LCO_GUARDED_DYNAMIC_RECEIPT_20261125.json').read_text())
          assert new['source_sha256']==orig['source_sha256']
          assert new['rules']==orig['rules'] and new['n']==orig['n']==97
          assert new['trace_rows']==orig['trace_rows']==4841
          assert len(new['events'])==len(orig['events'])==4
          for a,b in zip(new['events'],orig['events']):
              assert (a['cycle'],a['repeat'])==(b['cycle'],b['repeat'])
              assert all(math.isclose(a[k],b[k],abs_tol=1e-8) for k in a if k.endswith('_lead_s'))
          result={'source_sha256':new['source_sha256'],'rules_match':True,'event_leads_match':True,'n':97,'trace_rows':4841,'rules':new['rules'],'events':new['events'],'production_release':False}
          pathlib.Path('/tmp/lco-dynamic/cross_platform_receipt.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result))
          PY
      - name: Export Linux dynamic independent replay
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lco-linux-dynamic-replay
          path: |
            /tmp/lco-dynamic/LCO_DYNAMIC_GUARDED_REAL_EVIDENCE_20261125.zip
            /tmp/lco-dynamic/cross_platform_receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Save actual source evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lco-real-capacity-and-laser-deformation
          path: /tmp/lco-result/
          if-no-files-found: warn
          retention-days: 14
