name: CANO-R1 isolated CAD simulation acceptance
on:
  pull_request:
    paths:
      - 'research/robotics/cano_r1/**'
      - '.github/workflows/cano-r1-cad-beta.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cad-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare free CAD and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openscad
          python -m pip install --disable-pip-version-check -r research/robotics/cano_r1/requirements.txt
      - name: Compile six original CAD solids
        working-directory: research/robotics/cano_r1
        run: |
          mkdir -p meshes results
          for part in base yaw upper forearm wrist gripper; do
            openscad -o "meshes/$part.stl" -D "part=\"$part\"" cad/CANO_R1_PARAMETRIC.scad
          done
      - name: Generate URDF and run isolated tests (never deploy)
        working-directory: research/robotics/cano_r1
        env:
          PYTHONPATH: .
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python generate_urdf.py
          python -m unittest discover -s tests -v
          python - <<'PY'
          from release_gate import release_status
          s=release_status()
          assert s['physical_release_allowed'] is False
          print('Hardware gate remains LOCKED, as required')
          PY