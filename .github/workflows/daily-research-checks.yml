name: Daily research checks
on:
  pull_request:
    paths:
      - 'scripts/daily_research.py'
      - 'tests/test_daily_research.py'
      - 'core/public_research.py'
      - '.github/workflows/daily-research-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_daily_research.py' -v
