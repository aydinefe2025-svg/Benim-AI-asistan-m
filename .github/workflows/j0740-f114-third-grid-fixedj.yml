name: J0740 F114 third-grid fixed-J root comparison
on:
  pull_request:
    branches:
      - science/j0740-apr4-firstlaw-gr-pilot-20261117
    paths:
      - 'research/j0740/f114/**'
      - '.github/workflows/j0740-f114-third-grid-fixedj.yml'
permissions:
  contents: read
  actions: read
jobs:
  third_grid_fixed_j_roots:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rns-alberta/rns
          ref: 97e85d325a33e37f702306414533f6cd77812477
          path: rns-upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical dependencies
        run: python -m pip install 'numpy==2.3.5' 'scipy==1.16.3'
      - name: Retrieve and checksum F113 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p results/F113 results/F114
          curl -fLsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14758007723/zip" -o results/F113/F113_artifact.zip
          printf '%s  %s\n' 6ccf9096a0d9d341b9f0b51b5aeb60b0b2a8129113a26e9c81463602ed6c4b01 results/F113/F113_artifact.zip | sha256sum -c -
      - name: Validate F113 baseline and two-density plan
        env:
          F113_ARTIFACT_ZIP: results/F113/F113_artifact.zip
        run: |
          set -euo pipefail
          python -m unittest discover -s research/j0740/f114 -p 'test_f114_*.py' -v
          python - <<'PY'
          import os
          from pathlib import Path
          from research.j0740.f114.f114_third_grid_fixedj_roots import read_f113, RHO_TICKS_1E10
          result, rows = read_f113(Path(os.environ['F113_ARTIFACT_ZIP']))
          assert len(rows) == 14 and len(result['fixed_J_solutions']) == 2
          assert len(RHO_TICKS_1E10) == 2
          print('F113_BASELINE_AND_THIRD_GRID_PLAN_PASS')
          PY
      - name: Restore exact pinned F99 EOS and compile RNS C on 1501x3001
        run: |
          set -euo pipefail
          cp research/j0740/f104/F99_DERIVED_1981_node_causal_cold_affine_EOS.rns m99.rns
          printf '%s  %s\n' c99eadee07bf6cbbf78f59b6171ef7e21ffad7d034f4ca4e9b7d85d36d9b4331 m99.rns | sha256sum -c -
          test "$(git -C rns-upstream rev-parse HEAD)" = '97e85d325a33e37f702306414533f6cd77812477'
          cp -a rns-upstream rns1501
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'research/j0740/f81')
          from f81_exact_mass_spin import patch_print_only
          p = Path('rns1501/rns.c')
          p.write_text(patch_print_only(p.read_text()))
          mf = Path('rns1501/makefile')
          t = mf.read_text()
          old = 'HIGHSIZE=-DMDIV=151 -DSDIV=301'
          assert t.splitlines().count(old) == 1
          mf.write_text(t.replace(old, 'HIGHSIZE=-DMDIV=1501 -DSDIV=3001', 1))
          src = Path('rns1501/findmodel.c').read_bytes()
          assert b'float ans, fh,fl,fm,fnew,sroot,xh,xl,xm,xnew,xacc=1e-5;' in src
          PY
          make -C rns1501 CC='gcc -include stdlib.h' rns
          sha256sum rns1501/rns | tee results/F114/F114_THIRD_GRID_NATIVE_C_BINARY_SHA256.txt
      - name: Solve two fixed-J roots on the third grid
        env:
          F113_ARTIFACT_ZIP: results/F113/F113_artifact.zip
        run: |
          set -euo pipefail
          OPENBLAS_NUM_THREADS=1 python -u research/j0740/f114/f114_third_grid_fixedj_roots.py \
            --f113 results/F113/F113_artifact.zip \
            --eos m99.rns --rns "$GITHUB_WORKSPACE/rns1501/rns" \
            --out results/F114/F114_THIRD_GRID_FIXEDJ_ROOTS.json \
            2>&1 | tee results/F114/F114_THIRD_GRID_FIXEDJ_ROOTS.log
      - name: Preserve baseline and every third-grid trial
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: J0740-F114-third-grid-fixed-J-roots
          path: |
            results/F113/F113_artifact.zip
            results/F114/
          if-no-files-found: warn
