name: J0740 F140 native cold crust seam derived physical bridge
on:
  pull_request:
    branches: [science/j0740-apr4-firstlaw-gr-pilot-20261117]
    paths:
      - 'research/j0740/f140/**'
      - '.github/workflows/j0740-f140-native-cold-seam.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original_six_cold_seam_reconstruction:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nuclear-multimessenger-astronomy/jester
          ref: e6768650ce992abfd1153a6833857572fe5cd230
          path: jester-upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned native LAL
        run: |
          set -euo pipefail
          python -m pip install 'numpy==2.3.5' 'lalsuite==7.26.16'
          python - <<'PY'
          import lalsimulation as ls
          for nm in ('SimNeutronStarEOSFromFile','SimNeutronStarEOSByName'):
              if not hasattr(ls,nm):raise RuntimeError('LAL_API_MISSING_'+nm)
          print('F140_TRUE_LAL_C_AVAILABLE')
          PY
      - name: Check original JESTER commit and source SHA
        run: |
          set -euo pipefail
          test "$(git -C jester-upstream rev-parse HEAD)" = e6768650ce992abfd1153a6833857572fe5cd230
          python - <<'PY'
          from pathlib import Path
          from research.j0740.f139.f139_shared_crust_seam import source_gate, SOURCE_SHAS
          for n in SOURCE_SHAS: source_gate(Path('jester-upstream/jesterTOV/tabulated_eos/lalsuite')/(n+'.npz'),n)
          print('F140_ORIGINAL_SEVEN_SOURCE_SHA_VERIFIED')
          PY
      - name: Math and adversarial source tests
        run: |
          set -euo pipefail
          python -m unittest discover -s research/j0740/f140 -p 'test_f140*.py' -v
      - name: Actual LAL C-backed six derived cold local bridges
        run: |
          set -euo pipefail
          python -u research/j0740/f140/f140_cold_seam_repair.py \
            --source-dir jester-upstream/jesterTOV/tabulated_eos/lalsuite \
            --out-dir results/F140/ 2>&1 | tee F140_NATIVE_REAL_LAL_JOURNAL.txt
      - name: Preserve actual native results including failure receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: J0740-F140-derived-six-cold-bridge-native-gates
          path: |
            results/F140/
            F140_NATIVE_REAL_LAL_JOURNAL.txt
          if-no-files-found: warn
