name: PostgreSQL adapter integration

on:
  pull_request:
    paths:
      - "core/postgres_memory.py"
      - "core/postgres_task_store.py"
      - "core/colony_postgres.py"
      - "core/colony_panel.py"
      - "tests/test_colony_postgres.py"
      - "scripts/check_postgres_colony_snapshot.py"
      - "scripts/check_colony_version_history.py"
      - "scripts/cano_pg_backup.py"
      - "scripts/check_cano_pg_backup_roundtrip.py"
      - "tests/test_cano_pg_backup.py"
      - "core/postgres_authorized_queue.py"
      - "core/cano_command_center.py"
      - "app.py"
      - "tests/test_cano_command_center.py"
      - "scripts/check_cano_cockpit_autosave.py"
      - "scripts/check_postgres_authorized_queue.py"
      - "scripts/check_postgres_persistence.py"
      - "scripts/check_postgres_task_store.py"
      - "tests/test_postgres_memory.py"
      - "tests/test_postgres_smoke_safety.py"
      - "requirements-persistence.txt"
      - ".github/workflows/postgres-adapter-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: ci_persistence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_persistence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-persistence.txt
      - name: Exercise actual PostgreSQL with synthetic data
        env:
          TEST_DATABASE_URL: postgresql://ci_user:synthetic-ci-only@localhost:5432/ci_persistence
        run: python scripts/check_postgres_persistence.py --env-name TEST_DATABASE_URL
      - name: Verify owner-scoped task persistence with synthetic data
        env:
          TEST_TASK_DATABASE_URL: postgresql://ci_user:synthetic-ci-only@localhost:5432/ci_persistence
        run: python scripts/check_postgres_task_store.py
      - name: Verify authorized queue using real PostgreSQL and synthetic users
        env:
          TEST_TASK_DATABASE_URL: postgresql://ci_user:synthetic-ci-only@localhost:5432/ci_persistence
        run: python -m scripts.check_postgres_authorized_queue
      - name: Verify colony backups with real PostgreSQL and synthetic owners
        env:
          TEST_DATABASE_URL: postgresql://ci_user:synthetic-ci-only@localhost:5432/ci_persistence
        run: python -m scripts.check_postgres_colony_snapshot

      - name: Verify previous CANO snapshot remains recoverable on replacement
        env:
          TEST_DATABASE_URL: postgresql://ci_user:synthetic-ci-only@localhost:5432/ci_persistence
        run: python -m scripts.check_colony_version_history

      - name: Verify CANO signed-in cockpit autosave and fresh session restore
        env:
          TEST_DATABASE_URL: postgresql://ci_user:synthetic-ci-only@localhost:5432/ci_persistence
        run: python -m scripts.check_cano_cockpit_autosave

      - name: Check secret-free libpq URI parsing regressions
        run: python -m unittest tests.test_cano_pg_backup -q

      - name: Exercise actual PostgreSQL 17 dump and isolated clean-database restore
        env:
          TEST_DATABASE_URL: postgresql://ci_user:synthetic-ci-only@localhost:5432/ci_persistence
          CANO_CI_ALLOW_DISPOSABLE_DB: "1"
        run: python -m scripts.check_cano_pg_backup_roundtrip
