name: Battery source original 10C capacity taper decomposition
on:
  pull_request:
    paths:
      - 'research/battery_curve_audit/original_t10_tail_current_audit.py'
      - 'research/battery_curve_audit/cccv_protocol_split.py'
      - 'tests/test_original_t10_tail_current_audit.py'
      - 'tests/test_cccv_protocol_split.py'
      - 'research/battery_curve_audit/original_50soc_dcir.py'
      - 'tests/test_original_50soc_dcir.py'
      - 'research/battery_curve_audit/author_soc_units_audit.py'
      - 'tests/test_author_soc_units_audit.py'
      - '.github/workflows/battery-original-10c-current-taper.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-four-t10-coulometry:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - name: Exact PR checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install author OCV interpolation libraries with pinned numerical versions
        run: python -m pip install --disable-pip-version-check --no-input numpy==2.3.5 pandas==2.2.3 scipy==1.17.0
      - name: Source and targeted regression guards
        run: |
          python -m unittest tests.test_original_t10_tail_current_audit tests.test_phase_boundary_thermal_audit tests.test_cccv_protocol_split tests.test_original_50soc_dcir tests.test_author_soc_units_audit -v
      - name: Fetch only four immutable publisher original ZIPs
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from research.battery_curve_audit.phase_boundary_thermal_audit import SOURCES
          from research.battery_curve_audit.figshare_three_archive_probe import fetch_bounded
          from research.battery_curve_audit.original_t10_tail_current_audit import SOURCE_IDS
          dst=Path('/tmp/cano_original_four_t10_tail');dst.mkdir(mode=0o700)
          for stem,name,size,digest in SOURCES:
              raw=fetch_bounded('https://ndownloader.figshare.com/files/'+str(SOURCE_IDS[stem]),size)
              assert len(raw)==size and hashlib.md5(raw).hexdigest()==digest
              (dst/name).write_bytes(raw)
          print('SOURCE_FOUR_PUBLISHER_MD5_PINS_PASS')
          PY
      - name: Derive original source current bins, voltage at taper, and full ET/AT delta
        run: |
          python -m research.battery_curve_audit.original_t10_tail_current_audit \
            /tmp/cano_original_four_t10_tail /tmp/cano_original_t10_current_taper.json
      - name: Replay author-published CCCV step 6 against eight original T10 measurements
        run: |
          python -m research.battery_curve_audit.cccv_protocol_split \
            /tmp/cano_original_four_t10_tail /tmp/cano_original_t10_CC_CV_protocol.json
      - name: Enforce real-source C-over-20 cutoff and explicit CC CV boundary non-identifiability
        run: |
          python - <<'PY'
          import json
          x=json.load(open('/tmp/cano_original_t10_CC_CV_protocol.json'))
          assert x['source_cell_count']==4 and x['original_ET_AT_csv_count']==8
          assert x['total_original_measurement_rows']==2_505_888
          assert x['source_cells_with_CC_CV_assignment_span_exceeding_total_change']==3
          assert x['publisher_zip_md5_crc_all_verified'] and x['author_original_source_capacity_reproduced']
          assert abs(x['nominal_C20_A']-.245)<1e-12
          assert x['author_explicit_voltage_hold_V']==2.5
          assert 'step_type=22' in x['author_protocol_table6']
          assert not x['actual_instrument_program_export_or_calibration_obtained']
          assert not x['physical_capacity_recovery_proven']
          assert not x['commercial_release_allowed']
          for cell in x['observations']:
              for stage in ('ET','AT'):
                  p=cell[stage]
                  assert abs(p['terminal_current_A']-.245)<.01
                  assert abs(p['terminal_voltage_V']-2.5)<.006
                  for boundary in p['boundaries'].values():
                      assert boundary['CV_near_2p5V_fraction']>.95
                      assert abs(boundary['CC_capacity_mAh']+boundary['CV_capacity_mAh']-p['full_discharge_capacity_mAh'])<2e-6
              assert cell['CC_CV_phase_allocation_not_source_state_logged']
          print('ORIGINAL_RPT_CCCV_C20_BOUNDARY_UNCERTAINTY_VALIDATED',x['total_original_measurement_rows'])
          PY
      - name: Validate exact physical rows and limit scientific interpretation
        run: |
          python - <<'PY'
          import json
          x=json.load(open('/tmp/cano_original_t10_current_taper.json'))
          assert x['four_publisher_originals_md5_crc_verified'] is True
          assert x['original_source_cells']==4 and x['original_csv_files']==8
          assert x['original_csv_rows']==2_505_888
          assert x['four_of_four_midcurrent_tail_contribution_increased']==4
          assert x['four_of_four_lowcurrent_tail_contribution_decreased']==4
          assert not x['independently_calibrated_instruments']
          assert not x['actual_physical_capacity_growth_proven']
          assert not x['temperature_causality_proven']
          assert not x['population_field_FPR_FNR_established']
          assert not x['production_release_allowed']
          for c in x['observations']:
              assert 0<c['delta_capacity_mAh']<15 and c['delta_duration_s']<0
              assert c['midcurrent_voltage_near_cutoff_in_both_recordings']
              assert c['delta_capacity_by_current_mAh']['1_to_4A']>0
              assert c['delta_capacity_by_current_mAh']['below_1A']<0
              assert c['original_zip_crc_verified']
              assert c['source_device_accuracy_or_calibration_verified'] is False
          print('FOUR_10C_SOURCE_CURRENT_TAPER_DESCRIPTIVE_ONLY_ACCEPTED')
          PY
      - name: Independently extract author's 50-percent-SOC 1C 10-second DCIR pulse from 24 ORIGINAL CSVs
        run: |
          python -m research.battery_curve_audit.original_50soc_dcir \
            /tmp/cano_original_four_50soc_dcir_24csv.json \
            --original-dir /tmp/cano_original_four_t10_tail
      - name: Verify real pulse counts, temperature sensitivity and scientific limitations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/cano_original_four_50soc_dcir_24csv.json')
          x=json.loads(p.read_text())
          assert x['publisher_originals_MD5_ZIP_CRC_verified'] is True
          assert x['source_cells']==4
          assert x['temperature_conditions_per_cell']==3
          assert x['original_source_measurement_CSV']==24
          assert x['original_rows_read']==7702133
          assert x['observed_pseudoOCV_corrected_AT_higher_than_ET_count']==12
          assert len(x['measurements'])==12
          assert x['independent_physical_cell_count_NOT_12'] is True
          assert x['12_condition_results_NOT_12_independent_cells'] is True
          assert x['temperature_equalization_only_a_local_secant_sensitivity_not_calibration'] is True
          assert x['measurement_calibration_uncertainty_quantified'] is False
          assert x['measurement_bias_excluded'] is False
          assert x['physical_cell_recovery_proven'] is False
          assert x['field_FPR_FNR_established'] is False
          assert x['commercial_release_allowed'] is False
          assert sum(z['paired_protocol_variant_positive_count'] for z in x['measurements'])==70
          assert all(z['paired_protocol_variant_total']==6 for z in x['measurements'])
          assert sum(z['thermal_ET_secant_scenario_after_equalization_milliohm'][0]<0
                     for z in x['measurements'] if z['temperature_setpoint_C']==10)==2
          assert all(-5.1<z[stage]['pulse_current_A']<-4.75
                     for z in x['measurements'] for stage in ('ET','AT'))
          print('AUTHOR_50SOC_ORIGINAL_PULSE_24CSV_NOT_PHYSICAL_CLAIM',x['original_rows_read'])
          PY
      - name: Audit public author notebook SOC percentage x Ah against dimensionally consistent SOC fraction
        run: |
          python -m research.battery_curve_audit.author_soc_units_audit \
            --original-dir /tmp/cano_original_four_t10_tail \
            --out /tmp/cano_author_soc_units_originals.json
      - name: Check percent-axis discrepancy without claiming published article measurements wrong
        run: |
          python - <<'PY'
          import json
          x=json.load(open('/tmp/cano_author_soc_units_originals.json'))
          assert x['source_archive_md5_and_zip_crc_verified']
          assert x['source_physical_cells']==4
          assert x['original_measurement_csv_files']==24
          assert x['original_measurement_rows']==7_702_133
          assert x['comparison_count']==12
          assert x['positive_notebook_axis']==12
          assert x['positive_dimensionally_consistent_axis']==12
          assert x['sign_changed_axis_choice']==0
          assert x['strict_author_example_undefined_measurements']==12
          assert x['strict_author_example_valid_measurements']==12
          assert x['stable_pre_pulse_rest_baseline_is_modification_of_author_example']
          assert not x['author_published_article_result_affected_proven']
          assert not x['cell_aging_causality_proven']
          assert not x['instrument_calibration_verified']
          assert not x['population_FPR_FNR_proven']
          assert not x['commercial_release_allowed']
          for p in x['measurements']:
              for stage in ('ET','AT'):
                  m=p[stage]
                  old=m['stable_rest_baseline_public_notebook_100x_axis']
                  fixed=m['stable_rest_baseline_fixed_SOC_fraction_axis']
                  assert abs(old['SOC_axis_max_Ah']-100*fixed['SOC_axis_max_Ah'])<.0002
                  assert abs(fixed['OCV_correction_mV'])>30*abs(old['OCV_correction_mV'])
                  assert .3 < old['R_mohm']-fixed['R_mohm']<.8
          print('REAL_AUTHOR_SOC_PERCENT_AXIS_100X_AND_24_RPT_METHOD_AUDITED')
          PY
      - name: Store numeric aggregate author notebook method discrepancy only (no waveform/raw ZIP)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: battery-author-notebook-percent-SOC-axis-24-original-CSV-audit
          path: /tmp/cano_author_soc_units_originals.json
          retention-days: 7
          if-no-files-found: error
      - name: Upload source-derived aggregate DCIR and thermal sensitivity only, never raw waveforms
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: battery-four-source-24csv-50soc-10s-dcir-and-temperature-sensitivity
          path: /tmp/cano_original_four_50soc_dcir_24csv.json
          retention-days: 7
          if-no-files-found: error
      - name: Upload numeric-only original source receipt, not raw signals
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: battery-four-10C-source-current-taper-aggregate
          path: /tmp/cano_original_t10_current_taper.json
          retention-days: 7
          if-no-files-found: error
      - name: Upload CCCV numerical protocol reconstruction with uncertainty, no raw signals
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: battery-four-original-T10-CCCV-boundary-uncertainty
          path: /tmp/cano_original_t10_CC_CV_protocol.json
          retention-days: 7
          if-no-files-found: error