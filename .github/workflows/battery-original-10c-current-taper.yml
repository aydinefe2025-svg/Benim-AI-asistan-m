name: Battery source original 10C capacity taper decomposition
on:
  pull_request:
    paths:
      - 'research/battery_curve_audit/original_t10_tail_current_audit.py'
      - 'tests/test_original_t10_tail_current_audit.py'
      - '.github/workflows/battery-original-10c-current-taper.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-four-t10-coulometry:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - name: Exact PR checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Source and targeted regression guards
        run: |
          python -m unittest tests.test_original_t10_tail_current_audit tests.test_phase_boundary_thermal_audit -v
      - name: Fetch only four immutable publisher original ZIPs
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from research.battery_curve_audit.phase_boundary_thermal_audit import SOURCES
          from research.battery_curve_audit.figshare_three_archive_probe import fetch_bounded
          from research.battery_curve_audit.original_t10_tail_current_audit import SOURCE_IDS
          dst=Path('/tmp/cano_original_four_t10_tail');dst.mkdir(mode=0o700)
          for stem,name,size,digest in SOURCES:
              raw=fetch_bounded('https://ndownloader.figshare.com/files/'+str(SOURCE_IDS[stem]),size)
              assert len(raw)==size and hashlib.md5(raw).hexdigest()==digest
              (dst/name).write_bytes(raw)
          print('SOURCE_FOUR_PUBLISHER_MD5_PINS_PASS')
          PY
      - name: Derive original source current bins, voltage at taper, and full ET/AT delta
        run: |
          python -m research.battery_curve_audit.original_t10_tail_current_audit \
            /tmp/cano_original_four_t10_tail /tmp/cano_original_t10_current_taper.json
      - name: Validate exact physical rows and limit scientific interpretation
        run: |
          python - <<'PY'
          import json
          x=json.load(open('/tmp/cano_original_t10_current_taper.json'))
          assert x['four_publisher_originals_md5_crc_verified'] is True
          assert x['original_source_cells']==4 and x['original_csv_files']==8
          assert x['original_csv_rows']==2_505_888
          assert x['four_of_four_midcurrent_tail_contribution_increased']==4
          assert x['four_of_four_lowcurrent_tail_contribution_decreased']==4
          assert not x['independently_calibrated_instruments']
          assert not x['actual_physical_capacity_growth_proven']
          assert not x['temperature_causality_proven']
          assert not x['population_field_FPR_FNR_established']
          assert not x['production_release_allowed']
          for c in x['observations']:
              assert 0<c['delta_capacity_mAh']<15 and c['delta_duration_s']<0
              assert c['midcurrent_voltage_near_cutoff_in_both_recordings']
              assert c['delta_capacity_by_current_mAh']['1_to_4A']>0
              assert c['delta_capacity_by_current_mAh']['below_1A']<0
              assert c['original_zip_crc_verified']
              assert c['source_device_accuracy_or_calibration_verified'] is False
          print('FOUR_10C_SOURCE_CURRENT_TAPER_DESCRIPTIVE_ONLY_ACCEPTED')
          PY
      - name: Upload numeric-only original source receipt, not raw signals
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: battery-four-10C-source-current-taper-aggregate
          path: /tmp/cano_original_t10_current_taper.json
          retention-days: 7
          if-no-files-found: error