name: Core tests

on:
  push:
    branches: ["main", "feature/buyuk-sistem-core", "fix/sqlite-backup-restore-20261031", "fix/executor-cancellation-20261104"]
  pull_request:
    branches: ["main", "feature/buyuk-sistem-core", "fix/sqlite-backup-restore-20261031"]

jobs:
  unittest:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install secure backup dependency
        run: python -m pip install "cryptography>=44,<51"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
