name: GKA NASA RW3 original reference context
on:
  pull_request:
    paths:
      - research/gka_nasa_rw3_reference_context.py
      - .github/workflows/gka-nasa-rw3-reference-context.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install scientific libraries
        run: |
          python -m pip install --only-binary=:all: numpy==2.5.5 scipy==1.18.1
      - name: Synthetic numerical controls
        run: python research/gka_nasa_rw3_reference_context.py --self-test
      - name: Original source reference context
        run: python research/gka_nasa_rw3_reference_context.py --output evidence/GKA_NASA_RW3_RAW_CONTEXT_20261124.json
      - name: Retain real evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: GKA-NASA-RW3-RAW-CONTEXT
          path: evidence/GKA_NASA_RW3_RAW_CONTEXT_20261124.json
          if-no-files-found: error
          retention-days: 30
