name: J0740 APR4 corrected Love Q source-reference regression
on:
  push:
    branches:
      - science/j0740-apr4-tov-love-q-repair-20261117
    paths:
      - "research/j0740/rotating_gr/tov_love_apr4_native_crust_exploratory_20261117.py"
      - "research/j0740/rotating_gr/test_apr4_love_q_metric_factor.py"
      - ".github/workflows/j0740-apr4-love-q-repair.yml"
permissions:
  contents: read
jobs:
  source-reference-q-physics:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: nuclear-multimessenger-astronomy/jester
          ref: e6768650ce992abfd1153a6833857572fe5cd230
          path: jester-source
          sparse-checkout: |
            jesterTOV/tabulated_eos/lalsuite
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy scipy
      - name: Source SHA locked independent TOV and tidal Love regression
        working-directory: research/j0740/rotating_gr
        run: python -W error -m unittest -v test_apr4_love_q_metric_factor
      - name: Recompute corrected static target-mass TOV-Love on 865-node source
        run: |
          mkdir -p results
          python research/j0740/rotating_gr/tov_love_apr4_native_crust_exploratory_20261117.py \
            --source jester-source/jesterTOV/tabulated_eos/lalsuite/APR4_EPP.npz \
            --output results/J0740_APR4_TOV_LOVE_CORRECTED_Q_20261117.json
      - name: Readback corrected report against JESTER M-R-Lambda source
        run: |
          python - <<'PY'
          import json,numpy as np
          from pathlib import Path
          p=Path("results/J0740_APR4_TOV_LOVE_CORRECTED_Q_20261117.json")
          out=json.loads(p.read_text())
          fine=out["solutions"][-1]
          with np.load("jester-source/jesterTOV/tabulated_eos/lalsuite/APR4_EPP.npz") as z:
            m,r,l=(np.asarray(z[k],float) for k in ("masses_EOS","radii_EOS","Lambda_EOS"))
          target=2.073
          hits=np.where((m[:-1]-target)*(m[1:]-target)<=0)[0]
          assert len(hits)==1, ("non-unique target-M crossing",hits)
          i=int(hits[0]);t=(target-m[i])/(m[i+1]-m[i])
          ref_R=float(r[i]+t*(r[i+1]-r[i]));ref_L=float(l[i]+t*(l[i+1]-l[i]))
          rel_L=abs(fine["Lambda"]/ref_L-1)
          d_R=abs(fine["R_km"]-ref_R)
          assert rel_L<0.02,(fine["Lambda"],ref_L,rel_L)
          assert d_R<0.02,(fine["R_km"],ref_R,d_R)
          result={"APR4_PCHIP_865_ROW_CORRECTED_Q":"SOURCE_COMPARISON_PASS_CONDITIONAL_EOS",
                  "LAL_suite_generator_unpinned":True,
                  "old_TOV_Love_Lambda":27.828683013206472,
                  "JESTER_reference_Lambda":ref_L,
                  "corrected_Lambda":fine["Lambda"],
                  "relative_Lambda_difference":rel_L,
                  "JESTER_source_R_km":ref_R,"corrected_R_km":fine["R_km"],
                  "R_abs_difference_km":d_R,
                  "EOS_physical_crust_certification":"NOT_ESTABLISHED",
                  "EOS_BAYES":"NOT_RUN"}
          Path("results/J0740_APR4_TOV_LOVE_CORRECTED_VS_SOURCE_20261117.json").write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")
          print(json.dumps(result,indent=2))
          PY
      - name: Retain corrected original-source physics evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: j0740-apr4-tov-love-q-fixed-source
          path: results/
          if-no-files-found: warn
          retention-days: 30
