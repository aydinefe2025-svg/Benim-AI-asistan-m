name: EPS common-mode loss candidate
on:
  pull_request:
    paths:
      - research/eps_lab_v4/common_loss.py
      - research/eps_lab_v4/test_common_loss.py
      - research/eps_lab_v4/evaluate_common_loss.py
      - .github/workflows/eps-common-loss.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  common_loss:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: research/eps_lab_v4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python -m pip install numpy==1.26.4 scipy==1.13.1
      - run: python -m unittest -v test_common_loss.py
      - run: python evaluate_common_loss.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: EPS-common-loss-evidence
          path: research/eps_lab_v4/EPS_COMMON_LOSS.json
          if-no-files-found: error
