          # Use exact unperturbed initial data only, matched resolutions.
          /usr/bin/python3 - <<'PY'
          import pathlib, os, json
          d=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'evidence'
          s=(d/'star.inp').read_text().split('<output1>')[0]
          s+='\n<hydro>\ntable = '+str(d/'cold.h5')+'\ngamma_th = 1.75\ndfloor = 1e-12\ntfloor = 1e-10\nrsolver = hlle\n'
          s+='\n<output1>\nfile_type = hst\ndt = 0.1\ndata_format = %.18g\n<output2>\nfile_type = hdf5\nvariable = prim\ndt = 2\n<output3>\nfile_type = hdf5\nvariable = geom.con\ndt = 2\n<output4>\nfile_type = rst\ndt = 2\n'
          (d/'star.inp').write_text(s)
          (d/'source_gate_reference.json').write_text(json.dumps(dict(run=45714775013,artifact=15069975802,sha256='3bec88d1406947e188f9becaeab9cf716839e580764ce9ddea409a6fa6d4820d',H_relative_error=2.3840752858557353e-15,M_relative_error=2.8340148683525334e-15)))
          PY
          for i in "${!args[@]}"; do
            case "${args[i]}" in
              output2/dt=*) args[i]=output2/dt=2;;
            esac
          done
          # Diagnostic intervention: use stationary gauge coefficients instead
          # of the vacuum gauge-wave driver; evolve all physical fields normally.
          # Radiative baseline run 45719404582: 96.5% of M norm2 inside r<8.
          # No EOS, matter source, or physical threshold changes.
          args+=(z4c/lapse_oplog=0 z4c/lapse_harmonic=0 z4c/lapse_advect=0 z4c/shift_Gamma=0 z4c/shift_eta=0 z4c/shift_alpha2Gamma=0 z4c/shift_H=0 z4c/shift_advect=0)
          printf '%q ' ./bin/athena "${args[@]}" > "$E/command.txt"
          ./bin/athena "${args[@]}" 2>&1 | tee "$E/native.log"
          grep -q 'Terminating on time limit' "$E/native.log"
          if grep -Eq 'Tau is not finite|NO_SOLUTION|INVALID_METRIC_DETERMINANT' "$E/native.log"; then exit 1; fi
          /usr/bin/python3 - <<'PY'
          import pathlib,json,re,os,numpy as np,h5py
          d=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'evidence'
          f=next((d/'run').rglob('*.hst')); lines=f.read_text().splitlines()
          names=re.findall(r'\[\d+\]=([^ ]+)',next(x for x in lines if '[1]=time' in x))
          a=np.loadtxt(f);assert a.ndim==2 and a.shape[1]==len(names) and np.isfinite(a).all() and a[-1,0]>=1.99
          col=lambda name:a[:,names.index(name)]
          mass,jz,H,M,rho,fail,alpha=[col(k) for k in ('mass','J0740_Jz','H-norm2','M-norm2','max_rho','num_c2p_fail','min_alpha')]
          assert mass[0]>0 and abs(jz[0])>0 and min(H)>=0 and min(M)>=0
          dmass=float(np.max(abs(mass/mass[0]-1)));dj=float(np.max(abs(jz/jz[0]-1)));drho=float(np.max(abs(rho/rho[0]-1)))
          srcE,srcS=col('J0740_Esrc_L1'),col('J0740_Ssrc_L1')
          gates=dict(finite=True,primitive_recovery=bool(max(fail)==0),positive_lapse=bool(min(alpha)>0),mass_drift_below_0p1pct=dmass<=1e-3,J_drift_below_1pct=dj<=.01,density_drift_below_2pct=drho<=.02,momentum_norm2_non_growth=bool(M[-1]<=M[0]),energy_source_closure=bool(max(srcE)/mass[0]<1e-4),momentum_source_closure=bool(max(srcS)/mass[0]<1e-4))
          files=list((d/'run').glob('*.athdf'));assert files
          for p in files:
              with h5py.File(p) as h:
                  for k,v in h.items():
                      if isinstance(v,h5py.Dataset) and np.issubdtype(v.dtype,np.number):assert np.isfinite(v[:]).all(),(p,k)
          result=dict(status='SHORT_MATCHED_RESOLUTION_SCREEN_ONLY',n=int(os.environ['J0740_N']),max_time=float(a[-1,0]),rotation_target=585.8691805265147,mass_initial=float(mass[0]),J_initial=float(jz[0]),mass_drift=dmass,J_drift=dj,rho_drift=drho,H0=float(H[0]),Hfinal=float(H[-1]),M0=float(M[0]),Mfinal=float(M[-1]),Hmax=float(max(H)),Mmax=float(max(M)),gates=gates)
          (d/'receipt.json').write_text(json.dumps(result,indent=2));print(json.dumps(result,indent=2))
          # Localize errors without excluding any region from the global gate.
          for p in sorted((d/'run').glob('*out3*.athdf')):
              with h5py.File(p) as f:
                  names=[x.decode() for x in f.attrs['VariableNames']]
                  ds=f[f.attrs['DatasetNames'][0].decode()]
                  q=int((ds.shape[-1]-16)//2); sl=slice(q,q+16)
                  m=ds[names.index('geom.con.M'),:,sl,sl,sl]
                  x=f['x1v'][:,sl]; y=f['x2v'][:,sl]; z=f['x3v'][:,sl]
                  edge=np.maximum(np.maximum(abs(x[:,None,None,:]),abs(y[:,None,:,None])),abs(z[:,:,None,None]))>20
                  print('MOMENTUM_LOCALIZATION',float(f.attrs['Time']),float(m[edge].sum()),float(m[~edge].sum()))
                  inner=x[:,None,None,:]**2+y[:,None,:,None]**2+z[:,:,None,None]**2<64
                  print('MOMENTUM_STAR_REGION',float(f.attrs['Time']),float(m[inner].sum()),float(m[~inner].sum()))
          assert all(gates.values()), 'short screen rejected; do not extend unqualified evolution'
          PY
