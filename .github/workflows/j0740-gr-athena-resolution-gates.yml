      - name: Native coupled RNS fluid evolution
        shell: bash
        run: |
          set -euo pipefail
          cd athena
          E="$GITHUB_WORKSPACE/evidence"
          cp inputs/z4c/awa/z4c_AwA_gauge_wave_1s.inp "$E/star.inp"
          cat >> "$E/star.inp" <<EOF

          <hydro>
          table = $E/cold.h5
          gamma_th = 1.75
          dfloor = 1e-12
          tfloor = 1e-10
          rsolver = hlle
          EOF
          export J0740_GRID="$E/f171_grid.bin" OMP_NUM_THREADS=2
          args=(-i "$E/star.inp" -d "$E/run" problem/filename="$E/star.par" problem/verbose=true job/problem_id=j0740_native time/tlim=2 time/integrator=rk3 time/cfl_number=0.2 mesh/nx1=$J0740_N mesh/nx2=$J0740_N mesh/nx3=$J0740_N meshblock/nx1=16 meshblock/nx2=16 meshblock/nx3=16 mesh/x1min=-24 mesh/x1max=24 mesh/x2min=-24 mesh/x2max=24 mesh/x3min=-24 mesh/x3max=24 mesh/ix1_bc=gr_sommerfeld mesh/ox1_bc=gr_sommerfeld mesh/ix2_bc=gr_sommerfeld mesh/ox2_bc=gr_sommerfeld mesh/ix3_bc=gr_sommerfeld mesh/ox3_bc=gr_sommerfeld mesh/num_threads=2 output2/dt=0.1 time/xorder_use_aux_s=false hydro/smooth_temperature=false z4c/r_max_con=100)
