name: CANO PostgreSQL real process-crash recovery

on:
  push:
    branches:
      - test/cano-postgres-process-crash-recovery-20261105
    paths:
      - scripts/check_cano_pg_interrupted_mission.py
      - .github/workflows/cano-pg-interruption-e2e.yml
  pull_request:
    branches:
      - main
      - fix/sqlite-backup-restore-20261031
    paths:
      - scripts/check_cano_pg_interrupted_mission.py
      - .github/workflows/cano-pg-interruption-e2e.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-pg-process-crash:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pg_major: ["17", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.pg_major }}
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: ci_persistence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_persistence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CANO_CI_ALLOW_DISPOSABLE_DB: "1"
      TEST_DATABASE_URL: postgresql://ci_user:synthetic-ci-only@127.0.0.1:5432/ci_persistence
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install repository test dependencies
        run: python -m pip install -r requirements.txt
      - name: Kill model process and verify fresh-process PostgreSQL restore
        run: python -m scripts.check_cano_pg_interrupted_mission
