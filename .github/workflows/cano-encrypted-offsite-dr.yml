name: CANO encrypted offsite PostgreSQL disaster recovery

on:
  pull_request:
    paths:
      - 'scripts/cano_encrypted_backup.py'
      - 'scripts/check_cano_encrypted_roundtrip.py'
      - 'tests/test_cano_encrypted_backup.py'
      - '.github/workflows/cano-encrypted-offsite-dr.yml'
      - 'requirements-persistence.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  encrypted-dr:
    name: 'PG${{ matrix.pg }}: encrypted export / isolated restore'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        pg: ['17', '18']
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: ci_persistence
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test dependencies
        run: python -m pip install -r requirements-persistence.txt
      - name: Verify secret isolation, authenticated encryption, fail-closed guard
        run: python -W error::ResourceWarning -m unittest discover -s tests -p 'test_cano_encrypted_backup.py' -q
      - name: Real PostgreSQL encrypted backup and isolated restore (SYNTHETIC ONLY)
        env:
          TEST_DATABASE_URL: postgresql://ci_user:synthetic-ci-only@localhost:5432/ci_persistence
          CANO_CI_ALLOW_DISPOSABLE_DB: '1'
          CANO_CI_PG_MAJOR: ${{ matrix.pg }}
        run: python -m scripts.check_cano_encrypted_roundtrip
      # NEVER upload the DB dump or encryption key as Actions artifacts.
