name: CANO PostgreSQL queen epoch fencing (synthetic CI)

on:
  pull_request:
    branches:
      - fix/sqlite-backup-restore-20261031
    paths:
      - core/postgres_leader_lease.py
      - scripts/check_cano_pg_queen_lease.py
      - scripts/provision_cano_queen_leases.sql
      - .github/workflows/cano-queen-lease.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-pg-lease:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: ci_queen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_queen_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned persistence dependencies
        run: python -m pip install -r requirements-persistence.txt
      - name: Verify real PostgreSQL lease with concurrent nodes and process kill
        env:
          CANO_QUEEN_TEST: "1"
          TEST_DATABASE_URL: postgresql://ci_user:synthetic-ci-only@localhost:5432/ci_queen_test
        run: python -m scripts.check_cano_pg_queen_lease
