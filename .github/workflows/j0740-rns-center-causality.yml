name: J0740 actual RNS center vs native JESTER sound speed
on:
  pull_request:
    paths:
      - "research/j0740/rotating_gr/center_causality.py"
      - "research/j0740/rotating_gr/test_center_causality.py"
      - ".github/workflows/j0740-rns-center-causality.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-center-causality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: nuclear-multimessenger-astronomy/jester
          ref: e6768650ce992abfd1153a6833857572fe5cd230
          path: jester-upstream
          sparse-checkout: |
            jesterTOV/tabulated_eos/lalsuite
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy
      - name: Unit test original negative cs2 source, stability and interpolation guards
        working-directory: research/j0740/rotating_gr
        run: python -m unittest -v test_center_causality
      - name: Retrieve pinned successful seven EOS RNS artifact (NO RNS re-run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prior-rns
          gh run download 42353019033 --repo "$GITHUB_REPOSITORY" \
            --name j0740-seven-eos-rns-fixed-mass-results \
            --dir prior-rns
          sha256sum prior-rns/J0740_seven_EOS_full_GR_fixed_spin_mass.json
      - name: Cross-check original EOS SHA and compute native cs2 at seven rotating centers
        run: |
          python research/j0740/rotating_gr/center_causality.py \
            --rns-json prior-rns/J0740_seven_EOS_full_GR_fixed_spin_mass.json \
            --jester-dir jester-upstream/jesterTOV/tabulated_eos/lalsuite \
            --out results/J0740_native_cs2_at_rotating_centers.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: j0740-rns-center-native-cs2-evidence
          path: results/J0740_native_cs2_at_rotating_centers.json
          if-no-files-found: warn
          retention-days: 30
