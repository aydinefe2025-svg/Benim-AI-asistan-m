<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CANO EPS Lab | Gözlem</title><style>body{font:16px system-ui;background:#101b27;color:#f1f5f9;margin:24px;max-width:850px}button,select{font:inherit;padding:10px;margin:4px;border-radius:6px}section{border:1px solid #40566b;border-radius:12px;padding:16px;margin:12px 0}strong{font-size:1.5rem}pre{white-space:pre-wrap}canvas{width:100%;height:160px;background:#152637}</style><h1>CANO EPS Lab — gözlem modu</h1><p>Gerçek geçmiş saha ölçümleri, canlı sensör bağlantısı yok. Cihaz kontrolü kapalı.</p><section><p id="summary"></p><select id="scenario" aria-label="Ölçüm örneği"></select><button id="play">Başlat</button><button id="pause">Duraklat</button><button id="reset">Sıfırla</button><p>Durum: <strong id="status">HAZIR</strong></p><p id="values"></p><canvas id="chart" width="800" height="160"></canvas><p id="progress"></p><pre id="events"></pre></section><p>Seçilmiş 120 satırlık gerçek örnekler. %5 güç dengesizliği, 5 ardışık uygun örnek. Etiketler yalnızca gözlem amacıyla; alarm arıza türünü teşhis etmez.</p><script>const D=__REPLAY_DATA__;const $=id=>document.getElementById(id), names=['Normal','Kısa devre','Dirençle bozulma','Açık devre','Gölge'];D.preview_windows.forEach((w,i)=>{$('scenario').add(new Option(names[w.label],i))});$('summary').textContent=D.rows.toLocaleString('tr-TR')+' özgün kayıt işlendi; akış/toplu farkı: '+D.stream_batch_mismatches;let j=0,streak=0,timer=null,history=[],last='';function reset(){clearInterval(timer);timer=null;j=0;streak=0;history=[];last='';$('status').textContent='HAZIR';$('values').textContent='';$('progress').textContent='';$('events').textContent='';draw()}function draw(){const c=$('chart'),ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);ctx.strokeStyle='#ffb454';ctx.beginPath();ctx.moveTo(0,152);ctx.lineTo(800,152);ctx.stroke();ctx.strokeStyle='#77e1ca';ctx.beginPath();history.forEach((s,i)=>{let x=i*800/119,y=160-160*(s??0);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()}function tick(){const w=D.preview_windows[Number($('scenario').value)];if(j>=w.rows.length){clearInterval(timer);timer=null;return}const [v1,v2,i1,i2,g]=w.rows[j],p=v1*i1,q=v2*i2,ok=[v1,v2,i1,i2,g].every(x=>Number.isFinite(x)&&x>=0)&&g>=200&&Number.isFinite(p+q)&&p+q>0,s=ok?Math.abs(p-q)/(p+q):null;streak=ok&&s>.05?streak+1:0;const status=streak>=5?'ALARM':streak?'İZLE':ok?'NORMAL':'VERİ YETERSİZ';$('status').textContent=status;$('values').textContent='Dizi 1: '+p.toFixed(1)+' W | Dizi 2: '+q.toFixed(1)+' W | Dengesizlik: '+(s===null?'—':(s*100).toFixed(2)+'%');if(status!==last){$('events').textContent=('Satır '+(w.start+j)+': '+status+'\n'+$('events').textContent).slice(0,2000);last=status}history.push(s);j++;draw();$('progress').textContent=j+' / '+w.rows.length+' (kaynak sıra '+(w.start+j-1)+')'}$('play').onclick=()=>{if(timer===null&&j<120)timer=setInterval(tick,100)};$('pause').onclick=()=>{clearInterval(timer);timer=null};$('reset').onclick=reset;$('scenario').onchange=reset;reset();</script></html>
