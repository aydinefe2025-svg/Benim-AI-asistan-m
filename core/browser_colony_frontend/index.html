<!doctype html>
<html lang="tr">
<head><meta charset="utf-8"><title>CANO local backup</title></head>
<body style="margin:0;padding:0;overflow:hidden">
<script>
"use strict";
// This optional storage lives only in this browser/component origin.
// No external JavaScript, fetches, dynamic HTML, or source-content execution.
const KEY = "cano.colony.opt_in.v1";
let lastToken = null;
let lastMessage = null;
function send(type, body) {
  window.parent.postMessage(Object.assign(
    {isStreamlitMessage: true, type: type}, body || {}), "*");
}
function report(value) {
  const encoded = JSON.stringify(value);
  if (encoded === lastMessage) return;
  lastMessage = encoded;
  send("streamlit:setComponentValue", {value: value, dataType: "json"});
}
window.addEventListener("message", function(event) {
  if (event.source !== window.parent || !event.data ||
      event.data.type !== "streamlit:render") return;
  const args = event.data.args || {};
  try {
    if (args.clear === true) {
      localStorage.removeItem(KEY);
      lastToken = null;
      report({status:"ok", payload:"", ack:"cleared"});
      return;
    }
    const write = args.write;
    if (write && typeof write.token === "string" &&
        /^[0-9a-f]{64}$/.test(write.token) &&
        typeof write.payload === "string" &&
        write.payload.length <= 1000000 && write.token !== lastToken) {
      localStorage.setItem(KEY, write.payload);
      lastToken = write.token;
    }
    const payload = localStorage.getItem(KEY) || "";
    report({status:"ok", payload:payload, ack:lastToken});
  } catch (_err) {
    report({status:"error", reason:"storage_unavailable", ack:null});
  }
});
send("streamlit:componentReady", {apiVersion:1});
send("streamlit:setFrameHeight", {height:0});
</script>
</body>
</html>
